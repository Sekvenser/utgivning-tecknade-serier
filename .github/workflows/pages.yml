name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: python3 cli.py build
      - name: Assemble site (web/ at the root, data/ alongside it)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/data          # drop the local-dev symlink (or its dereferenced copy)
          mkdir -p _site/data
          cp data/books.json _site/data/
          cp -r data/covers _site/data/covers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
