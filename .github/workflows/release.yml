name: Release on PR merge

# Triggered on push to main (i.e. a merged PR, assuming main is protected
# against direct pushes) rather than `pull_request: closed`: a pull_request-
# triggered workflow gets a read-only token when the PR is from a fork,
# which would silently fail to create a release for external contributors.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: python3 cli.py build

      - name: Compute next version
        id: version
        run: |
          latest=$(gh release list --limit 200 --json tagName -q '.[].tagName' \
            | sed -n 's/^v\([0-9]\+\)\.\([0-9]\+\)$/\1.\2/p' \
            | sort -t. -k1,1n -k2,2n | tail -n1)
          if [ -z "$latest" ]; then
            next="v1.0"
          else
            major=$(echo "$latest" | cut -d. -f1)
            minor=$(echo "$latest" | cut -d. -f2)
            next="v${major}.$((minor + 1))"
          fi
          echo "Latest: ${latest:-none}, next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: data/books.json
