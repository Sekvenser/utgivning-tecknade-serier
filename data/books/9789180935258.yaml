description: Girl power, svek och lögner. Kärleken är trassligare än någonsin. Abeba försöker ta reda
  på vem Navid är ihop med. Charlie döljer sitt hemliga förhållande för att behålla sina vänner. Adele
  och Enjoy har hittat kärleken och Lina fortsätter försöka lista ut vad riktig kärlek egentligen är.
  Allt ställs på sin spets när Samir utlyser en tävling om att utse skolans fulaste par.Tuffa teman om
  hjärta och smärta, vackert skildrat av författarduon BéKa och illustratören Mayas mjuka bildspråk. En
  berättelse om utpressning, hjärtesorg, och sviktande självförtroende. Men också om hur vänskap och förlåtelse
  kan bära oss igenom det tyngsta mörkret. Hemlig kärlek är den femte delen i den grafiska serien LOVE.
  Hegas lättlästa böcker väcker läslusten hos barn och unga.
