description: Någon har satt upp en lapp på dörren där det står "SLUTA". Men vem har skrivit den och varför?
  Förvirringen bland grannarna är stor. Då dyker en mullvad upp som bor under jorden bredvid deras trapp.
  Hen vill inte få matkassar ställda på taket till sitt hus. Det är mullvaden som skrivit lappen. Grannarna
  lär sig förstå och respektera varandras utrymme och får en ny vän i den lilla mullvaden.
