description: "Skarpskytten Jonas Crow vann inga medaljer under inbördeskriget; däremot en federal arresteringsorder\
  \ för en rad brott han påstås ha begått under namnet Lance Strikland.\n\r\nNu lever han som resande\
  \ begravningsentreprenör och allt han har här i livet är sin likvagn, sin tama gam Jed, sin orubbliga\
  \ cynism… och sin kärlek till Rose Prairie.\n\r\nEftersom hon trodde att hennes närvaro utsatte honom\
  \ för fara lämnade hon honom innan deras romans ens hann börja.\n\r\nEftersom hans liv inte har någon\
  \ mening utan henne har Jonas föresatt sig att hitta henne, oavsett riskerna."
