description: 'Johan Wanloo lever ett så händelselöst liv att han till och med drömmer om att han ligger
  på soffan och tar en tupplur. Något måste göras! Efter att ha diskuterat med sina bättre och sämre jag
  tar han helt enkelt reda på hur man gör för att SMAKA PÅ LIVET. Det blir en lista att bocka av. Göra
  något kriminellt, ta skogspromenader, sjunga i kör, köpa en båt, utsätta sig för fara.... Johan skyr
  inget. Men hur bra går det?


  Det blir högt och lågt, många haverier men även vissa succéer. Med sitt absoluta gehör för humor och
  med tämligen fria associationer gör Johan Wanloo en tecknad bucketlist där jakten på meningsfullhet
  aldrig slutar där man har tänkt. Kanske är en utflykt till Årjängstrollet allt man egentligen behöver?
  Innan det är dags för nästa tupplur.'
