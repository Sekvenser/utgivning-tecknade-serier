description: 'En antirasistisk forskare och en konstnär försöker ta körkort i Säffle. De är alldeles för
  gamla och det är alldeles för svårt.


  Deras tidigare erfarenheter visar sig värdelösa på vägarna. Ingen är intresserad av ett brutalnaivistiskt
  formspråk på E6:an. Ingen bryr sig om ens samlade kunskaper om antifascistisk organisering när man ska
  hitta dragläget.


  I en tid som tycks präglas av infantila uttryck, där högerextrema rörelser använder sig av gulliga cartoonfigurer
  och tech-jättar vurmar för Sagan om Ringen-karaktärer försöker två medelålders krakar med Transportstyrelsens
  hjälp äntligen bli vuxna på riktigt.


  I boken fördjupar sig Granér i de stora frågorna. Borde teoriprovet fokusera mer på Stig Dagermans självmord
  i ett garage? Varför har det så låg status att vara dum när hela världen är tappad bakom en vagn? Hur
  backar man runt hörn?


  En bok för alla med eller utan körkort'
