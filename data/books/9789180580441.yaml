description: Nick och Charlie har äntligen sagt de där tre små orden till varandra och Charlie har nästan
  lyckats övertala sin mamma att han ska få sova över hos Nick. Men kan han hitta det självförtroende
  han behöver för att ta nästa steg i deras relation? Och vad händer när Nick börjar universitetet? Kommer
  allt att förändras då? Det här är femte boken i Alice Osemans serie Heartstopper, som har gjort succé
  både i bokform och på Netflix. Heartstopper berättar om den första stora, förvirrande och allt uppslukande
  kärleken, men handlar också om att stå för den man är och att lära sig acceptera sig själv. Serien publicerades
  först digitalt på nätet där den snabbt fick en stor mängd läsare. Då författaren och illustratören Alice
  Oseman bestämde sig för att hennes webcomic också skulle ges ut som tryckt bok tog det bara två timmar
  att finansiera den via Kickstarter. Några år senare har hennes egenpublicerade serie blivit en internationell
  bästsäljare och översatts till fler än 30 språk.
