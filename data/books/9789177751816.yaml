description: Fjärde boken i Galagos Hokus Pokus-serie för barn! Ida är på väg med mamma, pappa och lillebror
  hem till gammelmoster Inga, när det kör vilse i en fruktansvärd snöstorm. För att ta skydd undan ovädret
  stannar de vid Laban Bolls krog. Det är varmt och hemtrevligt, men Ida och hennes lillebror inser snart
  att allt inte står rätt till på det mysiga matstället.
