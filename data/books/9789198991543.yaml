description: Rick Jones och sju Avengers från olika tidsperioder är vilse i tiden! När Rick Jones kosmiska
  krafter ännu en gång aktiveras hamnar han omedelbart i siktet för Immortus – en av Avengers ädsta fiender.
  Men det visar sig att också Kang, Supreme Intelligence och Libra har planer för den unge heders-avengern.
  För att klara sig ur knipan måste Rick plocka sju försvarare från dåtiden, nutiden och framtiden – och
  ge sig ut på ett äventyr som kommer att avslöja enastående hemligheter om Avengers och deras ärkefiender.
