description: Den förtalsdömde journalisten Mikael Blomkvist anlitas av den åldrade industrimannen Henrik
  Vanger som vill ha hjälp med att försöka lösa gåtan med hans sextonåriga brorsdotter Harriets försvinnande
  i september 1966. Som medhjälpare får Blomkvist den unga, struliga datahackern Lisbeth Salander och
  tillsammans börjar de gräva i familjen Vangers mörka förflutna.
