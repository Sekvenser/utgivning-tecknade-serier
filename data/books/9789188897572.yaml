description: Tintin och Milou reser till Syldavien för att bistå en vetenskapsman i hans forskning, men
  istället hamnar de mitt i en lömsk komplott som avser att störta kung Muskar XII, genom att dennes spira
  ska stjälas! Det är i detta äventyr som Tintin först möter operadivan Bianca Castafiore, näktergalen
  från Milano.
