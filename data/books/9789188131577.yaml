description: SKYNET HAR BESEGRATS. Ändå fortsätter de kvarvarande maskinerna att strida. När motståndsrörelsen
  upptäcker att Skynet har skapat en tidsmaskin inser de att kriget är långt ifrån slut. Det första uppdraget,
  att döda Sarah Connor innan John Connor föds, har misslyckats – men Skynet har inte gett upp. Motståndssoldater
  och Terminator-robotar reser tillbaka i tiden från 2029 till 1984 för det slutgiltiga avgörandet. Berättelsen
  i det här seriealbumet påbörjades innan filmen Terminator 2 fanns och är en originell uppföljare till
  den första Terminator-filmen!
