description: Den fattiga sameflickan Stina Larsdotter levde i mitten på 1800-talet. Stina slutade aldrig
  att växa och detta fascinerade många och hon övertalades att visa upp sig mot betalning. Stina reste
  runt och visades upp som Lapplands jättinna. Stina gick från att bli utnyttjad till en stark affärskvinna
  som kunde hjälpa både sina föräldrar och sig själv ekonomiskt. När Stina dog ställdes hon ut på Karolinska
  institutet men 2024 ska hon begravas i hembyn. Serieroman. Från 9 år och uppåt.
