description: Del 2 i serien som börjar med Den lilla häxan. Det börjar en ny jättekonstig och rolig tjej
  i klassen som blir kompis med Ida. Trillingarna är elaka som vanligt och Ida råkar förvandla dem till
  paddor. Hon matar dem med daggmaskar och gömmer dem i sin ryggsäck. Vuxenvärlden med Greta Borg i spetsen
  är förstås i upplösningstillstånd över att trillingarna är borta. Ska Ida våga häva förtrollningen av
  trillingarna och riskera att de berättar allt?
