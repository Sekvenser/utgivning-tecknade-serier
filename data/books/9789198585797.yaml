description: I mars 2020, då hela planeten gick mot en nedstängning, insåg serietecknaren Simon Hanselmann
  att det världen behövde mest av allt just då var komisk, penisbaserad underhållning, så han skapade
  djärvt den bästa webb-serie som någonsin gjorts... En vindlande historia som pendlade snabbt mellan
  komedi, skräck, action, genusstudier och såpopera.  Krisläge vägrar ta foten från gaspedalen medan vi
  alla kastats framåt mot okända mål.   ”Det är en nattsvart och på alla sätt gränslös skildring av 2020,
  med karantän, upplopp på gatorna, tungt drogmissbruk, reality-TV, wokeness och en lika fri som sorglig
  sexualitet. Som alltid är det humorn som tar oss igenom mörkret. Årets samtidsskildrare.”  - Mats Jonsson,
  intervjuad i ETC    ”Ett karantänsatt kammarspel om ugglan, häxan, varulven och de andra i en kombinerad
  influencerstudio och pundarkvart där omvärlden tränger sig på via kravaller och deplattformeringar.”
  - Rasmus Fleischer, Expressen    ”En explosiv blandning av samtidssatir och såpa där det hatälskade
  persongalleriet från hans tidigare serier om Megg, Mogg, Uggla och Varulv Jones spräcker gränserna för
  både misär och vänskap. Kavalkaden av polisvåld, buttplugs, valkampanjer och kändisskap eskalerar i
  absurditet dag för dag i takt med årets verkliga händelser”  - Iso Lindh, Arbetaren    "Den bästa alternativserietecknaren
  just nu"  - Liv Strömquist, intervjuad i Vi Läser
