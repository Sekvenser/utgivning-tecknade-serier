description: Om du odlar bivänliga frön, så får du blommor som lockar till sig och ger nektar och pollen
  åt bin, fjärilar och andra pollinatörer*. Och det är bra. För dessa små vänner behöver all hjälp de
  kan få. De hotas nämligen bl a av bekämpningsmedel, matbrist och klimatförändringar. Vi människor är
  helt beroende av bin och andra insekters livsviktiga arbete. Ungefär en tredjedel av den mat vi äter
  är pollinerad av dem. Som tur är finns det lösningar och i den här tidningen får du läsa om när Bamse
  och hans vänner gör allt vad de kan för att hjälpa till. För det finns saker som vi alla kan göra; t
  ex att låta en del av gräsmattan bli en äng, plantera bivänliga blommor eller bygga ett vildbihotell.
  Om du bor i en lägenhet, kan du kanske fråga de som har hand om gården om ni tillsammans kan hjälpa
  bina? Eller kanske vill din lärare hjälpa till och odla på förskolan eller i skolan?
