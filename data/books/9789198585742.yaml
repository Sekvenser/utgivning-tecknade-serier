description: ”En bibel för känsliga hjärtan”  -Moa Romanova  Bland Santa Monicas kullar ligger Von Spatz’
  vilohem. En nervklinik för konstnärer och showbiz-folk, där psykiatriker, sjuksköterskor och vårdare
  står till förfogande. Patienterna uppmuntras att ägna sig åt sin återhämtning och konstnärlig verksamhet.
  För detta ändamål ställer hemmets ledning ateljéer, konstnärsmaterial och utställningshallar till förfogande.  Klinikföreståndaren  Margarete
  Von Spatz tar kärleksfullt hand om de intagna. En av dem är Walt Disney, som under sin vistelse mer
  eller mindre förgäves försöker sig på att skapa ett antal olika konstverk. Under de talrika eftermiddagsaktiviteterna,
  som t ex måleri, pingvinmatning och skulptur begrundar Walt sitt liv som konstnär. Hur kunde Musse Piggs
  pappa förlora förståndet?
