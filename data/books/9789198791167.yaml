description: Under en lång tid har vårt land terroriserats av de köttätande odjuren Crows! De jagar oss
  som byten och stjäl vår mark. En myt säger att det enda som kan rädda oss är Scarecrows, en elitenhet
  om mystiskt försvann och ingen längre tror på. Prinsessan Engell tror däremot på deras existens! Hon
  lämnar sitt trygga kungarike och beger sig ut i världen i hopp att hitta en Scarecrow som kan rädda
  oss!
