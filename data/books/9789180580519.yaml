description: När Darwin letar efter svar om sitt förflutna råkar han ha sönder Skywood, en helig artefakt
  som tillhör hans försvunna förfäder. Ett fragment blir stulet och mystiska krafter riskerar att hamna
  i orätta händer. Tillsammans med systern Wanda beger Darwin sig till Astoria för att återfinna fragmentet
  och försöka ta reda på vad som hände hans föräldrar och folket Dai-Kinn.
