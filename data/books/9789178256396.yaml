description: Teo är topprankad BMX-cyklist. Milla är den enda tjej som vunnit flera nationella BMX-tävlingar.
  Så vad har de gemensamt? De ska båda tävla i den ultimata tävlingen BMX-BLIXT. Den superhemliga banan
  har varit övertäckt så ingen vet riktigt vad som väntar. Förutom en cyklist som heter Peter, han verkar
  veta precis vad som väntar efter varje kurva …SportKlubben är serieromaner för alla i mellanåldern som
  gillar sport och spänning. Rapp dialog och coola illustrationer skapar de fartfyllda berättelserna som
  är lätta att följa, men aldrig blir långtråkiga. Varje historia inleds med en presentation av huvudkaraktärerna
  i text och bild. Sist i böckerna finns en ordlista som förklarar svåra ord. Serien är en perfekt ingång
  till läsning för den som vill ha historier med bra driv och högt tempo. Böcker att älska och att känna
  igen sig i – riktiga blandvändare.Lättlästa böcker från Nypon är ofta något kortare, har alltid ett
  lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.
