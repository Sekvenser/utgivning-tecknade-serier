description: Första delen i fantasyserien Drakens öga. I en underjordisk värld befolkad av alver i besittning
  av magiska krafter, hyllas alven Khas förmågor. Hen lever ett till synes bekymmerslöst liv, men opålitliga
  krafter omkring vill ta dennes magi och göra den till sin egen och hen tvingas fly till världen ovanför.
  Ytan, som denna värld kallas, är en farlig värld men till Khas hjälp kommer åtminstone den mystiska
  Ranja och en drake. För mellanstadieåldern med teckningar av författaren.
