description: "Stolta höfter av ben, sten, bränd lera – vi kallar dem gudinnor, men vilka eller vad var\
  \ de egentligen?\n\r\nI böcker om stenåldern ser vi främst män som jagar, slår flinta eller målar grottor.\
  \ De flesta bilder av människor som istidsmänniskorna själva lämnat efter sig visar dock kvinnor. Vad\
  \ var det för samhällen som avbildade dem och deras kön så centralt och utan skam?\n\nI sin storslagna,\
  \ faktabaserade seriebok går Ulli Lust tillbaka till konstens början och utforskar betydelsen av empati\
  \ för vår arts överlevnad. Runt de arkaiska kvinnliga figurerna utvecklas en glömd värld där hjältens\
  \ resa var en gruppangelägenhet som bara kunde klaras av gemensamt.\n\n»Det är hög tid att sådana böcker\
  \ skrivs. Denna kommenterade seriefackbok av Ulli Lust fängslar läsaren och drar henne djupt in i de\
  \ tidiga människornas sociala liv. Aktuell kunskap från arkeologin tillsammans med idéer baserade på\
  \ etnologiska exempel och med spegling i nutiden skapar en explosiv blandning som får oss att fundera\
  \ över vår förståelse av den kvinnliga tillvaron.«\n\r\n— Dr Christine Neugebauer-Maresch, Institutet\
  \ för förhistorisk och historisk arkeologi vid Wiens universitet"
