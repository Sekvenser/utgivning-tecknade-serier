description: Julen närmar sig, men Sara, Cassiopeja och Lucille kan inte komma på vad de ska ge varandra
  i julklapp. Då dyker en mystisk tomte upp och ger systrarna varsin magisk tändsticka, som kan uppfylla
  en hemlig önskan. Men vad ska de önska sig? Något att ge bort, eller något till sig själva? Kanske något
  de alltid har drömt om? Och kan en magisk tändsticka verkligen ge dem allt det önskar?
