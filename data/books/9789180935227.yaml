description: 13-årige Aster har vuxit upp med sin häxfamilj i skogen bortanför den lilla staden. För dem
  är det självklart - flickor blir häxor och pojkar blir formbytare som kan ta djurens skepnad. Men Aster
  har alltid haft lättare för häxmagi trots att det är förbjudet för killar. När en ny ondska dyker upp
  börjar den med att infiltrera formskiftarna. Kan Aster rädda alla med hjälp av häxmagin utan att dra
  på sig byns ilska?Witchboy är del ett i en serie om magi, drömmar och normer och om de personer som
  vågar utmana.
