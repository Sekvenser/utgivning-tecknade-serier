description: Ett actionfyllt juläventyr med Röda Masken!Äventyr för superhjältar är renodlade serieböcker
  för de lite äldre fansen, med snabbare tempo och nervkittlande handling − perfekta för alla dem som
  älskar superhjältarna och bara vill ha mer!Det är snart jul och lugnet har börjat sänka sig över Rosenhill.
  Inte ens skurkarna verkar jobba. Men plötsligt slutar alla tv-apparater att fungera. De yngre bryr sig
  inte särskilt mycket, de kan ju ändå se alla sina program på datorn och telefonen, men för de äldre
  är det inte lika lätt. Det dröjer inte länge innan det blir uppror i staden, och Röda Masken och de
  andra superhjältarna måste stoppa kaoset – innan julen i Rosenhill är helt förstörd!Handbok för Superhjältar
  är den största boksuccén i Sverige på senare år. Nu återvänder vi till Rosenhill och träffar Röda Masken,
  Vildbiet och de andra superhjältarna. Böckerna är skrivna av Elias Våhlund och illustrerade av serietecknaren
  Kim W Andersson.
