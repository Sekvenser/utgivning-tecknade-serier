description: Pisse-Misse älskar julen! Pynt, pyssel och julgröt. Men efter att ha råkat slakta grannens
  älskade julbock är det säkrast att fly fältet. Tillsammans med Sivert och sina missanpassade vänner
  ger sig Pisse-Misse ut på ett vilt uppdrag. De måste rädda julen! Men kommer katt och husse lyckas begrava
  stridsyxan och tillsammans tackla svårigheterna?
