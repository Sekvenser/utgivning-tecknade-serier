description: Läs den hjärtskärande historien om hur Captain America hjälper Bucky Barnes, som kom tillbaka
  från de döda som Winter Soldier! En gång i tiden var Bucky Barnes och Captain America trogna vapenbröder.
  Orädda kämpade de tillsammans med de allierade under andra världskriget… På spåret efter sin äldsta
  fiendes mördare, befinner sig Captain America nu i konflikt med en av sina bästa vänner, som efter en
  vansinnig förvandling är hjälplös i händerna på den ryske generalen Lukin! Vid sin sida har Captain
  America både Agent 13 (Sharon Carter) och Falcon, men kan Cap ta sista striden mot den han en gång såg
  som sin mest lojala vän?
