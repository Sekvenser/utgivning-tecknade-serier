description: Ett sjömonster förstör fiskebåtarna i Saltvik och lille Krako får skulden. Fiskarna tror
  att han är farlig och vill bli av med honom. Men Ofelia vet att det inte kan vara Krako som förstör
  båtarna. Det måste vara ett större sjömonster. Hon tar sig ner i djupet och upptäcker att det inte finns
  några fiskar där. Bara gammalt skräp och sopor! Kan Ofelia övertyga människorna i Saltvik om att monstret
  inte är farligt, bara väldigt hungrigt? Böckerna i Krypto-serien är serieberättelser fyllda av äventyr
  och spänning. Den sjätte boken handlar också om nedskräpning i havet. Serien är skapad av Hans Jørgen
  Sandnes. Med träffsäkert berättande och fantastiska illustrationer tar han läsaren med på stora äventyr.
  Ofelia och Björn tar sig an utmaningar, övervinner motgångar och visar prov på mod. Och teman som havsmonster,
  vänskap och mystik resulterar i stor läsglädje för både ovana som vana läsare. Uppslukad är den sjätte
  boken i Krypto-serien. Lättlästa böcker från Nypon är ofta något kortare, har alltid ett lättare språk
  och ett innehåll anpassat för den tänkta läsarens ålder. Nypons böcker är indelade i sex nivåer. Serien
  Krypto ligger på nivå 3 av 6.
