description: 'New issue of the international comics anthology:  From hospital staff to comic creators
  to basically any job in the gig economy. Anyone who doesn’t have a steady income, or who is expected
  to do more work in less time than is reasonable, can feel it. This volume of CBA explores BURNOUT. Not
  so much stories of depressing social realism, but rather artistic expressions of that feeling, suggestions
  for solutions, wishful thinking and visual abreactions. Expressions of rage rather than apathy, insurrection
  rather than complicity. Something to read for strength in times of austerity.'
