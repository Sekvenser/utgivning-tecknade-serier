description: 'New issue of the international comics anthology:   CBA vol 48 is about cats. Cats and the
  lifelong friendships we form with our furry friends. Bonds so strong and endearment so deep and ancient,
  it permeates our lives through time. You find cats in scary stories, in cute stories, they’re a sign
  of bad luck in some cultures and good luck in others, worshipped as deities or shunned like pests. Remnants
  of our relationships with the floofy furs are found not just all over the world, but all over the internet
  as well. Here’s our contribution to the Cat Library of Time.'
