description: 'Elias har flyttat med sin mamma till ett stort hus mitt i skogen. När han ger sig ut i skogen,
  på jakt efter något att göra, dyker en mystisk flicka upp från ingenstans. Hon vill väldigt gärna leka
  kurragömma och snart är Elias indragen i en lek på liv ochdöd. Hitta mig om du kan en gastkramande kuslig
  serieberättelse som håller läsaren på helspänn fram till sista bildrutan. Under samlingsnamnet Rysliga
  serier presenterar Nypon förlag serieromaner där läskighetsnivån är uppskruvad för att passa dem som
  lockas av att få känna kalla kårar och spänning när de läser. Med bilder som speglar handlingen blir
  det lätt att hänga med och få nycklar och verktyg för att bemästra förståelsen av ord och bild.EPUB3:
  Fixed format'
