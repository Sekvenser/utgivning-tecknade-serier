description: Klara lever ett ganska ensamt liv. Hennes pappa är sjuk och hennes mamma jobbar jämt. Storebror
  har flyttat hemifrån. När hon hamnar i trubbel föreslår hennes bror att hon ska skickas till en internatskola,
  något som Klara tycker är en väldigt dålig idé. Hon bestämmer sig för att rymma och kommer att tänka
  på de två pojkar i tvättbjörnsdräkter hon såg stjäla en bit ost i saluhallen en gång. Kanske är det
  i tvättbjörnsgänget hon hör hemma. Ålder 9-12 år.
