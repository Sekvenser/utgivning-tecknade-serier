description: 'Pittsburgh är historien om en familj och om en stad. Frank Santoro konfronteras med ett
  enkelt men hjärtskärande faktum: Hans föräldrar, som varit ihop sedan gymnasiet, har vägrat tala med
  varandra — torts att de arbetar i samma byggnad. Han kommer i kläm och kämpar för att försöka förstå.
  Resultatet är den här boken.   Med hjälp av färgpennor, sax, tejp, en uppsättning olika papper och med
  starka färger och en expressiv linjeföring så skapar Santoro en släktkrönika som spänner över sina föräldrars
  första möten, deras äktenskap, allt i ett sakta förslummande Pittsburgh är fyllda med såväl vardagliga
  som dramatiska scener   —allt från egna minnen av missöden i barndomen till  hans fars traumatiska krigsminnen
  från Vietnam — allt med familjens hund, Pretzel, som stumt vittne.  Frank Santoro, som givit ut två
  böcker tidigare i Frankrike och Förenta Staterna, har här skapat sitt mästerverk. Pittsburgh är en unik
  omdaning av serieformen som skildrar både minnets bedrägliga natur som hur en familj uppstår, rämnar,
  och försöker hantera den nya situationen, parallellt med att den omgivande staden gör ungefär likadant.'
