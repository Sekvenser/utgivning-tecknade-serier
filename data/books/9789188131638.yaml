description: Den obeskrivligt mäktige BEYONDER har transporterat superhjältar och -skurkar från jorden
  till en främmande värld. Om de kämpar mot varandra lovar Beyonder att allt som segraren önskar ska bli
  verklighet. Men går det att lita på att Beyonder nöjer sig med detta – och vad blir konsekvensen om
  någon faktiskt vinner och önskar sig gudalika krafter?  SECRET WARS – KAMPEN MOT BEYONDER är en stilbildande
  superhjälteserie från 1980-talet, fullspäckad med action och intriger som fick stora följder för Marvels
  universum.
