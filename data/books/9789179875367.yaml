description: Kan Samir lita på sin nya basketkompis Erik? De är båda duktiga spelare och trivs ihop på
  planen. Men Erik har tidigare spelat för motståndarlaget. Och nu tror många att han kan vara en förrädare.
  Ska Samir svika sin nya kompis för att rädda laget … eller har laget fel? Samir och spelet är den fjärde
  delen i fartfyllda serien Sportklubben. Tidigare delar i serien är Mio och matchen, Teo och tävlingen,
  och Isak på isen. Sportklubben är serieromaner för alla i mellanåldern som gillar sport och spänning.
  Rapp dialog och coola illustrationer skapar de fartfyllda berättelserna som är lätta att följa, men
  aldrig blir långtråkiga. Varje historia inleds med en presentation av huvudkaraktärerna i text och bild.
  Sist i böckerna finns en ordlista som förklarar svåra ord. Lättlästa böcker från Nypon är ofta något
  kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.
