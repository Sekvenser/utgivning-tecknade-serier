description: Serieroman. Deas hamster Kurt ligger helt stilla i sin skokartong och varken blinkar eller
  viftar med tassen. Lite vila ska nog hjälpa tänker Dea, men kompisen Sven har en annan tanke. Han tror
  att Kurt är redo för den sista vilan, den i en grav.  De går till en kyrkogård där de träffar en äldre
  man som också heter Kurt. Han berättar om kyrkogårdens begravda djur och deras liv och död. Frågan är
  varför? Det är ju egentligen inget fel på Deas hamster. Eller? Ålder 9-12 år.
