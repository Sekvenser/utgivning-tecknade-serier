description: 'Frasse Fläskkorv (Batpig) och hans vänner ställs inför vad som kan vara deras läskigaste
  utmaning hittills: en magisk presidenthaj och ett sommarläger med eget sjöodjur! Först ställer Hajbraham
  Lincoln till en stor provfuskskandal där Frasse får sig en läxa. Och när Frasse åker på sommarläger
  för att ha kul med sina kompisar dyker det plötsligt upp ett grinigt sjömonster med världens värsta
  magknip. Men värre ska det blir bli, för Batpigs ärkefiende Slaktaren har släppts ur fängelset och hon
  längtar efter hämnd!'
