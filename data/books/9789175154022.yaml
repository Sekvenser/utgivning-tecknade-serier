description: I korta, roliga seriestrippar berättar Åsa Ekströms vidare om Japans många underbara, annorlunda
  och ibland svårbegripliga sidor. Hon får prova på att meditera i ett vattenfall, testar livet som utesovarproffs
  i Tokyo, lär sig att styla en matlåda och besöker en helgedom där man kan begrava sina dockor och samlarfigurer.
  Annat intressant som tas upp är butikernas lyckopåsar, det försvunna harajukumodet, språkliga utmaningar,
  japanska skönhetsideal och inställning till kroppsbehåring, hur man skriver kalligrafi och vilket kanjitecken
  som är finast.
