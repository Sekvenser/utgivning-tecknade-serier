description: Det har gått ett år sedan David Eliot kom till internatskolan Groosham Grange på Dödskalleön.
  När priset till skolans bästa elev ska delas ut känner han sig säker på att vinna förstapriset, den
  förhäxade graalen. Den nya eleven Vincent King visar sig dock bli en tuff utmanare och något mystiskt
  är i görningen. Det ska snart visa sig att skolans öde är kopplat till den märkliga graalen.
