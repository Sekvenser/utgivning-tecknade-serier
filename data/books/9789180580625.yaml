description: 'Jaktpiloterna Michel Tanguy och Ernest Laverdure ar ett omaka par, men bästa vänner ändå.
  Tanguy ar korrekt och ärlig, medan Laverdure är en glad spelevink, förtjust i flickor, fest och snabba
  bilar. Men när det verkligen gäller ar han en pålitlig kamrat som aldrig sviker. Äventyren i denna volym
  skapades på 1960-talet och berör många av den tidens aktuella ämnen, inte minst det militära hotet från
  öst.


  Men Jaktfalkarna ar framför allt en äventyrsserie om flyg och flygare, om kamratskap och hjältemod –
  fast också med en hel del humor. I varje volym ingår ett rikt illustrerat förord om upphovsmännen och
  deras samtid.'
