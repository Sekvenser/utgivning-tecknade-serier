description: 'Chefen på akvariet ska på en resa till USA och föreläsa om havsmonster. Äntligen det bli
  några lugna dagar i Saltvik. Men så dyker en mystisk tjej med en speciell tatuering upp. Hon stjäl boken
  om sjöodjur och monster som Ofelia fick av sin pappa när hon var liten. Ofelia och Björn ger sig ut
  på en resa för att hitta tjejen och boken. Sökandet tar dem till den gamla oljeplattformen och där gör
  de en sensationell upptäckt. Och i havet under dem lurar ett monster som gör allt för att skydda sitt
  barn. Äventyret de dras in i är farligt både för dem själva och för sjöodjuren de försöker skydda. Böckerna
  i Krypto-serien är serieberättelser fyllda av äventyr och spänning. Serien som har skapats av Hans Jørgen
  Sandnes har tagit Norge med storm. Med träffsäkert berättande och fantastiska illustrationer tar han
  läsaren med på stora äventyr. Ofelia och Björn tar sig an utmaningar, övervinner motgångar och visar
  prov på mod. Och teman som havsmonster, vänskap och mystik resulterar i stor läsglädje för både ovana
  som vana läsare. Käftarna i djupet är den tre tredje boken i Krypto-serien. Serien är skriven och tecknad
  av Hans Jørgen Sandnes, som bland annat står bakom illustrationerna till populära Detektivbyrå nr 2-böckerna.
    EPUB3: Fixed format'
