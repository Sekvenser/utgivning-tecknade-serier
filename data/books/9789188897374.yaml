description: Tintin kommer en kallhamrad falskmyntarliga på spåren, vilket efter en vild jakt för Tintin
  och Milou till Skottland och den mytomspunna svarta ön utanför Kiltoch, där det går rykten om ett ohyggligt
  odjur i slottsruinen. De nio första Tintinserierna tecknade Hergé i svartvitt, med start 1929. Originalversionerna
  kommer nu att ges ut i svensk översättning i ett utförande snarlikt det ursprungliga.
