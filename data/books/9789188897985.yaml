description: Dårfinken Gaston fortsätter att ställa till kalabalik och driva sina arbetskamrater till
  förtvivlan. Till sin hjälp har han sina husdjur, diverse galna uppfinningar och ännu galnare matlagning.
  Kontorets olycksfågel uppvisar helt enkelt en enastående fantasi och uppfinningsförmåga så länge det
  inte handlar om att jobba.
