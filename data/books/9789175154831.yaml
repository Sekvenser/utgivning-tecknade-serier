description: Som straff för dåligt uppförande blir 12-årige David Eliot skickad till internatskolan Groosham
  Grange på den avlägsna och kusliga Dödskalleön. På tåget på vägen dit träffar David två andra barn,
  Jill och Jeffrey, som också ska börja på skolan. Tillsammans med sina nya vänner Jill och Jeffrey bestämmer
  sig David för att ta reda på vilka mörka hemligheter Groosham Grange döljer.
