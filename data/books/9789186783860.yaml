description: När en liten grupp spökjägare plötsligt får kontakt med ondskan på en nedlagt mentalsjukhus
  dras Theo och hans vänner in i fallet. Kollegor, familj och fiender ställs mot varandra i den desperata
  jakten på ett barn i fara. Mysteriet tätnar när en sedan länge död ockultist och mördare återvänt för
  att sprida kaos och skräck i både Stockholm och Dalarna…
