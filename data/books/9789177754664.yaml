description: Nya spännande äventyr från Fabian Göranson! Tvättbjörnarnas stad är första delen i en trilogi
  om Klara. Den är ett storslaget äventyr bland förfallna hus, som en dröm om ett svunnet Stockholm. Det
  är en värld där gäng av utklädda gatubarn bekämpar varandra men där de största hotet egentligen är vuxenvärlden
  med den fanatiske doktor Nuragen i spetsen.
