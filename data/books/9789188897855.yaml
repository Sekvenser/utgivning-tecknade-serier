description: Handlingen i Tintin i Amerika rusar fram i en väldig fart, och Tintin hinner både slåss mot
  gangsters i Chicago, besöka vilda västern och bli tillfångatagen av såväl cowboys som indianer innan
  äventyret är över. Den svartvita originalversionen publicerades först som följetong i tidningen Le Petit Vingtième
  innan Tintin i Amerika gavs ut i albumformat första gången 1932.
