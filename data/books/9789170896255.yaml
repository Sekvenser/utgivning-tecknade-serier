description: Den fransk-marockanska författaren Leïla Slimani lär känna Nour, en marockansk kvinna som
  otvunget berättar om sin sexualitet och de personliga tragedier som drabbar de flesta kvinnor hon känner.
  Handen på hjärtat skildrar kompromisslöst verkligheten i ett land där islam är statsreligion. Den påminner
  var och en av oss om vikten av att kämpa för kvinnans grundläggande rättigheter.
