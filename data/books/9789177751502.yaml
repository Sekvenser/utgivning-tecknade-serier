description: Diana och Charlie är 17 år, transpersoner och bästa vänner. Vännerna tar sig igenom en vardag
  full av förtryck och ångest med hjälp av alkohol, musik och varandra.Diana & Charlie är en serieroman
  om två unga människors försök att förstå sig på vänskap, kärlek och psykisk ohälsa. Den har ett enormt
  driv, mycket humor och är uttrycksfullt tecknad med känslorna på utsidan.
