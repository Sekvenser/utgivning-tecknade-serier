description: Privatdeckaren John Blacksad - en cool katt i en sjaskig värld - är tillbaka på hemmaplan,
  i New York. Via en klient kommer han en korruptionshärva på spåren, som tar honom hela vägen från mullvadarna
  under jord till rovfåglarna i samhällets absoluta toppskikt. Någonting är rejält ruttet i staden som
  aldrig sover, och Blacksad får spela ett högt och farligt spel i jakten på de ansvariga.
