description: Kung Ottokars spira tecknades 1938. Det är det mest politiskt färgade av alla Tintinalbum
  och är starkt präglat av den oroliga tid det skapades i. Gemensamt för originalversionerna av Tintins
  äventyr är att de har betydligt fler sidor än de senare färgutgåvorna av samma äventyr, och att serierutorna
  är större. Varje album innehåller också ett mindre antal helsidesplanscher i färg.
