description: Thanos är allsmäktig!  Den vansinniga titanen Thanos har hittat de sex kosmiska evighetsjuvelerna.
  För att vinna Dödens gunst har han beslutat att visa sin enorma makt för henne genom att utplåna hälften
  av universums levande varelser!  Marvels hjältar måste därför gå samman för att försöka stoppa hans
  nästan gudomliga makt. I en ofrivillig allians med Doctor Doom och Galactus, samt andra av universums
  kosmiska varelser, sätter de nu allt på spel för att rädda universum från en säker undergång.
