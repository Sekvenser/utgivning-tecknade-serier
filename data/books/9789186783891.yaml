description: Uppföljaren till Polly tar ingen skit.  I detta andra album fortsätter historien om Polly
  som växer upp i en trasig familj på den svenska landsbygden. Hennes benhårda stil skapar alltmer obalans
  i det lilla samhället, och i sprickorna som uppstår anas att något inte står rätt till.
