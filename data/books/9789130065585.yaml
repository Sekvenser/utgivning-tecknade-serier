description: Seriealbum om kriminologen Harry "Revolver-Harry" Söderman, 1902-1956, och hans dramatiska
  liv. Han var en äventyrare, krigshjälte och geniförklarad brottsbekämpare. Efter studier i Tyskland
  och Frankrike blev Söderman 1934 chef för New Yorks polislaboratorium. Efter återkomsten till Sverige
  fick han ansvar för den nya institutionen Statens Kriminaltekniska Anstalt och bidrog till att lösa
  några av tidens mest uppmärksammade mordfall.
