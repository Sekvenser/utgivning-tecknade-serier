description: Den sista delen av François Bourgeons epos utspelar sig i Paris år 1885. Zabo, som vi först
  mötte i Flickan från Kajmanträdet, kallar sig nu för Clara. Hon står mitt i folkmassan då den vänsterradikale
  författaren Jules Vallès kista förs till kyrkogården Père-Lachaise. Fem år har gått sedan kommunarderna
  fick amnesti, men de dramatiska händelserna under Pariskommunen 1871 är inte bortglömda.
