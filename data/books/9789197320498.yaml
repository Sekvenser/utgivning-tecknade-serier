description: Nicolas Mahler – österrikisk illustratör och serieskapare – har tolkat Thomas Bernhards Gamla
  mästare i en grafisk roman. Med sin minimalistiska stil och absurda humor gestaltar Mahler Bernhards
  mästerverk med varsam hand. Gamla mästare är en vild satir som utspelar sig nästan uteslutande framför
  Tintorettos målning Den skäggige mannen, som finns utställd på Kunsthistorisches Museum. Där sitter
  två typiskt wieniska pedanter och lägger ut texten om högkultur, samhälle, statsstödda konstnärer, Heidegger
  och mycket mer. Med Gamla mästare introduceras Nicolas Mahler för en svensk publik. Hans serier och
  illustrationer har publicerats i tyska, österrikiska och schweiziska tidningar och tidskrifter, bland
  annat i Die Zeit och NZZ am Sonntag, och han har bland annat erhållit Max-und-Moritz-Preis (2010) för
  ”bästa tyskspråkiga tecknare”. Allt i översättning av Jan Erik Bornlid.
