description: Schweizaren Rodolphe Töpffer brukar ses som seriekonstens fader. Hans album med bildromaner,
  publicerade på 1830- och 1840-talen, revolutionerade bildberättandet med sina djärva och fantasifulla
  berättargrepp. I denna bok presenteras han för första gången för svensk publik med fyra av sina berättelser,
  som fortfarande kan fungera som effektfullt komiska även för moderna läsare.  Med ett efterord av seriehistorikern
  Göran Ribe som placerar in Töpffer i hans samtid och i bildberättandets utvecklingshistoria.
