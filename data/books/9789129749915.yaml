description: 'Under de senaste 200 åren har Sverige förändrats i grunden. Fabriker har byggts, städer
  har vuxit, och människor har flyttat från landsbygd till förort, från andra länder till Sverige. Men
  hur har livet varit för vanliga människor under den moderna tiden?


  Läs om en bondefamilj i Dalarna under 1800-talet och hälsa på hos en arbetarfamilj i Jönköping där barnen
  tillverkar tändsticksaskar hemma vid köksbordet. Titta in i en liten speceriaffär i 1930-talets Malmö
  och häng med några barn i 1970-talets Farsta där centrum, kiosken och veckopengen står i centrum för
  vardagens äventyr.


  Detta är den fristående femte och sista delen faktabokserien om Sveriges historia. En rikt illustrerad
  bok med serieavsnitt av historienörden och serieskaparen Fabian Göranson. Sveriges fantastiska historia
  Modern tid en faktaspäckad och spännande bok för alla vetgiriga 5-12-åringar!'
