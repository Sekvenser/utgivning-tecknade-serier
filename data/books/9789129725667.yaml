description: Lars är rätt ensam i skolan. Rektorn tror att lika barn leker bäst, och det gör livet svårt
  för den som är en zombie. Eller levande död som det faktiskt kallas. Tills Lars lär känna Robert som
  gillar zombies, och Anna som är ninja. Det visar sig att många människor är olika i stan, men otäcka
  krafter arbetar för att utesluta de främmande från stan.   Boken är baserad på tv-serien med samma namn.
  Kärlek, mobbing och utanförskap i rolig och rapp tecknad serie.
