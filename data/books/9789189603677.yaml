description: 'Det är 40 år sedan Joakim Pirinens debut “Välkommen till sandlådan” publicerades. Det numera
  kultförklarade albumet var starten förden svenska serieboomen.


  För att fira att albumet nu fyller medelålder, och Joakim Pirinen fyra decennier som utgiven serieskapare,
  kommer här en samlingsbok medverk från 1983 fram till 2023. Samtliga tidigare opublicerat i bokform
  med nyskrivna texter och kommentarer.'
