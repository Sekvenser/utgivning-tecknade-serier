description: Bokens huvudperson Billy Pilgrim tas i början av berättelsen till fånge av tyskarna. I likhet
  med författaren själv hamnar han i fångenskap i Dresden, överlever de allierades förgörande brandbombning
  av staden och kan efter krigsslutet återvända hem till USA. Där upphör likheterna, för Billy Pilgrim
  har blivit lösgjord från tiden och slungas fram och tillbaka genom tid och rum.
