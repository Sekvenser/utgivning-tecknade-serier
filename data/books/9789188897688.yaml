description: Efter ett biobesök stöter Tintin och kapten Haddock på general Alcazar, men han verkar inte
  vilja ha med dem att göra utan skyndar iväg. När de kommer hem har Moulinsart intagits av deras vän
  emirens son, den busige Abdallah, som är i färd med att vända upp och ner på slottet. Situationen är
  ohållbar men Abdallah kan inte återvända hem då det råder inbördeskrig i hans hemland Khemed.
