description: 'Siri och hennes familj är inbjudna till att fira midvinterblot hos kung Gorm, danarikets
  härskare. Efter en farofylld slädfärd till Gorms gård blir de varmt välkomnade av kungen och hans son,
  Harald Blåtand. Men kungen har problem med sina hövdingar, som har svårt att hålla sams inbördes. Detta
  uppmuntras av härskaren i riket söder om dem, som planerar att attackera kung Gorm.


  Siri och hennes vänner misstänker att det är något skumt i görningen. Nu hänger det på dem och korpen
  Hugin om fiendens soldater ska kunna hejdas utanför Danavirke, den långa mur som skyddar kungarikets
  södra gräns.


  Patric Nyströms och Per Demervalls seriealbum om den modiga och snabbtänkta vikingaflickan Siri och
  hennes vänner har sedan starten 2020 blivit en framgång både i Sverige och internationellt. Albumet
  innehåller också spännande faktasidor om vikingarnas tid.'
