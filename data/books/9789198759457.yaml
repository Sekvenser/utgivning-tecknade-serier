description: Tara Booth skildrar på ett både självutlämnande och oerhört expressivt vis hur hon haffas
  av polisen efter en fyllekörning och sedan styr upp sitt liv. Livet som nykter skildras i kortare episoder,
  ofta ordlösa men ständigt fyllda med både neuroser, kroppsäckel och oerhört mycket humor.  "Ärligt talat
  får hennes grubblande, kärlekstörstande 'kanske-kvinna' till seriejag samtidslitteraturens diton att
  blekna. Neuroserna ges fritt spelrum i karantänen. Och bland de slafsiga färgerna. Den är en fröjd att
  läsa." - Dagens Nyheter
