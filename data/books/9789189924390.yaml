description: Från en av Sveriges mest hyllade bildkonstnärer kommer "This is it" – en bok som öppnar dörren
  till Jesper Walderstens underbara värld, full av poesi, träffsäkra oneliners och svart humor i ett fantastiskt
  flöde av visuella kollage. Ord och bild smälter samman och bildar en ny helhet, inte sällan med en underliggande
  samhällskommentar. Man upptäckter nya saker, ju mer man tittar. I "This is it" får vi ta del av den
  senaste årens produktion, både teckningar, foton, texter och kollage.
