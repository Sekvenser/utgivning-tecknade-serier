description: Henrik Bromander gav ut det första numret av sitt fanzine Mediokra serier som fjortonåring.
  Snart följde fler titlar som Livets ord och Bromander. Redan i dessa fanzines skymtade de drag som gjort
  Henrik Bromander till en av landets mest omtalade serietecknare och författare. För första gången ges
  hans fanzineserier nu ut i bokform, så att fler än de dussintal läsare han en gång ritade för kan läsa
  dem. Till denna utgåva har han dessutom skrivit ett fylligt förord som sätter in serierna i den kontext
  de skapades, samt ett efterord där han kommenterar de individuella serierna.
