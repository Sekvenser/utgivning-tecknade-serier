description: 'Del 6 av Jonas Crow''s äventyr. Den avslutande delen i denna episod.  Efter att Rose Prairie
  lämnat honom lejs en djupt deprimerad Jonas Crow av Sid Beauchamp, en gammal vän från hans hårda ungdomsår
  i New Orleans. Sid är numera väletablerad som sheriff i Tucson, och ska dessutom gifta sig med Josephine
  Barclay, stadens rikaste änka. Men hon har ett villkor: Sid måste hämta tillbaka hennes döde son från
  apache-territoriet. Och det är därför han behöver sin gamle vän begravningsentreprenören. Vid första
  anblicken verkar det vara en ganska okomplicerad uppgift: Gräv upp och återför Caleb Barclays döda kropp
  efter att han förslavats och torterats av apacherna. Men den hänsynslösa apachekrigaren Salvaje avslöjar
  för Jonas att den döde – ”Den Vite Indianen” – inte alls var någon slav utan tvärtom hennes make och
  hennes sons far, och dessutom ledare för apachernas motstånd mot de vita. Än värre är att hans död var
  resultatet av Sids egna lömska planer! När Jonas får veta sanningen vänder han sin barndomsvän ryggen
  och försöker ta tillbaka kroppen så den kan återföras till sin riktiga viloplats. Tyvärr tas Jonas,
  den åldrade krigaren Kenitei, och Salvaje och hennes son Chato till fånga …'
