description: 'En stor del av våra liv tillbringas på jobbet - något som Kalle Anka verkligen har tagit
  fasta på eftersom han har provat fler yrken än någon annan. Men han har också blivit avskedad från nästan
  alla!


  I den här boken gör vi ett hedervärt försök att kartlägga ankans yrkesmässiga misslyckanden och undersöka
  varför han alltid hamnar på uppsägningslistan. Trots Kalles många talanger hade han aldrig kunnat skapa
  ett så digert CV på egen hand. Till sin hjälp har han en rad framstående serieskapare – bland andra
  Carl Barks, Vicar, Al Taliaferro, och Francesco Guerrini – som alla har bidragit med historier till
  denna samling. Och ett CV av denna omfattning förtjänar förstås en ordentlig granskning av HR-avdelningen.
  Resultatet presenteras här i form av artiklar skrivna av internationella Disney-experter, författare,
  tecknare och redaktörer.'
