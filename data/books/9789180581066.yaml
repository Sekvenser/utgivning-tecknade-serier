description: 'En mystisk brottsling har utfört flera spektakulära stölder i den engelska huvudstaden,
  senast mot Towerns skattkammare där kronjuvelerna förvaras. Förbrytaren har fräckheten att informera
  polisen i förväg om var nästa brott ska begås, men lyckas ändå ständigt dra Scotland Yard vid näsan.
  Missnöjet med polisen tilltar med varje ny kupp de misslyckas med att förhindra.


  Kapten Francis Blake skickas till Scotland Yard för att lösa fallet och avslöja mannen bakom det gula
  tecknet. Kaptenen tar hjälp av sin vän, professor Philip Mortimer, vars vetenskapliga expertis kommer
  att visa sig ovärderlig i fallet. Men nu följs stölderna av kidnappningar. En berömd läkare, en lika
  berömd krönikör och en framstående domare försvinner en efter en, kidnappade inför ögonen på polisen.
  Hur ska Blake och Mortimer kunna besegra detta kriminella geni med nästan övernaturliga krafter?


  Äventyrsserien med vännerna Francis Blake och Philip Mortimer skapades i slutet av 1940-talet av den
  belgiske tecknaren Edgar P. Jacobs, nära vän och medarbetare till Tintins skapare Hergé. Under de följande
  tre decennierna skrev och tecknade Jacobs åtta Blake och Mortimer-äventyr fördelade på tolv album, med
  ingredienser som övernaturliga fenomen, science fiction, kriminalgåtor och arkeologiska mysterier. Cobolts
  samlingsutgåva av Edgar P. Jacobs klassiska serier ges ut i totalt sex delar. Varje volym innehåller
  också ett omfattande extramaterial.'
