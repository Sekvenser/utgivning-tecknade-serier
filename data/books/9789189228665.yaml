description: 'VIKINGEN ROLLE har kommit till Paris för att plundra. Till sin hjälp har han de klantiga
  skurkarna Ivar och Grym, men deras planer att ta sig in i staden misslyckas gång på gång. Nu är Rolles
  tålamod slut och goda råd är dyra. Ivar och Grym inser att det bara finns en person som kan rädda dom.
  Med visst besvär kidnappar de Siri och Zack och för dem till Paris där Siri presenteras för den misstänksamme
  Rolle. Kan en liten unge verkligen hjälpa de vilda vikingarna­ Nu måste Siri låtsas hjälpa Rolle samtidigt
  som hon skyddar invånarna i Paris mot vikingarnas anfall. Som tur är har hon sin vän Zack och de får
  oväntad hjälp.EPUB3: Fixed format'
