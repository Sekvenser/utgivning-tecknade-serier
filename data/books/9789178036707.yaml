description: '"Hundmannen" är Dav Pilkeys nya superhjälte. Efter tolv spännande och skruvade äventyr med
  Kapten Kalsong är det dags för denna sammansatta karaktär att göra entré!Vad får man om man syr ihop
  en trasig polishund med en trasig polisman? Hundmannen! En stark mänsklig kropp ihopsydd med en smart
  hundhjärna blir ett vinnande koncept!Hundmannens ärkefiende katten Percy är tillbaks för att göra livet
  surt för alla stadens hundar. Med hjälp av radiostyrda onda varmkorvar, en kidnappad filmstjärna och
  Percys egen klon SuperKissen hoppas han en gång för alla att sätta tuggbenet i halsen på Hundmannen.
  Men gränsen mellan ondska och godhet är inte alltid svartvit, och eftersom Hundmannen är färgblind blir
  det ännu mer komplicerat när allt ställs på sin spets(hund)!Dav Pilkey låter huvudpersonerna från Kapten
  Kalsong, George och Harold, berätta även denna historia. De gör det som vanligt på sitt ytterst infallsrika
  och humoristiska sätt, resultatet blir stor läsglädje för både lässvaga och läsvana. Och särskilt för
  serieälskare, för nu blir det 100% serie och 100% fär'
