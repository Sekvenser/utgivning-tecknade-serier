description: I denna albumserie i två delar utmanas Maurice Leblancs geniala gentlemannatjuv Arsène Lupin
  av sir Arthur Conan Doyles Sherlock Holmes. Förklädd till viscounten Raoul d-Avenac tar sig Arsène Lupin
  an utredningen av ett mord på godset Stora Svepet i Normandie. Samtidigt är Sherlock Holmes honom på
  spåren, vilket snart ska leda till en slutlig konfrontation.
