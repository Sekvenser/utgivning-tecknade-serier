description: Tre kvinnor i de sköra skeden då livet skiftar form. Skrotsamlerskan Emily rör sig rastlöst
  genom ett nedsläckt köpcentrum där hon monterar ner resterna av det som varit. Hon klamrar sig desperat
  fast vid sin tonårsson Ed. Samtidigt tömmer hennes systrar Eliana och Evelyn sin demenssjuka mammas
  lägenhet efter femtio år. I gränslandet mellan minne och glömska sorterar de ett liv av skratt och sorg.
