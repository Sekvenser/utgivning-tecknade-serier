description: I "DC League of Super-Pets" är Superhunden Krypto och Stålmannen oskiljaktiga. De bästa vännerna
  har samma superkrafter och bekämpar brott sida vid sida i staden Metropolis. När Stålmannen och resten
  av gänget i Justice League kidnappas måste Krypto övertala en grupp herrelösa djur – hunden Ace, grisen
  PB, sköldpaddan Myrtle och ekorren Chip - att bemästra sina nyupptäckta krafter och hjälpa honom att
  rädda superhjältarna.
