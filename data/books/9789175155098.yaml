description: 'Följ med till skräcködlornas tidsålder! I boken får du möta de forskare och entusiaster
  som sedan början av 1800-talet har försökt lösa fossilens gåtor. Fanns det dinosaurier på alla kontinenter?
  Lyckades någon art överleva den stora katastrofen? Stämmer det att alla dinosaurier hade fjädrar?


  Boken ger en kunnig och underhållande inblick i äldre och nutida forskning om dinosaurier fram till
  de senaste rönen. Oavsett om du går i mellanstadiet och lär dig om trias, jura och krita, eller om du
  bara har ett stort intresse för dinosaurier, är det här en bok som på ett lättillgängligt sätt förklarar
  allt från bildandet av fossil till hur de olika arterna fått sina namn.'
