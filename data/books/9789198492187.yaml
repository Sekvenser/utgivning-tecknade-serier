description: Long ago, European countries began to propagate the notion of white supremacy, of how other
  races would inevitably perish to make room for the (Western) European peoples. Today, race is mostly
  not talked about openly in that way, but the same notions live on and thrive in many circles and institutions,
  even if expressed in other ways. These days there’s talk of culture, religion and criminality, but there
  is always an implied image of who has an obvious right to a space and who must always justify their
  existence, be grateful, obedient and assimilated. Racism is not just about how we look at each other
  on the streets or at work, but also about how our lives are concretely affected by legislation around
  migration, discrimination, behavior and culture. ParaVox är en ny antologitidskrift från Tusen Serier,
  en plattform för antirasistiska serier av serieskapare från olika länder.
