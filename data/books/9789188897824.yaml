description: 'I år är det 80 år sedan Krabban med guldklorna gavs ut första gången. Äventyret är en av
  de viktigaste berättelserna i Hergés verk och ett av de mest omtyckta Tintinalbumen. Det som gjort äventyret
  så populärt är att det är här som Tintin först möter den försupne sjökapten som med tiden kommer att
  bli hans bäste vän: den koleriske, smått patetiske och whiskytörstande Archibald Haddock!'
