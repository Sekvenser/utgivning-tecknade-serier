description: Few non-genital body parts are the object of nightmares and obsessions as much as fingers
  and teeth. Focusing on single body parts might seem hard when telling a story, or evoking feelings in
  art, but not regarding fingers and teeth. We all have some story connected to them. The human touch
  and the animal bite, desirable or dangerous. In this issue, we zoom in on the most bodily representations
  of anxiety and vulnerability.
