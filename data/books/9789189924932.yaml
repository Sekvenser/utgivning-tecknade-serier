description: '”Livet går sönder, det är stort och litet på samma gång och så vackert.”


  I denna diktsamling möter vi texter som vägrar vara tillrättalagda. De trevar, stretar emot, längtar
  bort och stannar kvar på samma gång. Med ett språk som är både brutalt och ömt borrar Hemmingsson i
  det motsägelsefulla: viljan att förstå – och rädslan för att faktiskt göra det. Det är ett dribblande,
  och just där, i tvekan och friktionen, uppstår något levande.


  Illustrationerna, skapade av författaren själv, förstärker känslan av något som både håller på att falla
  isär och samtidigt tar form. Tillsammans bildar text och bild en helhet som vibrerar av närvaro. Det
  här är dikter födda ur det trasiga – ur glappet mellan det stora och det lilla, det vackra och det som
  gör ont. En bok för den som inte söker svar, utan något som känns.


  Nina Hemmingsson (f. 1971) har sedan debuten Jag är din flickvän nu etablerat sig som en av Sveriges
  främsta serietecknare och bildkonstnärer. Med sin omisskännliga stil, både vad gäller språket och den
  grova teckningslinjen, gör hon serier som är svåra att värja sig mot. Hon har hittills publicerat nio
  serieböcker, en diktsamling samt en roman, och medverkat i ett otal tidningar och magasin.'
