description: 'Den mytiska Kest Ke Belonius har vaknat ur sin oroliga slummer och hela Irpa riskerar att
  försänkas i ett evigt mörker. Ovetande om vad som pågår ger sig två hjältar ut för att möta faran.


  Efter en svår strid vaknar Bea och Cad upp hos arsaierna. De hemlighetsfulla varelserna kan se glimtar
  av framtiden och det är ett dystert öde som väntar Irpa om Kest lyckas förstöra världens Ljus. I ett
  försök att hitta ett sätt att besegra fienden bestämmer sig Bea och Cad för att söka efter den uråldriga
  vattenanden Lorgon.


  Tim Proberts kritikerhyllade fantasyserie Lightfall är en serie för alla som gillar vackert tecknade
  magiska världar och spännande äventyr i samma genre som Amulett och Norrsken.'
