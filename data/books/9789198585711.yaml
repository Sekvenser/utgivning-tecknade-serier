description: Evigt fulla och höga så har de älskvärda lågliven Megg och Mogg drivit genom ett liv fullt
  av vilda upptåg utan negativa konsekvenser. Men det tunga drogmissbruk som en gång var deras inkörsport
  till äventyr har börjat ta ut sitt psykologiska pris. När hennes instabila livsstil till slut hinner
  ifatt henne så måste Megg vända sig till sitt förflutna för att hitta roten till de självdestruktiva
  vanor som ledde henne in på denna mörka väg.
