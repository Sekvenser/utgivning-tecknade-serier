description: Gör dig redo för den sista berättelsen om Teenage Mutant Ninja Turtles! I ett framtida stridshärjat
  New York ger sig en ensam överlevande mutantsköldpadda ut på ett till synes hopplöst uppdrag för att
  söka rättvisa för den familj han förlorat. Vilka fruktansvärda händelser tog död på hans familj och
  förvandlade New York till en postapokalyptisk mardröm? Allt kommer att avslöjas i denna slutgiltiga
  TMNT-berättelse. Kan den överlevande brodern segra? TMNT-skaparna Kevin Eastman och Peter Laird påbörjade
  denna berättelse för över tre decennier sedan – nu har den äntligen fullföljts.
