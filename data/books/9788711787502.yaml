description: En dag stöter Rasmus Nalle på kängurun Lars Post, som är brevbärare. Lars verkar ha så förfärligt
  mycket att göra, så Rasmus frågar om han kan hjälpa till. Lars tackar ja till erbjudandet, och tillsammans
  går de från hus till hus. Men hur många djur de än besöker, desto fler paket har de att dela ut. Hur
  går det ihop? Då får Rasmus en snilleblixt...Carla Hansen (1906-2001) var en dansk författare. Tillsammans
  med sin man, illustratören Vilhelm Hansen (1900–1992) skapade hon den oerhört populära serien om Rasmus
  Nalle (på danska Rasmus Klump). Serien publicerades till en början i tidningar i Danmark, men blev snart
  tryckt i bokform och spridd till andra länder.Rasmus Nalle har varit en älskad figur bland barn och
  barnsliga själar sedan det första numret om den lilla björnen och hans vänner publicerades år 1951.
  Rasmus Nalle älskar pannkakor och tillsammans med sina vänner reser han världen runt på skeppet Mary.
  Det finns alltid ett nytt äventyr som väntar!
