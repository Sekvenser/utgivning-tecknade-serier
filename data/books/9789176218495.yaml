description: Hälges eskapader i skogarna kring byn Avliden tar lyckligtvis aldrig slut. Årets album är
  sprängfyllt med morbid humor och vi tror att varje jägare, om än kanske motvilligt, kommer att hitta
  någon situation som känns lite bekant. Lars Mortimer lyckades skapa en serie som handlar om både vänskap
  och livets dystra stunder, men låter aldrig oss slippa undan utan ett härligt skratt.
