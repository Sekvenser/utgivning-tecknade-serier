description: Yngve Öman är tillbaka! Under våren har länet skakats av en serie grova bankrån och Lars-Gunnar
  Hedström och dennes mannar står handfallna. Spanarna Yngve Öman och Sven-Olof Taano försöker nysta i
  olika spår, samtidigt som Yngves fru — Lena — får sin kräm-beigea Volvo 240 stulen. Men när ett brutalt
  mord plötsligt sker på Valörvägen börjar saker och ting att röra på sig.
