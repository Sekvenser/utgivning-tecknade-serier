description: Ibland låtsas vi lite för mycket, för att vi har höga förväntningar. Förväntningar på stipendie-ansökningar,
  ta tag i sin läshög, ha den perfekta sommaren, att ha det rent och fint hemma, alltid kul på fest,alltid
  hinna med, tjejnyårets magi och förstås perfekta högtidsfiranden. Vi låtsas tills vi lyckas, och förväntningarna
  sätter ribban.
