description: I Hoshigahara finns en stor skog som barnen i trakten inte vågar gå in i, eftersom det sägs
  att den är hemsökt av spöken och andra hemska varelser. Men mitt i skogen står ett litet hus där en
  man bor med skogsandarna! Hisae Iwaokas manga är en hjärtvärmande och lite melankolisk fantasy fylld
  med andar, vindgudar och andra märkliga väsen.
