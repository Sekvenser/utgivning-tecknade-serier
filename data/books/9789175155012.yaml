description: Eldkonungen Zukos mors öde har länge varit ett mysterium. När Zuko hittar en oväntad ledtråd
  till vad som kan ha hänt bestämmer han sig för att ta hjälp av sin oberäkneliga syster Azula för att
  äntligen få reda på sanningen. Avatar är en amerikansk fantasyserie i mangastil, med action, humor och
  spännande karaktärer. Böckerna tar vid där säsong tre av den tecknade tv-serien slutar.
