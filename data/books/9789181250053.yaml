description: Matkaos i MinecraftRäknas creepers som grönsaker? Vad har ghastar i sin soppa? Och vad äter
  zombies allra helst? Följ med på små kulinariska skrattfester i Minecrafts galna värld!Kort och knasigt
  i Minecraft för nybörjarläsaren. I korta men naggande goda serie-strippar får vi hänga med de mest älskade
  – och hatade – karaktärerna från spelet Minecraft. Det korta formatet avlastar arbetsminnet och ger
  den ovana läsaren välbehövda pauser. En perfekt tröskelbok för den som har svårt att komma igång med
  läsningen men lockas av serietidningar och Minecraft. Mobernas hungriga liv är en fristående bok i serien
  Mober – Klantiga Minecraft-monster.
