description: Mors dag är en serieroman som handlar om barn vars mammor dör alldeles för tidigt. Vad händer
  med oss när vi separeras från den som gav oss livet, och hur påverkar det oss genom livets alla skeenden?
  Boken öppnar upp för frågor kring vår kulturs syn på sorg och hur vi påverkas av att leva i ett samhälle
  där symptom på sorg ofta patologiseras eller tystas ned.
