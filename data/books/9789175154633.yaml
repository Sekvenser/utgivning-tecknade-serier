description: Den berömda Sherlock Holmes unga syster Enola har bestämt sig för att klara sig på egen hand,
  efter hennes mors plötsliga försvinnande. Under täcknamnet Ivy Meshle tar hon på sig uppdraget att söka
  efter den saknade lady Cecily Alistair, vilket leder henne till Londons arbetarkvarter. Del två i den
  tecknade serien som är baserad på på Nancy Springers bästsäljande böcker.
