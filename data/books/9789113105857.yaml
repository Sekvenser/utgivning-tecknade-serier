description: Anne Franks dagbok är en tidlös klassiker som får nya läsare i varje generation. Den tar
  sin början på hennes 13-årsdag när hon får en efterlängtad dagbok, och avslutas abrupt i augusti 1944.
  Den skildrar drygt två år i hennes tonåriga liv, då hon lever gömd i ett gårdshus i Amsterdam.  I den
  här boken får man möta hennes texter på ett helt nytt sätt, i serieform. Bildberättelsen utgår från
  den oavkortade utgåvan och är sann mot originalet, samtidigt som bilderna tillför något helt nytt. Den
  unga Anne Frank och hennes mod, fantasi och intensitet ger färg och kraft åt sidorna - så mänsklig trots
  omänskliga omständigheter.
