description: Snobben är på många sätt en unik serie. Under närmare 50 år, från den första rutan till den
  sista, skrevs och tecknades serien av en enda person, Charles M. Schulz. Under 2020 fyller serien Snobben 70
  år, vilket kommer att uppmärksammas på olika sätt. Men Karl, Gullan, Linus, Leonard och Snobben själv
  förblir förstås evigt unga.
