description: '91:ans mästerverk är bokserien som hyllar tidningen 91:an och de serieskapare som skapar
  våra berättelser. Varje bok presenterar utvalda favoritserier av en enskild tecknare – berättelser som
  fått oss att skratta, som etsat sig fast i minnet och som fortfarande får trogna läsare att se fram
  emot nya utgåvor av tidningen. I möjligaste mån har tecknarna själva valt ut favoritberättelser, i samarbete
  med redaktionen som bidragit med sina egna favoriter.


  Detta är den fjärde delen i bokserien 91:an Mästerverk.'
