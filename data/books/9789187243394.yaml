description: Lars Sjunnesson hävdar att han lider av en störning som gör att han är tvungen att bryta
  mot den politiska korrekthetens alla oskrivna regler så fort han får en penna i handen, men att han
  i övrigt är normal. Kanske är detta sant, men det är svårt att bedöma riktigheten i ett sådant påstående.
  Lars Sjunnesson (f. 1962) är en av Sveriges internationellt mest erkända och uppskattade serieskapare.
