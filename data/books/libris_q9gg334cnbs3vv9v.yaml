description: Annabelle har blivit sjuk men låtsas vara frisk för att kunna gå på sin kompis Mattias kalas.
  Mamma Florence tar tempen och vill att hon ska stanna hemma, men Annabelle fortsätter hävda att hon
  är frisk. Då ringer Mattias pappa och berättar att det inte blir något kalas. Annabelle inser plötsligt
  att hon är mycket sjuk och behöver glass och godis.
