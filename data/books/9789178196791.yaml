description: 'Är det smart att kommunicera ut sin frus otrohet via informationstexterna i en katalog för
  katthjälpmedel? Bör man redan vid förlossningen sätta sitt barn i kö till Bruce Springsteens konserter?
  Och kan man rasa över en lögn, bara för att den kunde ha varit sann? På detta och mycket mer har serietecknaren
  och författaren Pontus Lundkvist ett tydligt svar: Ja! I en samtid som ofta helt verkar sakna humor
  lyckas Pontus Lundkvist träffsäkert skapa stor underhållning. Skämtteckningar och bilder som tidigare
  publicerats i bland annat Aftonbladet och Galago samsas här med opublicerat material. "Metanivån är
  hög. Både när det kommer an på hyllningar till äldre tiders strippar och skämtteckningar. [...] Pontus
  Lundkvist bär en absurdistisk tradition vidare in i gud vet vad." /Jonas Thente, Aftonbladet'
