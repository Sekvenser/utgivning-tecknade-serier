description: Balladen från norr skildrar gruvarbetarupproret i Asturien 1934 genom två familjers öden.
  I den här fjärde delen har arbetet i gruvorna återupptagits. Gruvarbetaren Apolonio och rikemanssonen
  Tristán gömmer sig i bergen och planerar att fly till Frankrike med andra upprorsmän. I gruvbyn tar
  Isolina och hennes mamma hand om flera barn vars familjer drabbats av militärens vedergällningar.
