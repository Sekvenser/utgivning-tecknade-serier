description: “Orka!” Är det en peppande uppmaning eller en ogillande muttring? Ibland vill man bara säga
  “Orka!” och sätta sig på en isolerad liten ö. Eller till och med vara en ö. Men ingen människa är en
  ö.   Här samlas alla avsnitt från Instagramkontot @feltankt under 2023. Nytt avsnitt kommer varje tisdag
  och bildar en sorts loggbok över vår samtid. Varje Feltänkt-bok kan läsas fristående.
