description: En komet störtar rakt ner mot Mumindalen. Vad kan man göra? Hatifnattarna, Mymlan och Filifjonkan
  är förnuftiga och flyr för livet. Men Mumin, Snorkfröken och Lilla My beslutar sig för att stanna kvar
  och njuta av den hotande undergången.  Den är ju så vansinnigt spännande – fast lite skrämmande ändå.
  Eller kanske den snarare är så vansinnigt skrämmande – fast lite spännande ändå?
