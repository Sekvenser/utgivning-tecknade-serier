description: Sökandet efter Skywood-fragmentet har fört Darwin till Bee Zity. När han letar efter sin
  syster träffar Darwin den föräldralösa pojken Apida, som har drabbats av den märkliga blå epidemin.
  Han bestämmer sig för att ta med Apida till Wylow, där han kan få behandling av deras helare. Men de
  blir förföljda av Okimas budbärare, som är beredda att göra vad som helst för att få tag i Skywood.
