description: Alla i skogen är rädda för vargen. Hans tjut får blodet att isas, hans blick är mordisk,
  och hans tänder sylvassa. Tack och lov är skogens alla invånare väl rustade. De går på föreläsningar
  om hur man känner igen vargen. De deltar i självförsvarskurser, och köper varglarm, vargfällor och vargstängsel
  Så kommer vargen verkligen...  En rolig och tankeväckande fabel om våra fördomar mot "den andre"
