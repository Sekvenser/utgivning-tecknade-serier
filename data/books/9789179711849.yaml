description: Vera och Nour har alltid varit bästisar. Men i sjuan förändras allt. Nour blir kompis med
  populära Emilia och plötsligt är det som att Nour inte ser Vera längre. Samtidigt blir Veras roll i
  klassen annorlunda. Till en början är skämten och elakheterna små. Vera gör motstånd och vägrar se sig
  som ett offer. Men kränkningarna blir bara värre och värre. Och så gör Nour något som kanske inte går
  att förlåta.
