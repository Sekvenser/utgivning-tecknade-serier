description: Innamorati betyder älskare på italienska. Älskarna var en arketypisk duo inom teater­stilen
  ”commedia dell’arte” och karaktäriseras av sin besatthet av varandra, av sin kärlek, eller av idén av
  kärlek. Förblindade snubblar älskarna på varje hinder. I dagboksform skildras hur ett modernt par snubblar
  rakt ner i denna komiska och tragiska soppa. Och ingen cool stad, ingen arbetsnarkomani, ingen Lana
  del Rey-platta, ingen empatisk kompis eller hemmafest kan ändra på det.
