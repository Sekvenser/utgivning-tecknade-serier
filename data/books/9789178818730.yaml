description: När vildmarks-systrarna stöter på en ledsen punk-sjöjungfru nere vid vattnet anser April
  att det bara finns en sak att göra! Hjälpa sjöjungfrun få tillbaka sitt band och sin bästa kompis, såklart!
  Men de andra vildmarks-systrarna är tveksamma. Arga sjömonster lurar där nere och en scout-fest som
  de längtat efter ska snart börja. Vad ska de göra? Kan de bara strunta i sjöjungfrun och musik-äventyret
  som lockar under ytan?  Vänskapen sätts på prov i den femte delen av Vildmarks-systrar! Vem har egentligen
  rätt att bestämma vad en grupp av kompisar ska göra? Och hur många faror måste man våga möta för att
  hjälpa en vän? Prata om vänskap och prioriteringar med avstamp den knasiga, spännande och magiska världen
  som hör till Vildmarks-systrarna.     Hegas böcker – lätta att läsa. Svåra att motstå.
