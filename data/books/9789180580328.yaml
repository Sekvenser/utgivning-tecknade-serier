description: Johan, Lotta och Jocko i nyutgåva! På väg från New York råkar fartyget Manitoba ut för en
  märklig incident. Maskinerna slutar fungera och några minuter senare faller passagerarna i djup sömn.
  När de vaknar upp visar det sig att samtliga har blivit rånade. Är det pirater som har varit framme?
  Johan, Lotta och Jocko blir snart indragna i ett äventyr på en ubåt långt ute till havs.
