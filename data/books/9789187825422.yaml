description: A Perfect Place to Call Home is Julia Nascimento’s first collection of visual narratives
  about her experiences and reflections of life in different places as a foreigner. Stories about living
  everywhere and living nowhere. Julia Nascimento is a Brazilian illustrator and cartoonist. While living
  in Japan she pursued postgraduate studies in fashion and worked in different sectors of the fashion
  industry. In 2017, she launched her career in illustration and comics, which solidified after her relocation
  to Sweden. Julia Nascimento’s work has been published in books and periodicals in Japan, Sweden, USA,
  and in the UK.
