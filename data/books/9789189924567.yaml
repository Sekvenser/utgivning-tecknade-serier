description: 'Dåtiden pågår hela tiden. Historien är inget avslutat kapitel – den är ett levande material,
  i ständig rörelse, som varje generation måste återerövra på nytt. I "En annan historia" gör Jan Stenmark
  just detta: han tar historien i besittning och gör den till sin. Resultatet är, som alltid, betydligt
  roligare än den officiella versionen. I denna nya bok utsätts historiens största gestalter och mest
  välbekanta ögonblick för Stenmarks oefterhärmliga bild- och textkollage. Columbus, Napoleon, Adam och
  Eva, Karl XII, Stalin, Jesus, Beethoven, Darwin, Freud, Newton, vikingar, greker, Karin Månsdotter,
  högertrafikomläggningen och de olympiska spelens barndom – alla får de sina roller omförhandlade när
  historierevisionisten Stenmark kliver in på scenen. Med sitt skarpa bildseende och sin förmåga att vända
  det vardagliga till något absurt och filosofiskt, öppnar Jan Stenmark dörren till en alternativ historieskrivning
  där inget är hugget i sten. Vad vet vi egentligen om hur det gick till? Och varför skulle den version
  som blivit nedtecknad vara den mest underhållande?'
