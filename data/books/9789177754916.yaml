description: Vaggvisan från Malanotte är en hyllad gotisk skräcksaga av stjärntecknaren La Came och manusförfattaren Marco
  Taddei. Historien utspelar sig sent 1970-tal och etnologen Ernesto reser runt på den italienska landsbygden
  för att samla in skrönor, vitsar och sånger som annars riskerar att falla i glömska. Den lilla byn Malanotte
  visar sig ruva på en mörk hemlighet. Elegant och kuslig.
