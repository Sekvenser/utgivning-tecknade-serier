description: Stormen är tredje delen av tre i serieromanen American Gods. Wednesday, alias Oden, de gamla
  gudarnas ledare har blivit skjuten under fredsförhandlingarna med de nya gudarna. Liket ska överlämnas
  till de gamla gudarna på Amerikas mittpunkt, ett neutralt ingenmansland, en plats för vapenvila. Shadow,
  Wednesdays livvakt och hjälpreda, måste fullborda den fasansfulla roll som Wednesday har utsett honom
  till i blodbadet som stundar … Men de gamla gudarna är skärrade och törstar efter hämnd …
