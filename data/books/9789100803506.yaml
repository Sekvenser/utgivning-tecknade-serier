description: Nominerad till Nordiska rådets litteraturpris 2023.Detektivarbetet för att få veta vad som
  egentligen hände de släktingar som ”försvann” under andra världskriget förflyttar berättaren och läsaren
  över tre kontinenter, men också genom tid och rum. Medan de mördade träder fram i ljuset, i all sin
  modernitet och självklara livsvilja, hotar mörkret att sluka den som kliver in i det.Med sin unika förmåga
  att enkelt och slagkraftigt skildra vår existens berättar Joanna Rubin Dranger i ”Ihågkom oss till liv”
  om det allra svåraste på ett sätt som både drabbar och ger oss nya insikter.En tecknad dokumentärroman
  om smärtan över att bli främmandegjord och avskuren från sin historia."Ihågkom oss till liv" är den
  vackraste och mest tilltalande bok om alla fasansfulla saker som hänt under 1900-talet i Europa. Läs
  den! Prata om den! Låna ut den!" - Skånska Dagbladet""Ihågkom oss till liv" är en djupt drabbande bok
  och en blivande klassiker" Göteborgs-Posten"Ihågkom oss till liv är ett mästerverk - på flera plan."
  Dala-Demokraten"Oroväckande dagsaktuell. "Ihågkom oss till liv" är en bok som tar struptag på läsaren."
