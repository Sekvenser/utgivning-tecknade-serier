description: Stina Bergman var hustru till den framstående författaren Hjalmar Bergman, som dog 1931.
  Denna bok handlar om hennes liv efter makens död, en uppslitande tid på det personliga planet, men också
  Stinas yrkesmässigt mest framgångsrika tid. Hon blev på 1940-talet en central figur i svensk filmkultur.
  Boken är både ett känsligt psykologiskt porträtt och en bit svensk kulturhistoria. Elisa Rossholm har
  gjort flera serieromaner ensam, men tecknar här till filmvetaren Anna Sofia Rossholms manus.
