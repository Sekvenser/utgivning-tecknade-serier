description: Elenas kompis Charlie kommer på besök. Zick blir direkt misstänksam och tjurig. Elena verkar
  hellre vilja vara med Charlie än med Zick. Det är något mystiskt på gång, Charlie verkar också kunna
  se monster och spöken, precis som Zick. Vad ska det här betyda?   När klassen ska på utflykt till akvariet
  får Charlie följa med. Det blir såklart trubbel. Det finns nämligen inte bara fiskar på akvariet utan
  även svarta andar som sätter hela klassen i fara. Kommer Zick och de andra klara sig?   I sjätte delen
  i Monster-Allergi – Trubbel på akvariet följer du med Zic, Elena och stjärnväktaren Tim på nya galna
  upptåg. Monster-Allergi är serieromanen för alla som gillar knasiga monster, spänning och humor.   Hegas
  böcker – lätta att läsa. Svåra att motstå.
