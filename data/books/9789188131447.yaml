description: KRIGET ÄR SLUT.  Varför tog egentligen inbördeskriget mellan Autoboter och Decepticons slut?
  Varför startade kriget från första början? Var MEGATRON alltid en hänsynslös tyrann? Hur gick OPTIMUS
  PRIME från att vara en vanlig poliskonstapel till bäraren av MATRIXEN? Vilken roll spelade en av Cybertrons
  senatorer i allt det här och vad hände med senatorn? Vad är egentligen institutet? Varför har SWERVE
  bommat igen sin bar? Och… varför är allt egentligen WHIRLS fel?  Svaret på alla dessa frågor (och många
  fler) får du i den här boken – den andra boken i berättelsen om besättningen ombord på rymdskeppet DEN
  FÖRLORADE LYKTAN.
