description: Jodå, tjejerna är kvar ute i skogen! Det är den första lugna dagen i lägret. Molly och Sam
  har bestämt sig för att gå på en picknick själva. De andra tjejerna lovar att inte göra något spännande
  under tiden, istället ska de bara ta helt vanliga scout-märken. Men vid det här laget vet vi alla att
  Fröken Hildur Patricia Fnurr von Kanels läger för tuffa tjejer inte är ett vanligt läger. Och Jo, April,
  Sam, Molly och Rebecka är inga vanliga scouter. Därför blir det såklart inte heller som någon tänkt
  sig, varken på picknicken eller i lägret…   Del tre av den roliga och naturnära, men inte så naturtrogna,
  serien Vildmarks-systrar är här! Med humor och befriande fantasifullhet vänder den sig till alla som
  söker färgsprakande äventyr med full rulle non stop! Får vi äntligen veta vem Björnkvinnan är? Vad är
  det med det konstiga låsta dasset egentligen? Vem berättar den läskigaste spökhistorien och vem av Vildmarks-systrarna
  är egentligen bäst på att dekorera tårtor? Allt det och mycket mer får du veta i Vildmarks-systrar –
  En usel plan.    Hegas böcker – lätta att läsa. Svåra att motstå.
