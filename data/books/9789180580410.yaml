description: 'Sextio år efter att det första äventyret publicerades fortsätter Modesty Blaise att locka
  läsare världen över. Medan de flesta andra äventyrsserier har fallit i glömska, har Modesty, hennes
  vapendragare Willie Garvin och deras brokiga följe av vänner och fiender inte upphört att fascinera.


  Till Sverige kom Modesty Blaise första gången 1965, om än under annat namn. Det skulle dröja ett antal
  år innan den stora publiken fick upp ögonen för henne, men sedan decennier har Modesty intagit en unik
  position bland svenska seriefans och älskats lika hett av både kvinnliga och manliga läsare. I den här
  jubileumsboken ingår ett generöst urval Modesty Blaise-äventyr tecknade av Jim Holdaway, Enric Badia
  Romero och Neville Colvin. I boken finns också texter om seriens historia, om Modesty Blaise i Sverige,
  i böcker och på film och om möten med seriens författare Peter O''Donnell, som gick bort 2010, 90 år
  gammal.


  Med ett förord av Peter O''Donnell, tidigare publicerat i en brittisk samlingsutgåva av serien.'
