description: 'Räven och Kaninen är bästa vänner och gör allting tillsammans. De går på tivoli och äter
  sockervadd, är en dag på stranden och hittar en skattkarta, bestiger ett berg och möter giftiga grodor.
  Överallt finns det faror om de måste klara sig undan. Tur att de har varandra!Räven och Kaninen på äventyr
  är en serieberättelse för de yngre läsarna om glädjen med att ha en god vän. Och om lyckan att kunna
  visa både rädsla och mod. Räven och Kaninen är bästa vänner och gör allting tillsammans. Tuffa räven
  är lite mer sugen på att testa nya saker än den oroliga Kaninen. Men tillsammans klarar de allt!Beth
  Ferry har skrivit många älskade böcker för unga läsare. Gergely Dudás är en självlärd illustratör som
  ritat många framgångsrika serier. Tillsammans har de skapat en spännande och underfundig historia i
  gränslandet mellan fantasi och verklighet.Sagt om boken: "Fem berättelser hyllar en osannolik djurvänskap
  och får dig att skratta högt! /. . ./ Bilderboksförfattaren Beth Ferrys första serieberättelse sprider
  glädje bland de som läser sin första seriebok." (Kirkus Reviews)Lättlästa böcker från Nypon är ofta
  något kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.'
