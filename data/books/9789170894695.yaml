description: 'Förra året fick illustratören Nicolas Krizan ett oväntat uppdrag från sin förlagsredaktör:
  "Skulle det inte vara en tanke att göra en bok med demoner?" Resultatet är ett personligt bestiarium
  där Krizan både gräver i historien och delar med sig av sina alldeles egna demoner.


  Genom årtusenden har människor världen runt funderat över vad olyckor, besatthet och annat ont egentligen
  kan bero på – och ofta hamnat hos någon form av elaka väsen. De dyker upp nästan överallt: från August
  Strindbergs Makter och Ingmar Bergmans dämoner, över Jack Kirbys seriefigur Etrigan och John Miltons
  Paradise Lost, till Gene Simmons i Kiss och dagens K-Pop Demon Hunters.


  Från grekernas daimoner och Pandæmonium i Helvetets huvudstad, till gallu, edimmu, daeva, div, yao,
  mo, oni, asura, ifrit, djinn, shedim, se''irim, pishacha, nirayapala, bunyip, wendigo och wechuge –
  listan över ondsinta väsen kan göras nästan oändlig. Krizan tar med läsaren på en demonjakt genom kulturer
  och tidsåldrar, illustrerad med härligt rysliga bilder. Förra året fick illustratören Nicolas Krizan
  ett oväntat uppdrag från sin förlagsredaktör: "Skulle det inte vara en tanke att göra en bok med demoner?"
  Resultatet är ett personligt bestiarium där Krizan både gräver i historien och delar med sig av sina
  alldeles egna demoner. Genom årtusenden har människor världen runt funderat över vad olyckor, besatthet
  och annat ont egentligen kan bero på – och ofta hamnat hos någon form av elaka väsen. De dyker upp nästan
  överallt: från August Strindbergs Makter och Ingmar Bergmans dämoner, över Jack Kirbys seriefigur Etrigan
  och John Miltons Paradise Lost, till Gene Simmons i Kiss och dagens K-Pop Demon Hunters. Från grekernas
  daimoner och Pandæmonium i Helvetets huvudstad, till gallu, edimmu, daeva, div, yao, mo, oni, asura,
  ifrit, djinn, shedim, se''irim, pishacha, nirayapala, bunyip, wendigo och wechuge – listan över ondsinta
  väsen kan göras nästan oändlig. Krizan tar med läsaren på en demonjakt genom kulturer och tidsåldrar,
  illustrerad med härligt rysliga bilder.


  Välkommen till just hans – gamla och nya – demoner! Välkommen till just hans – gamla och nya – demoner!


  En bilderbok, nog mer för vuxna än för barn.'
