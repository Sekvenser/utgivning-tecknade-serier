description: – Mu! Idag är en sån här dag när man öppnar fönstret och säger "Hej vädret, här är jag!"
  Solen skiner idag!– Är det?– Mu, det är utflyktsväder idag! Jag ska göra en utflykt Kråkan. Vill du
  följa med? Våren har kommit till gården, men allt Kråkan bryr sig om är wienerbröd. Hur ska man veta
  om någon är ens riktiga vän, eller bara ute efter något gott att äta? Ett besök i kråkboet ger kanske
  svar. Mamma Mu och Kråkan på utflykt samlar tre tecknade serier om Mamma Mu och Kråkan, två av Sveriges
  mest älskade barnbokskaraktärer.
