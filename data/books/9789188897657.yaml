description: När Tintin och kapten Haddock återvänder till Moulinsart efter upplevelserna i Det svarta
  guldet får de telegram från professor Kalkyl. Han meddelar att han rest till Syldavien, och vill att
  de genast följer efter honom dit. När Tintin och Haddock anlänt får de veta att Kalkyl är chef för det
  syldaviska månreseprogrammet.
