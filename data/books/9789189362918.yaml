description: För Markatta och hans vänner är äventyren aldrig långt borta. Under ett besök på Rangels
  nöjespark upptäcker de att ett farligt monster har tagit sig in på området. Jättelika spår av tassar
  i marken leder in till åkattraktionen Skräckens berg. Kan de hitta monstret och besegra det? En lättläst,
  mangainspirerad äventyrsserie som bygger på den kinesiska myten om kung Markatta.
