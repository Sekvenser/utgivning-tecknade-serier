description: Muminpappan har bildat en förening för rebelliska pappor, och självfallet får Muminmamman
  inte vara med i en förening för pappor. Men hon vill väldigt gärna vara med i en förening hon också,
  och ansluter sig därför till därför till Stinkys ideella förening. Till sin förskräckelse upptäcker
  Muminmamman snart att Stinkys förening är ett tjuvgäng.
