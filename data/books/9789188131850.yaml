description: Achilles Wiggen, kapten i det svenska flygvapnet, har hjälpt fredliga utomjordingar att försvara
  sig mot sina fiender. Med hjälp av bioiden JPX försöker han ta sig hem men istället kastas kapten Wiggen
  ständigt in i nya halsbrytande äventyr. Med sig på färden finns även tonårspojken Anders Nilsson, utomjordingen
  Wwor och Illea, prinsessa av Atlantis! En episk scifi-berättelse om en svensk hjälte på äventyr i tid
  och rum!    Kari Leppänens serie är en av de populäraste biserierna från serietidningen Fantomen. Denna
  volym innehåller berättelserna PRINSESSAN FRÅN ATLANTIS, IMPERIETS HJÄRTA, REPTILERNAS RIKE, ASTEROIDENS
  HEMLIGHET, DEN RÖDA PLANETEN och FÅNGAR I TIDEN som tidigare publicerades som följetong i Fantomen.
  Allt i ny översättning och ny färgläggning!
