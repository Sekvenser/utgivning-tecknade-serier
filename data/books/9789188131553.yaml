description: En av de populäraste Transformersberättelserna från 1980-talet – för första gången på svenska!  ÅRET
  ÄR 1986… OCH 2006.  OPTIMUS PRIME och hans Autoboter har varit strandsatta på jorden i två år, sedan
  1984. Det har varit ett par tuffa år med hårda strider mot MEGATRON, SHOCKWAVE, SOUNDWAVE och de andra
  Decepticonsen. Men det är på väg att bli ännu värre… tre hänsynslösa Decepticons – GALVATRON, CYCLONUS
  och SCOURGE – anländer från framtiden och gör processen kort med Autoboterna. Men än finns det hopp,
  EMIRATE XAARON skickar ULTRA MAGNUS till jorden för att hjälpa till.
