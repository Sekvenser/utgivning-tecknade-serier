description: Andra delen i det actionspäckade rymdäventyret Mars tur och retur – för alla som drömmer
  om att en dag få utforska universum.Rymdäventyret fortsätter. Raketen har nu lämnat jorden och tagit
  sikte på den röda planeten Mars. Svea och de andra utvalda eleverna från rymdakademin svävar i tyngdlöshet
  mellan asteroider och svarta hål, men även nere på jorden hopar sig problemen. Kommunikationen med raketen
  krånglar och snart står det klart att expeditionen inte alls är på väg mot Mars – utan rakt ut i det
  okända. Kommer Sydney kunna rädda sina kamrater?
