description: 'Älskling har skrivit en bok som knappt någon läser och bor i en bil på McDonalds parkering.
  Zacke har blivit nykter, uttråkad och börjat styrketräna. Love Warrior och Mållgan har flyttat ihop
  och blivit ett olyckligt par. Och ankan Alfons gifter sig och får familjens gamla sommarnöje, Villa
  Kvackoli, i bröllopspresent. Alfons äktenskap kraschar ganska omgående, knäckt av olycka vandrar han
  runt och råkar av en händelse stöta på Älskling.


  Han bestämmer sig för att åka till Villa Kvackoli, där ingen varit på åratal, och att oavsett vad som
  finns där, ska det bli hans öde. Älskling hänger med. Delvis för att hon inte har något annat, men också
  för att se om ödet finns – och framförallt ifall det är på deras sida. Love Warrior och Mållgan inser
  att också de behöver bryta sina tråkiga rutiner och hänger på. Till sist plockar de även upp Zacke,
  och det dysfunktionella kompisgänget är åter samlade.


  Det blir en roadtrip med otaliga förvecklingar där relationer ställs på ända och lojaliteter prövas.


  Lord All Smitey handlar om ett gammalt gäng vänner som splittrats och lever sina liv bättre på varsina
  håll. Utan att ständigt sätta krokben för varandra får de chansen att bli respektabla människor med
  äktenskap, karriär och godhälsa. Men Guds långa finger undslipper ingen, och onda ting bubblar under
  ytan. Vissa människor är inte menade att vara lyckliga.'
