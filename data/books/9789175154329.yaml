description: 'Ella är en tonårstjej med lika många personligheter som hårfärger. Efter en omskakande upptäckt
  tvingas Ella att möta sin största fiende: sig själv. Fångad i det undermedvetnas inre värld måste hon
  lära sig hantera de olika personligheterna för att hitta vägen ut. Hennes vänner börjar misstänka att
  allt inte står rätt till, men hur ska de kunna hjälpa henne att bli fri?'
