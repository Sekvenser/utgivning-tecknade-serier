description: Sveriges skarpaste seriehjärnor har tagit ett kalsonggrepp om funktionsfrågan. Följ med på
  en utställning med deras bottennapp ur fördomarnas smutsvatten! Med hjälp av humor och satir fångas
  olika perspektiv på funktionsnedsatthet. Bidragen behandlar allt från serietecknarnas egna fördomar,
  såväl som de ironiska kullerbyttor det ibland innebär att leva som funktionsnedsatt i ett otillgängligt
  samhälle.  Funkotopia är en bok med serier av funktionsvarierande kvalitet.  Boken är en del av assistanskooperativet
  GIL:s förändringsarbete för en bättre värld för personer med funktionsnedsättningar.
