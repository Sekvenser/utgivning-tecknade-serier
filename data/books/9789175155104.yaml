description: 'London, juni 1889. Någon har brutit sig in i Enola Holmes lägenhet och till sin förfäran
  upptäcker Enola att hennes kära hyresvärdinna, mrs Tupper, har blivit kidnappad. Ett broderat meddelande
  på mrs Tuppers krinolin leder Enola till sjuksköterskan Florence Nightingale, världsberömd för sina
  sjukvårdsinsatser under Krimkriget trettio år tidigare. Kan det vara hon som har lämnat det hemliga
  meddelandet?


  Den tecknade serien bygger på Nancy Springers bästsäljande mysterier med Sherlock Holmes tonårssyster
  i huvudrollen, som också har varit förlaga till flera populära Netflix-filmer.'
