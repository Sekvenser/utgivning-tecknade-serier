description: 'I Krabban med guldklorna möter Tintin en försupen sjökapten som med tiden blir hans bäste
  vän: den koleriske och whiskytörstande kapten Archibald Haddock. En annan ny bekantskap i detta album
  är styrman Allan Thompson, en råbarkad och farlig typ, som senare återkommer vid Rastapopoulos sida. Originalversionen
  av äventyret började som följetong i Le Soir 1940 och gavs ut i album 1941.'
