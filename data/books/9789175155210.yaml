description: 'Statyn i parken där syskonklubben bildades är försvunnen och systrarna Gyllenspets bestämmer
  sig för att ta reda på vad som kan ha hänt med den gyllene draken. Cassiopeja ska delta i en novelltävling
  och planerar att använda ledtrådarna till en berättelse som utspelar sig på medeltiden, medan Sarah
  är upptagen med en hockeyturnering och Lucille vill adoptera en bedårande valp. Ska systrarna lyckas
  lösa mysteriet, med allt annat som händer? De dras snart in i ett äventyr fyllt av märkliga bevingade
  varelser och underjordiska gåtor, där verklighet och fantasi börjar flätas samman.


  Det här är det sjunde albumet om systrarna Gyllenspets och deras familjehemligheter. Tecknaren Alessandro
  Barbucci har också illustrerat flera serier för Disney, bland annat världssuccén W.I.T.C.H.'
