description: 'Någonstans i Sydamerika får forskaren Alexander von Humboldt syn på en tidigare okänd varelse
  med en enormt lång, prickig svans. Marsupilamin fångas in och von Humboldt lyckas även få med sig tre
  prickiga ägg tillbaka. Efter att ha förts till Naturhistoriska museet i Berlin glöms dock det exceptionella
  fyndet snart bort ... Ända tills en dag år 1931 då den sjuåriga flickan Mimi hittar en trälåda som säger
  Hubba! Tillsammans vänder Mimi och Marsupilami upp och ned på Weimartidens Berlin i jakt på de försvunna
  äggen.


  Här har den tyska serieskaparen Flix gjort sin egen version av den klassiska seriefiguren Marsupilami,
  som först dök upp i ett av André Franquins Spirou-äventyr på 1950-talet. Humboldt-djuret utnämndes till
  2022 års bästa tyska seriealbum. Av samme tecknare har Cobolt tidigare utgett albumet Spirou i Berlin.'
