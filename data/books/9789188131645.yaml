description: SVEK är en bearbetning av Karin Alvtegens spänningsroman med samma namn. Efter att ha varit
  gifta i femton år inser Eva att Henrik vill bryta upp från deras äktenskap. När hon inser att han träffat
  en annan kvinna bestämmer hon sig för att hämnas det svek hon blivit utsatt för. Samtidigt vakar Jonas
  vid sin flickväns sjukhusbädd. Karin Alvtegen är en av Sveriges mest lästa och uppskattade författare
  och hennes böcker har sålts till ett 30-tal länder. Seriealbumet är skapat av manusförfattaren Sylvain
  Runberg (som även skrivit manus till serieversionen av Stieg Larssons Millennium-romaner) och tecknaren
  Joan Urgell.
