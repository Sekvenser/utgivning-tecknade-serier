description: Den här färgstarka komedin går under havets yta och på djupet till ett modets och äventyrets
  land. Delfinen Delphi hittar en dag en magisk valvport som uppfyller önskningar åt alla som besöker
  den. Elaka muränor använder valvporten för att göra sig jättelika och terroriserar idylliska Fish Town.
  Delphi måste ta mod till sig, lära sig att bemästra sin hemliga stridsteknik och hitta sin försvunna
  pappa för att kunna rädda sina vänner och vinna den vackra Mias hjärta.
