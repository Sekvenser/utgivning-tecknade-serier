description: Om dejtande och kärlek i Japan! För femton år sedan flyttade serietecknaren Åsa Ekström till
  Japan för att försöka etablera sig i mangans hemland. Efter några mödosamma år slog hon igenom med en
  humoristisk strippserie om sina egna upplevelser i landet och i den här boken får vi veta mer om vilka
  skillnader som kan finnas mellan Sverige och Japan i synen på kärlek.
