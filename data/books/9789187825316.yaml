description: Terror strikes the City, and Pirate seems to be the terrorist! Or is this finally the start
  of the revolution? As the City is gearing up for war, two girls walk its streets looking for action
  and trying to figure out what actually happened. How will our anarchist heroes deal with this situation
  as the equivalent to nationalist tendencies grip the population? What happens in a City where war has
  been an unknown concept, as its billboards are filling up with WANTED posters and military propaganda
  and the army recruitment centers are opening up for business? Who is the enemy?  10 year in the making,
  this 12th book in the Piracy is Liberation series finally takes us back to the City for 212 pages of
  a brand new story about a society on the brink of war.
