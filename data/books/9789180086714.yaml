description: Den galne professor Grym vill ta över hela världen! Han har uppfunnit ett nytt livsfarligt
  vapen – en stor, stark robot-varg! Finns det någon som kan besegra honom? Ja, Super-Rödluvan, så klart.
  Med sin magiska röda luva kan hon flyga, blir stark och får laser-blick. Men robot-vargen är ingen lätt
  match. Den har stora händer, stora ögon och stora tänder ...  Den lättlästa serien Flippade sagor tar
  en klassisk saga och flippar den. Lär känna en helt ny Rödluvan! I Super-Rödluvan får vi veta både hur
  hon fick sina superkrafter och hur hon besegrar den galne professor Grym och hans stora stygga robot-varg.    Hegas
  böcker – lätta att läsa. Svåra att motstå.
