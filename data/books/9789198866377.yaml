description: Dotty Virvelvind var Sveriges första superhjälteserie och dessutom den första med en kvinnlig
  huvudfigur. Berättelserna skrevs av science fiction-författaren Sture Lönnerstrand, tecknades av Björn
  Karlström och Lennart Ek, och publicerades i veckotidningen Levande Livet under 1944 och 1945. För första
  gången samlas nu denna ikoniska serie i bokform, med ett faktaspäckat förord.
