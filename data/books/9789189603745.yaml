description: Nina Hemmingsson kommenterar i sina bilder och texter samhällets förväntningar och normer.
  Både vad gäller kärlek och sexualitet, kön och jämställdhet, åldrande och död.“Skjut mig” innehåller
  ett urval av de bilder som bland annat publicerats i Aftonbladet och på hennes instagramsida. Dessa
  till synes enkla teckningar behandlar ofta stora frågor i livet; som falsk trygghet, brutna förhoppningar
  och konstnärlig frihet.
