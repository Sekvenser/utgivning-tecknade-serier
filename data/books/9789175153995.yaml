description: Efter en blodig strid har Will blivit bärare av den skarpa eggen. Nu kan han öppna portar
  mellan världarna med sina krafter och följer med Lyra till Oxford för att ta tillbaka alethiometern
  som sir Charles har stulit från henne. På andra håll och i olika världar har stora krafter satts i rörelse
  inför den avgörande kraftmätningen som väntar.Detta är det tredje och avslutande seriealbumet baserat
  på Philip Pullmans bok Den skarpa eggen, som utgör den andra delen av trilogin Den mörka materian, också
  känd som His Dark Materials.
