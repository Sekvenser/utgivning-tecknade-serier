description: '"Ett trollbindande mästerverk" – Dav Pilkey, skapare av Dog ManUnico är ingen vanlig enhörning.
  Efter att ha gjort kärleksgudinnan Venus rasande förvisas han från himlen och tappar minnet av vem han
  en gång var.I Uppvaknandet hamnar Unico i ett främmande land där han möter den smarta katten Chloe.
  Tillsammans hittar de en gammal kvinna i skogen som behöver hjälp, men när Chloe ber att få bli förvandlad
  till en mänsklig flicka blir allt plötsligt mycket farligare. Venus är tillbaka – och hon tänker inte
  låta Unico slippa undan.Med sprakande färgillustrationer, nyskapad av Samuel Sattin och Gurihiru, är
  UNICO: Uppvaknandet ett episkt äventyr för alla som gillar magi, vänskap och manga i världsklass. En
  banbrytande reboot av en älskad berättelse av Astro Boy-skaparen Osamu Tezuka, ”mangans gud”.'
