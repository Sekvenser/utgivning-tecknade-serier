description: 'Elena, Maya, Elijah och Hector befinner sig på en öde ö, utan att ha några minnen av hur
  de har hamnat där. På ön finns en byggnad som verkar vara en övergiven skola och i ett av rummen hittar
  de en gigantisk robot. När de närmar sig roboten väcks den till liv och ger dem ett uppdrag. Steg för
  steg dras de in i en farligt lek där vinnaren får en chans att lämna ön och förloraren riskerar att
  elimineras. Vem är egentligen vän och vem är fiende när allt sätts på spel?


  Midnattsön är en spännande serie i fyra delar, för alla som gillar klassiska äventyr som Flugornas herre
  och Hungerspelen.'
