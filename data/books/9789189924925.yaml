description: 'Drömmar, sagor & sex är Joakim Pirinens 23:e bok – och precis som väntat (och oväntat) rör
  den sig fritt mellan det absurda, det vardagliga och det banala. Här återvänder Döda paret, Pirinens
  mamma dyker upp i nya skepnader och Leif Pagrotsky får en plats i ett universum där logiken sedan länge
  har lämnat rummet. Med sin säregna blick och teckningsstil fortsätter Pirinen att tänja på serieformatets
  gränser. Det är lika delar dröm, satir och lågmäld galenskap – resultatet blir en samling teckningar
  och serier som rör sig obehindrat mellan humor och oro, mellan det barnsliga och det intellektuella.
  Kort sagt: ännu ett kapitel från en av Sveriges mest kompromisslösa serieskapare.'
