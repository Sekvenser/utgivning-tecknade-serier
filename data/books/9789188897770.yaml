description: 'Privatdetektiven John Blacksad är en bra katt som försöker göra det rätta i en ond värld,
  vare sig fallet gäller en mördad filmstjärna, en kidnappad liten flicka eller stulna atomhemligheter.
  Inte konstigt om många tycker att han sticker nosen i saker han borde haft vett att hålla sig undan.
  En sak är säker: Blacksad kommer att behöva alla sina nio liv i jakten på sanningen.'
