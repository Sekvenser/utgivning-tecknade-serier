description: Åh nej! Super Potato blir kidnappad! Den onde snigelkungen Zorr har rest till jorden för
  att fånga en jordvarelse till sin monstersamling. Av en slump stöter han på Super Potato – en högst
  ovanlig jordvarelse. Han fångar in potatis-hjälten och sätter honom i ett fängelse i yttre rymden. Super
  Potato måste nu komma på ett sätt att besegra den onde Zorr, befria alla monster i hans samling och
  ta sig tillbaka till jorden igen. Det blir en episk kamp!  Skrattfest för de yngre läsarna! Super Potato
  är lättlästa, actionfyllda och humoristiskt illustrerade böcker om superhjälten Super-Max som har blivit
  förvandlad till en potatis. En potatis med superkrafter!     Hegas böcker – lätta att läsa. Svåra att
  motstå.
