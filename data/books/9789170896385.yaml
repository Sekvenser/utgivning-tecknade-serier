description: Emma Gazelle älskar Arne Elefant varandra och lever ett stillsamt liv på den afrikanska savannen.
  En dag hittar de två en platt skalbagge , ett mobiltelefon som några safari-turister har tappat. Och
  i denna skalbagge finns en "Siri" som talar till dem och berättar märkliga saker om livet i något som
  heter "stad" och som ligger långt borta. Och där lever nakna apor bland fantastiska mirakel....
