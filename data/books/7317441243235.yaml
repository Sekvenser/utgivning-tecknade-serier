description: Här kommer Pippi Långstrump – starkast, roligast och påhittigast i hela världen! Följ med
  Pippi, Tommy och Annika på vinteräventyr i Villa Villekulla. Här kan du färglägga Pippi när hon åker
  skidor, bygger snögubbe, firar jul och leker i snön – förstås med Lilla Gubben och Herr Nilsson vid
