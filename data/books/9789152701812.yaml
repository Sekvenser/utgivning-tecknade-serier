description: En kärlekshistoria i 1930-talets Barcelona. Den unge kontoristen Tomás träffar grovarbetaren
  Basilio, som tar med honom till ruffiga barer där män kysser varandra och uppträder i kvinnokläder.
  Tomás familj undrar när han ska skaffa flickvän, medan han själv brottas med sina känslor för sin äldre
  vän. Snart hamnar de i säng med varandra.
