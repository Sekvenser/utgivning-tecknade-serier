description: 'Bagdad lyder under sin milde härskare, den godtrogne kalifen Harun Al Sindar. Kalifen litar
  fullständigt på sin storvisir, den ondsinte Iznogoud, trots att denne på alla upptänkliga sätt försöker
  röja sin kalif ur vägen för att sedan ta hans plats.


  Serien om den förslagne Iznogoud (namnet uttalas med fördel på engelska Is no good) som bor i ett sagoinspirerat
  Bagdad bland fakirer och flygande mattor, är ännu ett bevis för manusförfattaren René Goscinnys storhet.
  Hans berättelser om den elake storvisiren, vars högsta dröm är att bli kalif i stället för kalifen ,
  är den tredje klassiska franska humorserien efter Asterix och Lucky Luke som Goscinny skrev manus till.


  Denna samlingsutgåva med Iznogoud är den första svenska utgivningen av serien på många år. Boken är
  nyöversatt och innehåller utöver en mängd serieavsnitt också läsvärt extramaterial om serien och dess
  upphovsmän.'
