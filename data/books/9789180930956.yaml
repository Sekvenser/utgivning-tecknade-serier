description: Rymd-action i serieformat! Hjältarna Bu, Luna och Orion jagas av onda fiender i rymden. De
  slåss mot en ond klon av Bu, rappar loss i en episk intergalaktisk rap-battle och flyr från såväl utomjordiska
  spindlar som elaka robot-clowner. Det finns inte en lugn stund för våra hjältar! Grafiska romaner skapar
  stora läsupplevelser. Så är även fallet här, tack vare bokens färgsprakande bilder. Fyra actionpackade
  berättelser levereras i högt tempo och rymdtematik som scifi-nörden älskar. Roligt, spännande och knasigt
  utan att berättelsen någonsin känns barnslig! Farligt uppdrag är den andra fristående delen i den grafiska
  romanserien Galaxens hjältar.Hegas lättlästa böcker väcker läslusten hos barn och unga.
