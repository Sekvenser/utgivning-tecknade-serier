description: Arbetslinjen gäller för alla. Även för Klas Katt. Han har börjat arbeta som privatdetektiv
  och skadedjursbekämpare. Olle Ångest kommer hem till honom. Hans mamma Elsa har försvunnit. Klas Katt
  vet inte var han ska börja leta. När han tar hjälp av Pund-Kurta inser han att det inte bara handlar
  om att en person har försvunnit. Fallet är betydligt mer komplicerat.
