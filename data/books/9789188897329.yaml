description: Riad fortsätter att slitas mellan två kulturer. Mamma Clémentine har flyttat hem till Frankrike
  med Riad och hans två yngre bröder och försöker få tillvaron att fungera där, trots dålig ekonomi. Men
  plötsligt en kväll knackar det på dörren hemma hos familjen i Bretagne. Det är Abdel-Razak som oväntat
  kommit hem, och några veckor senare är hela familjen på väg tillbaka till Ter Maaleh i Syrien.
