description: 'Med den här väggkalendern av Jan och Maria Berglin blir de grå vardagsmorgnarna genast lite
  roligare. Med träffsäkerhet och humor låter paret Berglin sina stornästa figurer kommentera livet och
  tillvarons förtretligheter i stort och smått.


  Jan och Maria Berglin har kallats för Sveriges skickligaste mikrosatiriker. Under 30 år har de levererat
  skarpsynta och roliga ögonblicksbilder av tillståndet i Sverige och blivit folkkära på kuppen. Deras
  teckningar och serier publiceras varje vecka i Svenska Dagbladet och åtta andra dagstidningar.'
