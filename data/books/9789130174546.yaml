description: Nausicaä är fast besluten att ta reda på orsaken till ödeläggelsen som världen drabbats av
  efter Infernots sju dagar och reser söderut med prinsessan Kushana. Långt från Fördärvets hav har en
  liten by totalförstörts av bomber och dödliga sporer och hon börjar förstå innebörden av insektskonungarnas
  varning. Samtidigt planerar hon att ta upp kampen mot sina bröder och försöker rädda den tredje armén
  från att offras i en meningslös strid. Manga.
