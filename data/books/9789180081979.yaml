description: 'Bockarna Bruse ska till ängen när de plötsligt fastnar i ett TV-spel! De goda nyheterna:
  getterna förvandlas till en krigare, en ninja och en trollkarl! De dåliga nyheterna: ängen är borta
  - och i stället är där ett farligt slott fyllt med läskiga varelser och hemska fiender! Kan bröderna
  komma genom slottet levande och hitta ut till ängen igen?  Med fartfyllda illustrationer inspirerade
  av dator- och TV-spel lockas läsaren in i detta häftiga äventyr. Serien Flippade sagor tar en klassisk
  saga och flippar den. Såhär har ni aldrig sett Bockarna Bruse!   Hegas böcker – lätta att läsa. Svåra
  att motstå.'
