description: Kliv rakt in i världen från Netflix megasuccé KPop Demon Hunters. Nu som fartfylld serieroman!Huntrix
  är demonjagande popstjärnor som regerar på scenen och räddar världen i hemlighet. Men de får hård konkurrens
  av sensationen Saja Boys, som snabbt tar över topplistorna, med en dold agenda…Den här serieromanen
  bjuder på action, humor, dramatik och massor av K-pop-energi! Perfekt för trogna fans och nya läsare
  som vill uppleva spänningen från Netflix-hiten i ett helt nytt format.
