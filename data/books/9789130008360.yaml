  en kidnappad filmstjärna och Percys egen klon SuperKissen hoppas han en gång för alla att sätta tuggbenet
  i halsen på Hundmannen. Skönlitteratur för seende. Talboken läses med stöd av den digitala texten eller
  med den tryckta boken jämsides.
