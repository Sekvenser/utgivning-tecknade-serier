description: På order av kejsar Augustus har Alix rest till Grekland för att hämta hem samlingarna av
  profetior från Kybele, Apollons orakel. Khephren, en ung egyptier, agerar i hemlighet för att förhindra
  hans uppdrag, och tvingar Alix och hans följeslagare att följa efter honom in i den egyptiska öknen,
  till guden Ammons helgedom och de dödas berg.
