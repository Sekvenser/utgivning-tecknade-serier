description: 'Daniel Ahlgrens nya seriealbum Krympande utsikter.  Varje gång Daniel Ahlgren släpper ett
  nytt album är det som om serievärlden måste utlysa paus och kontrollera sina upphängningspunkter. Se
  efter om fästena i berättandets grunder fortfarande håller. Kolla om satiren har kvar sina basackord,
  om realismen sitter kvar i orubbat bo.  Vad ska komma denna gång?  Med sina tidiga album räknas Ahlgren
  som en av skaparna av den berömda svenska diskbänksrealismen som seriegenre - dit hör till exempel The
  girl who never fick nån post och Advent - serier med en genial känsla för hur livet byggs upp av samma
  evigt undanglidande frustrationer.  Med albumet Ett liv utan superkrafter är väl inte värt att leva?
  bytte han inriktning och började berätta om svenska ungdomar som går superhjälteprogrammet på gymnasiet.
  Fortfarande gäller yppersta konkretion, men i en annan ram: underhållningsindustrins fantasi om hjältar
  med superförmågor förverkligas här och nu, mitt ibland oss, med både uppruskande och förödande effekt.  Det
  nya albumet har en radikalt ny inriktning.  Här kommer en kvinnoversion av Franz Kafkas novell Förvandlingen!  Det
  handlar om Naima som är ute på stan tillsammans med sin man Stefan. Trottoaren fram kommer en galning
  med skjutvapen, utklädd till clown. Han hinner avlossa många livsfarliga skott innan det hela är över.
  Naima och Stefan hade mycket väl kunnat bli träffade, men det som hänt är istället att Naima tvärt har
  krympt. På oklart vis har hon blivit liten som en Barbie-docka, ja till och med något mindre.  Under
  de närmast följande månaderna kämpar hon och Stefan för att få en lösning på problemet. Hur ska hon
  återfå sin normala storlek? Det blir besök hos terapeuter, läkare och andra experter Alla menar att
  det är psykosomatiskt, att Naima måste komma till rätta med sin självkänsla.  Men är det så? Kanske
  beror förminskningen på något helt annat. Hur slutar det? Återfår Naima sitt rätta format? Ibland önskar
  man att man kunde få spojla i en presen­tationstext.  Men det får man inte.  Ahlgren har sedan debuten
  1993 gett ut mer än 20 seriealbum, inledningsvis av självbiografisk karaktär, senare mer vardagsrealistiska
  som exempelvis den Urhundenbelönade För fin för denna världen, uppföljaren The girl who never fick nån
  post och Ropa på Ulrik, men också utflykter i mer drömlik surrealism, som i boken Supertråken. Kronan
  på verket måste dock sägas vara superhjälteeposet SH3, vars första del, Ett liv utan superkrafter är
  väl inte värt att leva? gavs ut 2007 och följdes av ytterligare fem volymer.  Krympande utsikter av
  Daniel Ahlgren. ISBN 978-91-7742-614-1. Högkvalitetspapper, sydda ark, mjuka pärmar. 80 sidor.'
