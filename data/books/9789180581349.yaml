description: 'Samlingsvolym med albumen Blueberrys hemlighet, En yankee vid namn Blueberry och Blårockarna.


  Den unge Mike Donovan, son till en plantage- och slavägare i Georgia, blir oskyldigt anklagad för mord
  och måste fly för sitt liv. På vägen norrut söker han skydd hos en grupp unionssoldater som förbereder
  sig inför det stundande inbördeskriget mot sydstaterna. Mike tar sig namnet Blueberry och låter sig
  motvilligt värvas som trumpetare i nordstaternas kavalleri.


  Här börjar berättelsen om den unge Blueberrys upplevelser under det amerikanska inbördeskriget 1861–1865.
  Albumserien om Blueberrys ungdomsår startade 1975 och producerades i många år parallellt med huvudserien,
  och fortsatte också efter att denna hade avslutats. Totalt har det utkommit 21 album i serien av vilka
  endast fyra tidigare givits ut på svenska.'
