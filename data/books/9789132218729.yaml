description: '"Ett trollbindande mästerverk" – Dav Pilkey, skapare av Dog ManUnico är fortfarande jagad
  av Venus – och den här gången står ännu mer på spel. I sin flykt genom tid och rum vaknar han upp i
  en övergiven stad, där maskinerna har tagit makten. Räddad av den listiga musen Garapachi blir Unico
  vän med Chiko, en flicka som hålls fången av en ondskefull robotmaskin.Snart inser Unico att en mörk
  kraft styr stadens fabrik, med ett enda mål: att förinta allt levande. Samtidigt släpper Venus lös en
  skoningslös jägare som inte tänker ge upp förrän Unico är funnen. Kan Unico rädda Chiko? Och finns det
  någon som kan rädda Unico när faran kommer allt närmare?Nyskapad av författaren Samuel Sattin och konstnärsteamet
  Gurihiru, i samarbete med Tezuka Productions, är UNICO: Jagad är en banbrytande reboot av en älskad
  berättelse av Astro Boy-skaparen Osamu Tezuka, ”mangans gud”.Med sprakande färgillustrationer är de
  två böckerna om UNICO episka äventyr för alla som gillar magi, vänskap och manga i världsklass.'
