description: Rasmus Nalle och hans vänner tröttnar på det varma klimatet och beger sig till nordligare
  breddgrader. Resan är lång och snårig, men Rasmus är alltid redo för nya äventyr! I Nordpolen stöter
  de på en massa spännande saker - och nya, oväntade vänner. Carla Hansen (1906-2001) var en dansk författare.
  Tillsammans med sin man, illustratören Vilhelm Hansen (1900–1992) skapade hon den oerhört populära serien
  om Rasmus Nalle (på danska Rasmus Klump). Serien startade i tidningar i Danmark, men blev snart tryckt
  i bokform och spridd till andra länder.
