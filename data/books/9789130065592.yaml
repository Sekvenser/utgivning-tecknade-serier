description: Episk berättelse, i serieformat, från det småländska höglandets djupa skogar som utmanar
  och utforskar konventioner och traditioner. Här finns en homosexuell fascist som ritar självbiografiska
  serier, kärleksfull vänskap som slutar i svek och en längre fängelsevistelse. Här finns en bygd på sakta
  utdöende, en plats snart lika omodern och bortglömd som de egenhändigt utgivna fanzines som huvudpersonen
  Erik publicerar sina alster i.
