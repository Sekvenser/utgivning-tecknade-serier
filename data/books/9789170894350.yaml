description: En vacker och fantasifull saga om en brevbärare vid sjöposten som träffar en val med ett
  jättelikt bibliotek i magen. Judith Vanistendaels anslående akvarellbilder förstärker effektfullt Zidrous
  poetiska text. ”Valens bibliotek” får utan tvekan kallas för en allåldersbok, även om poesin i språket
  och handlingen som rymmer både erotik och grym död kanske kräver en viss mognad hos barn.
