description: 'När dåvarande prins Charles förlovat sig med Diana, fick han på en presskonferens frågan:
  ”Are you in love?” Han var tyst en stund, och svarade sedan: ”Yes … Whatever ’love’ means.”I den här
  boken försöker Liv Strömquist svara på den frågan: Vad är kärlek egentligen? Varför är vi så besatta
  av att hitta den, och varför ställer vi upp på så mycket för tvåsamheten? Tänk om känslan ”kärlek” i
  själva verket är något som uppstår ur en förhandling om sexuell äganderätt, och det vi kallar ”kärleksrelation”
  bara är en praktisk samlevnadskonstruktion som passar vårt samhälle och marknaden?Prins Charles känsla
  är en historisk och humoristisk granskning av den romantiska kärleken som samhällsfenomen. En odyssé
  kantad av folkliga sexköpare, sociologisk teori, crackpundare, asagudinnor, antiromantik och psykoanalys.
  Här finns frågor som: Var går gränsen för Gry Forsell? Hur blev Nancy Reagan vinnaren i Vårda en man-VM?
  Och varför ville Carrie Bradshaw klättra runt på Mr Big som en lilliput?Prins Charles känsla utkom första
  gången 2010 och har sedan dess blivit en modern svensk serieklassiker. Nu kommer den äntligen i nyutgåva,
  med ett nyskrivet efterord av Liv Strömquist.'
