description: Det lilla monstret Flopp ska börja skolan och ser fram emot att få lära sig att läsa och
  skriva. Men i monsterskolan är det förbjudet att räcka upp handen, läsa läxor och komma i tid. De små
  monstren tävlar om vem som kan försova sig längst och skapa mest kaos på skolgården. Alla utom Flopp,
  som i smyg drömmer om en värld där alla är lite mer som han.
