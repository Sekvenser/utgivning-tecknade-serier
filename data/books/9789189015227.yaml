description: Survilos lyckliga barndom i Leningrad får ett abrupt slut 1937, när fadern grips och på falska
  grunder anklagas för att vara en folkets fiende. Survilos öde tar henne sedan från den stora terrorns
  Gulag tillbaka till Leningrad under  andra världskriget. Under stadens belägring mister över en miljon
  människor livet  bara under den kalla vintern 194142 dör ­4000 människor varje dygn.
