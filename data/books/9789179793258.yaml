description: Raketen har äntligen kommit in i omloppsbana runt Mars, och rymdäventyrets första fas börjar
  närma sig sitt slut för Svea och de andra astronauterna ombord. Tänk att snart kommer de vara de allra
  första människorna som går på den röda planeten. Nere på jorden är det däremot inte lika muntert. Det
  finns en mystisk sabotör på skolan som riskerar att äventyra hela Mars-landningen. Sydney har sina misstankar
  om vem det kan vara – kommer han hinna avslöja sabotören innan det är för sent...Mars tur och retur
  är ett actionspäckat rymdäventyr för alla som drömmer om att en dag få utforska universum.
