description: Kaj fastnar i ett dataspel som styrs av den mäktiga AI-figuren S.N.Ö-drottningen. Kajs bästa
  vän Greta måste spela sig igenom alla nivåer för att rädda honom. Kommer hon att hinna fram i tid?   Klassiska
  Snödrottningen i digital tappning? Japp. Här flippar vi H.C. Andersen-sagan som även inspirerat filmerna
  om Frost. En moder twist i kombination med serieformatet gör klassikern tillgänglig även för den ovana
  läsaren. Använd boken i klassrummet för att prata hur sagor förändras genom olika medier eller jobba
  med vänskap. Hur långt ska man vara beredd att gå för att rädda sin bästa vän? Snödrottningens spel-quest
  är del 8 i serien Flippade sagor, där alla delar är fristående.  Hegas lättlästa böcker väcker läslusten
  hos barn och unga.
