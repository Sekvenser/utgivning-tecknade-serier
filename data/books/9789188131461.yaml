description: År 2026 upptäcks en planet i ett främmande solsystem, fullt beboelig. Planeten döps till
  Jannah – paradiset, och modiga nybyggare börjar kolonisera planeten. 80 år senare har Jannahs första
  stad blivit ett mål för rika emigranter från Jorden som vill börja ett nytt liv på en värld som, till
  skillnad från Jorden, har en framtid full av möjligheter. Ett litet sällskap färdas genom rymdens svindlande
  och farofyllda djup i stjärnskeppet SS Charlotte på väg mot den nya världen  Serieromanen Jannah 1 –
  Sista året på Jorden av Johan Jergner-Ekervik och Frida Ulvegren gavs ut 2016 av Kartago förlag. Nu
  fortsätter äntligen resan med Jannah 2 – Mellan två världar, utgiven av Ades Media. Detta är andra delen
  i en trilogi.
