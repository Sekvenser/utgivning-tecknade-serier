description: Efter att ha träffat en indisk maharadja under en skidsemester blir Johan, Lotta och Jocko
  och deras föräldrar inbjudna till Kobrornas dal, där det är tänkt att deras pappa ska arbeta med ett
  brobygge. Men en mystisk fakir med mörka planer är fast besluten att sabotera projektet och göra sig
  av med alla inkräktare i området. En äventyrsserie av Tintins skapare Hergé.
