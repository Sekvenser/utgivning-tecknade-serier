description: I mitten av 1970-talet växer Gru upp i en förort, mitt i en uppsjö av fjädrar i håret och
  utsvängda jeans. Gru är ett stort fan av en grupp superskurkar känd som Grymlingarna. Han funderar ut
  en plan som ska se till att han blir tillräckligt ond för att få vara med i gruppen. Lyckligtvis får
  han en viss kaosartad backup från sina lojala följare, Minionerna. Kevin, Stuart, Bob och Otto - en
  ny Minion med tandställning och ett desperat behov av att behaga – använder sina talanger när de tillsammans
  med Gru bygger sitt första hemliga gömställe, experimenterar med deras första vapen och försöker lyckas
  med deras första uppdrag. När Grymlingarna gör sig av med sin ledare, legendariska fightern Wild Knuckles,
  blir Gru intervjuad för att bli deras nyaste medlem.
