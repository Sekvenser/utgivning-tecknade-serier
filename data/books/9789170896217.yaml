description: 'Nina bor i en nedsmutsad stad som är hemsökt av veckans sex arga vargar: Måndag, Tisdag,
  Onsdag, Torsdag, Fredag och Lördag. Varje dag bär med sig arbetsuppgifter som aldrig tar slut.  Det
  finns en sjunde, snällare varg, men en elak häxa har stulit den och håller den inlåst. ”Den försvunna
  söndagen” av den rumänska serieskaparenIleana Surducan är inspirerad av gamla folksagor, men den kastar
  också ett ljus över problem vi har idag.'
