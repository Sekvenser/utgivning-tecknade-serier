description: Världens första Minecraft-serieböcker är här!Gänget hittar en övergiven portal och plötsligt
  befinner de sig i ett hörn av Nether som de aldrig besökt tidigare. Grace är gängets Nether-expert men
  när de andra vill att hon ska lösa alla svåra situationer börjar hon tröttna. Hon vill inte spela mer!
  Nu måste gruppen hålla ihop för att klara de svåra utmaningarna i spelet och samtidigt få tillbaka sin
  vän. Kommer de att klara det?Böckerna i serien är bildrika och fulla av äventyr och spänning. Perfekt
  läsning för den som just börjat bekanta sig med spelet men också för redan inbitna Minecraft-fans.
