description: Del 1 i serien Pisse-Misse. Pojken Sivert skyller allt dumt han gör på sin katt Pisse-Misse.
  De två befinner sig i ett ständigt krig. Och Pisse-Misse finner sig inte i att vara syndabock. Han bestämmer
  sig för att göra sig av med Sivert. Det visar sig vara svårt eftersom Pisse-Misse i smyg egentligen
  älskar Sivert. Eller åtminstone älskar att hata honom. Men kanske han kan göra sig av med Siverts lördagsgodis.
  Grafisk humorserie. Ålder 9-12 år.
