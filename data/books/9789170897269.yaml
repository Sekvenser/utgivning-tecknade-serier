description: Yakaris stam slår läger nära en klippbrant där vildgässen vilar under sin vårflytt. Men varför
  försvinner ett av gässen bland klipporna? - Serien om siouxpojken Yakari som kan prata med djur startade
  1969 och är en central, långlivad barnserieklassiker. Yakari är en briljant berättad, kulturellt inkännande
  och miljömedveten skildring av den nordamerikanska prärieurbefolkningen och djurvärlden omkring den.
