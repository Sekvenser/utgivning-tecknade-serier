description: Niklas Natt och Dags Bellman noir-trilogi är en av de mest framgångsrika svenska historiska
  skildringarna på senare tid. Böckerna har hyllats för sina skildringar av det sena 1700-talets Stockholm,
  en aspekt som fördjupas ytterligare då den första boken i trilogin, 1793, nu ges ut i ny form, som tecknad
  serie. Det inbundna albumet kompletteras med nyskrivna kommentarer av författaren, som ger inblickar
  i böckernas historiska bakgrund och rika källmaterial, vilket gör volymen till ett måste för såväl hängivna
  läsare som för nykomlingar och seriekonnässörer. Bearbetningen har gjorts av ett team bestående av framstående
  italienska manusförfattare och tecknare i samarbete med författaren själv.
