description: Arvo Pärt - en av vår tids mest mytomspunna, ännu levande, tonsättare - får äntligen sin
  historia berättad! I serieform får vi följa den unge Arvo, vars liv kommer att präglas av ett musikaliskt
  sökande. Boken är också en skildring av hur det var att leva i Estland under sovjetisk ockupation. Berättelsen
  sträcker sig fram till 1980-talet då tonsättaren, med sin familj, tvingas lämna Estland.
