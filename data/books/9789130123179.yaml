description: Tredje och sista delen i den tecknade serien om tonårstjejen Ella. Ellas hårfärg skiftar
  beroende på vilken av hennes sex personligheter som dominerar. Hon har själv ingen kontroll över växlingarna.
  För tillfället är det den blåhåriga som har övertaget men så hörs en främmande röst sammankalla alla
  sex Ella. Kan det finnas en sjunde del av henne? I boken Sensationell(a) bestämmer Ella sig för att
  ta reda på mer om sitt förflutna. Ålder 12-15 år.
