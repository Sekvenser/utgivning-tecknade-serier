description: 'Aang och hans vänner ser fram emot luftnomadernas Yangchen-festival, som inte har firats
  på över hundra år. Men när avatar Yangchen leder dem till ett raffinaderi som har byggts på mark som
  luftbändarna ser som helig, anar Aang att något inte står rätt till. Vattnet kring fabriken stinker
  av föroreningar och när en hämndlysten uråldrig ande väcks till liv måste Aang försöka förhindra att
  hela området ödeläggs.


  Avatar är en amerikansk fantasyserie i mangastil, med action, humor och spännande karaktärer. Böckerna
  tar vid där säsong tre av den tecknade tv-serien slutar.'
