description: 'En fristående fortsättning på serien Comanche. DET ÄR TIDIGT 1900-TAL I KALIFORNIEN. Red
  Dust, legenden vars namn är inskrivet i Wyomings blodiga historia, lever isolerad i väntan på slutet.
  En dag kommer den unga Vivienne på besök, och det förflutna han trodde sig ha lagt bakom sig vaknar
  till liv och jagar ut honom på vägarna igen. Det har blivit dags att söka upp den kvinna han aldrig
  har kunnat glömma: Comanche.'
