description: Del 2 i den tecknade serien Ella som började med Speciell(a). Ella är som de flesta andra
  i klassen bortsett från att hon har sex olika personligheter. Hennes hårfärg skiftar beroende på vilken
  av de sex som dominerar. Den rosafärgade vänliga Ella försöker att återfå kontrollen över den blåa som
  är dominant och manipulerande. Vännerna börjar misstänka att något inte stämmer men hur ska de kunna
  hjälpa Ella att bli fri från den blåa? Ålder 12-15 år.
