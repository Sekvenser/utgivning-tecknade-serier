description: Torsten vill mata fåglarna på gården men en ekorre stjäl maten hela tiden. Torsten tar till
  allt grövre metoder för att stoppa ekorren. Till slut mjuknar han av ekorrens gullighet och Annabelles
  vädjanden och bygger två matplatser, en för ekorren och en för fåglarna. Matplatserna används, men kanske
  inte riktigt som det var tänkt.
