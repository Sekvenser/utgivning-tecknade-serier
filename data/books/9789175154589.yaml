description: Dittes pojkvän Axel har länge drömt om att resa längs Transsibiriska järnvägen med filmkameran
  i den ena handen och en bok av Tolstoj i den andra. Men redan i Moskva börjar Ditte undra vad hon har
  gett sig in på, och i den trånga tågkupén kommer deras relation att sättas på prov. Hur mycket av sin
  självständighet är Ditte egentligen beredd att offra för att bli den perfekta flickvännen?
