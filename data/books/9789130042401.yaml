description: Pappa ropar till de fyra syskonen att det är mat. Middagen är bara första steget i föräldrarnas
  ondskefulla plan att få barnen att gå och lägga sig. Varje kväll kommer ett monster, Natten, som sväljer
  hela solen och äter upp barn som inte sover. Det är därför läggdags finns. Om Donald, Prins, Polly och
  Pamela kunde fånga Natten skulle de aldrig mer behöva gå och lägga sig. Men hinner de fånga monstret
  innan det är för sent? Seriebok för unga läsare.
