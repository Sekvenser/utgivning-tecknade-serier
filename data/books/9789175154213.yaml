description: Hänger du med? Vet du vad sambandet är mellan Nils van der Poel, en heilande ekorre, Iggy
  Pop, fästingar på intima ställen, primtalsfaktorisering, Margaux Dietz, rondeller och posterotisk litteratur?
  Jo, allt detta och mycket mer dyker upp i den nya samlingen med Jan och Maria Berglins teckningar och
  serier. Med träffande humor och bitsk satir gisslar de allehanda samtidsfenomen och uppmärksammar oss
  samtidigt på några av det gångna årets ledord, som nissedörr och "gruvtolvan". Varsågod och hugg in!
