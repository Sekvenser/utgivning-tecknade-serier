description: I Änder får Kate Beaton fullt utlopp för sitt hantverk då hon ritar kolossala maskiner och
  mammutfordon mot en sublim backdrop bestående av Albertas tajga och nordiska ljus. Hennes första längre
  berättelse i serieformat är ett avslöjande porträtt av det Kanada som gärna stoltserar med solidaritet
  och vackra landskap, samtidigt som det hänsynslöst exploaterar både natur medborgare.
