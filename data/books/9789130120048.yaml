description: Del 1. Charlie och Nick går på samma brittiska pojkskola, men har aldrig träffats då de en
  dag hamnar bredvid varandra i klassrummet. De två killarna blir snabbt kompisar och snart har Charlie
  fallit pladask för Nick, trots att han är övertygad om att det är kört på förhand. Men kärlekens vägar
  är outgrundliga. Det visar sig att Nick är betydligt mer intresserad av Charlie än vad någon av dem
  hade kunnat ana. Inläst på engelska. 12-15 år.
