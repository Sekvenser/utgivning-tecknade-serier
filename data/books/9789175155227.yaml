description: 'Följ med Bodil och hennes nya kompis, kackerlackan Gregor, på ett galet äventyr i Underjorden!
  Kommer de att lyckas besegra alla skumma fiender, motstå skogens läckerheter och hitta rätt väg genom
  de mörka avloppssystemen? Vid resans slut återstår i så fall den största utmaningen: Underjordens härskare,
  även känd som Gröna faran!


  Med blinkningar till klassiker som Alice i Underlandet, Bröderna Grimms sagor och Den gudomliga komedin
  har den brittiska tecknaren Tor Freeman skapat en berättelse fylld av humor och knasiga karaktärer,
  som kommer att leda till många skratt!'
