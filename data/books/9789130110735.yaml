description: Emily är 12 år när hon förlorar sin pappa i en bilolycka. Tillsammans sin mamma och yngre
  bror Nevin flyttar hon till ett gammalt ödehus familjen ärvt. De upptäcker snart att huset ruvar på
  hemligheter. När ett monster drar in deras mamma genom en dörr i källaren följer syskonen efter för
  att rädda henne. De hamnar i en underjordisk värld befolkad av demoner, robotar och talande djur. Skönlitteratur
  för seende.
