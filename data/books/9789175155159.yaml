description: 'Superäventyr med Iron Man och Hulk!


  Uppfinnaren Tony Stark, mer känd som Iron Man, tycker att han och Hulk ska bli bättre kompisar. Därför
  ber han sin storväxta Avengers-kollega lära honom konsten att krossa saker på det mäktiga sätt som bara
  Hulk kan. Men Hulk tycker att Iron Man är alldeles för klen för att han ska klara av det.


  Iron Man sätter därför i gång med att konstruera en jättestor och ännu kraftfullare ny dräkt, som ska
  hjälpa honom att bli minst lika bra som Hulk på att krossa. Men när en grupp gigantiska monster dyker
  upp och sprider skräck i staden måste de båda hjältarna lära sig fajtas tillsammans för att kunna avslöja
  vem som ligger bakom monsterattackerna.


  Iron Man 2: Supersmällen! är en kul och spännande seriebok för unga superhjältefans av teamet Dean Hale
  (manus) och Douglas Holgate (teckningar).'
