description: Ingen är beredd när en snöstorm sveper in över Vildmarks-systrarnas tält-övning. Och hur
  skulle de kunna vara beredda – det är ju mitt i sommaren!? När dessutom en flock horn-vargar visar sig
  kommer Jen ifrån de andra. Beslutna att rädda sin älskade ledare rustar Jo, April, Sam, Molly och Rebecka
  sig för snö-äventyr och ger sig ut. Men vad har hänt med Jen egentligen? Och vad är det för mystisk
  kvinna som skjuter magiska djur i skogen?  Mystiken tätnar ytterligare i den fjärde delen av Vildmarks-systrar!
  Vissa frågor får svar samtidigt som ännu fler frågor väcks på det minst sagt ovanliga scout-lägret.
  En galet rapp, färgglad och spännande serie där verkligheten luckras upp med magi, monster och mystiska
  varelser.      Hegas böcker – lätta att läsa. Svåra att motstå.
