description: 'The City is firing sentient smart-missiles against terrorists hiding in the previously unknown
  desert. But who is this outer enemy? Using metamagic, Purple learns how to fly and takes Information
  and Erica on an expedition to find out, but the truth comes with unexpected dangers.  Piracy is Liberation
  mixes classic cyberpunk elements in a dystopian future with a glimmer of postapocalyptic hope and a
  pinch of metamagic. Weighing in at 236 pages, this book continues the story started in Piracy is Liberation
  012: Outer Enemy.'
