description: Ett rike plågat av mörk magi och strid. En kvinnlig magiker kommer att stiga upp ur mörkret
  för att skänka hopp eller undergång. En gång i tiden beskyddades staden Bal Khunda av ädla krigare och
  heliga präster. Mörka makter vände sedan allt till förräderi och blodspillan. Själva jorden revolterade
  i vrede och kastade upp en del av staden på en brant klippa. Vilda män och varelser ur skuggorna trängde
  fram och rikets folk föll ned i förtvivlan och desperation. Många år har passerat och nu lurar en fästning
  kallad Bar Kthuga uppe på den skyhöga klippan. De höga Shacarth-prästerna i Bal Khunda har övertygat
  folket att de som finns uppe på klippan bär skulden för allt deras lidande. Legoknektar från de kringliggande
  länderna har anslutit sig till Bal Khundas krigare för att få sin del av krigsbytet. Nu har tiden kommit
  att kväsa klippan. Men finns den verkliga fienden verkligen på klippan? Eller mycket närmre? Allt detta
  har förutspåtts av en profetia. En profetia som nu har hittats av adelskvinnan Dèon. Den säger att en
  stor, kvinnlig magiker kommer att stiga fram och ställa allt till rätta igen. Det splittrade och plågade
  riket kommer att helas i en stor konfluens. Men är det fru Dèon som är denna magiker? Eller är det den
  uråldriga sierskan som frammanades ur sin mystiska, gravliknande fängelse? Eller kan det vara den unga
  bondflickan från de hemsökta träsken? Är profetian att lita på eller kommer riket bara att kastas ännu
  djupare ned i ond trolldom och blodspillan? Börja utforska Crannogs värld för att få veta!
