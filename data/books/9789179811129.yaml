description: När Yumi och Tomu ska på maskerad är det mycket som måste fixas och pysslas i Pandaihuset.
  Tomu ska klä ut sig till självaste Spelmästaren medan Yumi har en hemlig, giftgrön idé. Senare på maskeraden
  upptäcker de att någon saboterar festen. Men hur hittar man den skyldiga bland alla superhjältar och
  monster?Böckerna om Yumi & Tomu är generöst illustrerade av Gustaf Lord. I den här serieboken får hans
  bildberättande ta ännu större plats. Med lättläst text i rutor och pratbubblor är det en perfekt bok
  för nybörjarläsare som gillar humor.Yumi & Tomu är youtubers från Uppsala som blivit otroligt populära.
  Genom att göra roliga och kärleksfulla videor vill de skapa underhållning för barn, med snällare tilltal
  än mycket annat som finns på Youtube.
