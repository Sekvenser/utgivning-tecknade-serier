description: '"Mitt namn är Johannes och jag älskar mat. Från ung ålder blev jag van vid att ta en extra
  portion. På dagis var det fult att lämna mat. "Tänk på barnen i Afrika", sa man och det satte djupa
  spår i mig. Sedan dess har jag alltid ätit upp allt på tallriken." Bord för en handlar om matmissbruk
  och är Johannes Torstenssons debut i bokform.'
