description: När fulhet kommer till stan och ondskan växer måste våra heroiska hjältar hjälpa till - det
  är dags att göra gott! Katten, och superskurken, Percy släpps äntligen ur fängelset och börjar ett nytt
  liv med sin son Lill-Percy. Men när Percys egen pappa dyker upp måste han göra upp med sitt förflutna
  och kämpa för dem han älskar! Percys pappa är en riktigt usel fuling. Samtidigt försöker SuperPolarna
  att hjälpa Hundmannen att bli av med en del dåliga vanor som ställer till det för honom. Som att plötsligt
  börja jaga ekorrar eller bollar och helt glömma att han är på ett viktigt uppdrag. Men behandlingen
  är lite för effektiv och han blir i stället rädd för bollar. Något som stans nya superskurk genast bestämmer
  sig för att utnyttja!
