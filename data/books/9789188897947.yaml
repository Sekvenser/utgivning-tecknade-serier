description: Pojke möter pojke. Charlie och Nick går på samma pojkskola, men har aldrig träffats då de
  en dag hamnar bredvid varandra i klassrummet. De två killarna blir kompisar och snart har Charlie fallit
  pladask för Nick, trots att han är säker på att det är kört på förhand. Men det visar sig att Nick är
  mer intresserad av Charlie än vad någon av dem hade kunnat ana.
