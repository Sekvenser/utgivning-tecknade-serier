description: I Återvinningscentralen skildrar Ulrika Linder sin jobbvardag på en återvinningscentral.
  Det är långa dagar av sopor, svett och ständiga möten med rättfärdiga typer som tror sig veta bäst men
  i det här fallet har kunden alltid fel.Med en stor dos humor, fantastiskt detaljerade teckningar och
  absurda foton ger Ulrika Linder ett unikt vittnesmål från Prylsveriges kyrkogård.
