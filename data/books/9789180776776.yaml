description: När Katja råkar hamna i boken om Askungen är hon inte imponerad! Varför är det bara Askungen
  som städar och varför är hennes styvmor och systrar så elaka mot henne? Och varför säger inte hennes
  pappa ifrån? Och vad är det egentligen som händer på balen på slottet? Katja har ett och annat att säga
  om det hela innan hon kan lämna den välkända sagan. Med Katjas hjälp kanske Askungen kan våga stå upp
  för sig själv! Nu introducerar Nypon förlag serieböcker som tar ett modernt och humoristiskt tag om
  några av historiens mest välkända sagor. Först ut i serien är Katja och Askungen, där Katja lär Askungen
  att våga stå upp för sig själv. Askungen säger nej är på nivå 3.
