description: Universums portar har öppnats och Lyra och Will rör sig mellan Cittàgazze och vår egen värld
  på jakt efter ett hemligt och mäktigt föremål som många är beredda att döda för att få äga. Men de är
  inte ensamma om att ha funnit öppningen mellan världarna.  Detta seriealbum är det andra av tre baserade
  på Philip Pullmans bok Den skarpa eggen, som utgör den andra delen av trilogin Den mörka materian, också
  känd som His Dark Materials.
