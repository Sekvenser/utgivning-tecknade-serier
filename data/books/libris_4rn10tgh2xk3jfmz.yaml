description: Vi får följa livet på en bensinstation i Ådalen och lära känna den minst sagt speciella personalen
  och de människor som har ärenden dit. Kunder som köper snus och korv, lämnar in överkörda katter, mekar
  med lösnaglar, skräms till nykterhet, räddar utelåsta barn och en hel del andra mer eller mindre originella
  personer. Här berättas även mackens historia i Sverige och hur det gick från framtidsikon till en symbol
  för klimatets undergång. Seriealbum.
