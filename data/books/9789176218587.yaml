description: När den nya islandshästen Maunadis kommer till stallet där Tilde rider är det bara Tilde
  som kan hantera den vildsinta hästen, och på något sätt känns det som att Maunadis kan läsa hennes tankar.
  Inom Tilde växer en känsla av att Maunadis är i fara och att han har kommit för att be henne om hjälp.
  Kanske är Tildes märkliga drömmar om mystiska hästar, skräckinjagande väsen och ett lysande halsband
  något som inte bara finns i fantasin ...?
