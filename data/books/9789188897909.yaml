description: Riad har fyllt 14 år. Han är inte längre ljushårig och har det ganska jobbigt med det mesta.
  Hans pappa Abdel-Razak har tagit med sig hans yngste bror Fadi till Syrien. Medan Riads mamma Clémentine
  på alla vis försöker få hem Fadi till Frankrike igen, tar Riad sin tillflykt till det paranormala. Han
  blir inspirerad att läsa Lovecraft, och han möter Anaïck, den första kärleken.
