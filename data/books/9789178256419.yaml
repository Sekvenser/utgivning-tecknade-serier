description: Mio är stjärnan i fotbollslaget Attack. Men han känner att det är något som saknas. Han behöver
  ny energi. Så i smyg börjar han hänga i parken och spela boll med kidsen som brukar samlas där. I parken
  är det Lola som är bäst på plan. Mio tror att han ska kunna imponera på henne, men istället får han
  lära sig en hård läxa … och måste spela sitt livs tuffaste match.
