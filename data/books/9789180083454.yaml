description: 'Hjälp! Vad har hänt med superhjälten Super-Max? Hans vackra svallande hår är borta? Hans
  näsa, hans ben! Allt är knöligt! Han har blivit en potatis! Självklart är det den onda Doktor Elak som
  står bakom allt. Han hotar att zappa alla som inte håller med honom till potatisar. Men något han inte
  räknat med är att även om Super-Max är en potatis är han inte någon vanlig potatis. Han är givetvis
  en superstark superhjälte-potatis. Han är Super Potato!Det är dags för en ny superhjälte att ta plats
  i våra hjärtan! Super Potato är en knasig och actionpackad superhjälte-serie för de yngsta läsarna.
  Med en stor dos humor och korta raka meningar är det bäddat för en läsupplevelse fylld av skratt och
  fladdrande mantlar.Hegas böcker – lätta att läsa. Svåra att motstå.  EPUB3: Fixed format, Synchronised
  audio'
