description: 'En fängslande berättelse om nazismens sista månader och den tunna linjen mellan överlevnad
  och moralisk kompromiss. Sensommaren 1944: Nazitysklands huvudstad Berlin ligger i ruiner. Den regimkritiska
  författaren Heinz Hoffmann har levt i inre exil i elva år när han erbjuds ett jobb som spökskrivare
  för en propagandafilm. Han accepterar för att slippa bli kanonmat i nazisternas sista försvarsuppbåd.'
