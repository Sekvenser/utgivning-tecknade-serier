description: Mallorca på 80-talet, Palmas historiska kvarter dallrar i hettan. Gabi och hans kompisar
  är i tonåren. Ett Mallorca långt ifrån den bild som svenska turister fick av charterparadiset på 80-talet.
  Palmerna, stranden och sangrian är i bakgrunden, drogerna och våldet i centrum. Det är en patosfylld
  och osminkad skildring av fattigdom, stark vänskap, frihet och utsatthet.
