description: Nu ska Elena och Zick hjälpa alla kidnappade katter hem igen. I slutet av det förra äventyret
  kom det fram att Zicks katt Tim är en stjärn-väktare. Vi fick också veta att Zick är en tämjare som
  kan befalla monster och svarta andar.  Men Piraten Ruggskägg har dykt upp i staden. Han är en svart
  ande – alla monsters värsta mardröm. För att skydda Bombo och de andra monstren som bor på Zicks vind
  måste Elena och Zick besegra Ruggskägg. Är det en omöjlig uppgift … till och med för en tämjare och
  en stjärn-väktare?  Serien Monster-Allergi är roliga och spännande serieromaner. De innehåller alltså
  massor med bilder som hjälper till att berätta historien. De första fyra delarna handlade om skurken
  Magnacat som stal katter. I del fem börjar en ny berättelse som fortsätter i del sex och sju.    Hegas
  böcker – lätta att läsa. Svåra att motstå.
