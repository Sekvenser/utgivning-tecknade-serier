description: Blixt-Grodon, de existentiella frågornas och de kniviga situationernas mästare, är tillbaka
  för att oskadliggöra superskojaren och ärkeskurken Lutor.  Serien Blixt-Grodon publicerades i Stockholms
  Universitets Studentkårs tidskrift Gaudeamus 1964–1988 och har sedan dess återpublicerats i bland ­annat
  Dagens Nyheter, Jules Verne-Magasinet, Kapten Stofil samt i två samlingsutgåvor 1968 och 2002. Denna
  volym presenterar den kompletta produktionen av Lars ”Lon” ­Olssons Blixt-Grodon, varav 180 strippar
  som aldrig tidigare ­återpublicerats.
