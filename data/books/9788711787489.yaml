description: Rasmus Nalle är krönt till konung och besöker slottet. Det är en otroligt stor byggnad som
  innehåller många, många rum. Slottsförvaltaren tar med Rasmus och hans vänner på en rundtur i slottet.
  Där träffar de på en massa roliga och kluriga figurer, ett elefantspöke och en lekfull gubbe-i-lådan
  med flera. Carla Hansen (1906-2001) var en dansk författare. Tillsammans med sin man, illustratören
  Vilhelm Hansen (1900–1992) skapade hon den oerhört populära serien om Rasmus Nalle (på danska Rasmus
  Klump). Serien startade i tidningar i Danmark, men blev snart tryckt i bokform och spridd till andra
  länder.Efter att Rasmus Nalle hittat en gammal fartygsratt på en soptipp får han hjälp av sina vänner
  att bygga ett skepp. På skeppet, som de döper till Mary, reser de sedan runt i världen och upptäcker
  nya fantastiska platser.
