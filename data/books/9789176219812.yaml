description: Föga anar Elina att hennes liv snart kommer att förändras för alltid. Elinas mormor kommer
  nämligen snart att avslöja en hemlighet hon är småfolkets vän och beskyddare av de magiska varelser
  som garanterar balansen på jorden. Nu är tiden inne att låta uppdraget gå vidare och i all hemlighet
  skickar mormodern receptet på det magiska elixiret till sitt barnbarn. Kommer Elina att lyckas hemlighålla
  sina nya krafter och hålla dem hemliga för sin mor? Samtidigt som hennes mormor lär henne allt hon behöver
  veta.
