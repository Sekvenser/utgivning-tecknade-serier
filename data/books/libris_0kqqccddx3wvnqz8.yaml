description: Sayed säljer granar men han har stavat fel på sin skylt så Torsten tror att han säljer grannar.
  Torsten ifrågasätter om man verkligen kan sälja grannar. Han inser under tiden hur mycket han älskar
  sina grannar, trots deras brister. Han vill absolut inte köpa några nya. När missförståndet uppdagas
  köper Torsten granar till alla sina grannar.
