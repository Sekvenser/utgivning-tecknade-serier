description: Den här berättelsen börjar när pappa ropar till de fyra syskonen att det är mat. Storebrodern
  Donald vet att middagen är första steget i föräldrarnas ondskefulla plan att få barnen att gå och lägga
  sig. Varje kväll kommer ett monster, Natten, som sväljer hela solen och äter upp barn som inte sover.
  Fångar de Natten behöver de aldrig mer lägga sig. Hinner de fånga monstret innan det är för sent?
