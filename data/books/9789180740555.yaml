description: Den vita irisen är en symbol för optimism och utveckling, men vad händer när den vita irisens
  filosofi utnyttjas för Caesars dunkla syften? Snart anländer Roms chefläkare till våra galliska vänners
  by och inspirerar dem att förverkliga sig själva. Frid och harmoni präglar bybornas nya tillvaro, men
  under ytan krackelerar gemenskapen. Den franske författaren Fabcaro och tecknaren Didier Conrad har
  tillsammans skapat ett nytt Asterixalbum som kan mäta sig med de klassiska äventyren i serien underfundigt,
  smart, välskrivet och förförande roligt.
