description: 'En natt vaknar Alisik upp på en kyrkogård. Hon blir livrädd och bestämmer sig för att fly
  så fort som möjligt, men hon inser snart att något inte är som förut: Ingen levande kan se henne. Hon
  är död. Snart träffar hon fler som är fångade mitt emellan liv och död. Plötsligt dyker Ruben upp -
  den enda levande person som kan höra henne.'
