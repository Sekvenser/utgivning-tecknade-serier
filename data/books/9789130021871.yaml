description: Del 3 i serien som börjar med Den lilla häxan. Återigen möter vi Ida, hennes kompis Ester,
  läraren Greta Borg, de snorkiga trillingarna och alla andra personligheter i klassen. Ida och Ester
  bygger kojan och allt fler klasskamrater kräver att få vara med. Till slut är de ett helt gäng, inklusive
  trillingarna som övertalar Ida att förbättra kojan med magi, och när hon gör det börjar saker och ting
  verkligen gå över styr.
