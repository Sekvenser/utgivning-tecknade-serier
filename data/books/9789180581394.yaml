description: 'Lucky Luke har anlitats av en rik industrimagnat för att hitta dennes brorson som kidnappades
  av en indianstam som spädbarn. I Minnesotas snötäckta skogar hittar Luke efter en tid pojken, som nu
  heter Röda Molnet, är tio år gammal och har adopterats av stammens hövding.


  Luke inser snart att hans uppdragsgivare bara är ute efter att bli kvitt en rival om familjeförmögenheten
  och att pojkens liv är i fara. Nu har han inget annat val än att föra sin nya skyddsling norrut, mot
  Kanada och säkerheten. Den blir en lång och farlig färd genom vildmarken, där de måste försvara sig
  både mot vilda djur och ett gäng banditer som är dem hack i häl.'
