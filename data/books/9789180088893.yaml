description: 'Vad är grejen med kärlek? Linn och Abeba fattar inte. Hur kul kan det vara att stå och hångla
  bakom bibblan hela dagarna? Och varför blir folk bara kära i de snygga och populära på skolan? Linn
  och Abeba bestämmer sig för att gå till botten med kärlekens mysterier. Men i samma stund som de börjar
  fråga runt bland kompisarna bryter kaos ut på skolan: förälskade par gör slut, kompisar börjar bråka,
  en lista på skolans snyggaste tjejer sprids i korridorerna. Kärlek verkar göra folk galna. Till och
  med Linn och Abeba dras med i kaoset.  Manga + kärlek = sant! Hjärtats hemligheter är första delen i
  den lättlästa, grafiska serien LOVE om magpirr och hjärtslitande förälskelser; om svartsjuka, skvaller
  och utseendenormer; om självförtroende, identitet, vänskap. Och självklart om kärlek! Det här är en
  färgsprakande serie med luftig text, en dialog- och bilddriven berättelse för mellanåldersläsaren som
  inte kan få nog av manga.    Hegas lättlästa böcker väcker läslusten hos barn och unga.'
