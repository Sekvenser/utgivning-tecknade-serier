description: Självbiografisk serieroman. Maia Kobabe skriver om utforskandet av sin identitet och om sin
  uppväxt. Hur det är att vara ung och förälskade samt att komma ut till familj och samhället skildras.
  Med boken ville författaren ursprungligen förklara för sina föräldrar hur det är att vara ickebinär
  och asexuell. Men förutom att vara en personlig berättelse är det också en guide kring könsidentitet.
  Inläst på engelska.
