description: Barn är det värsta häxor vet och allra helst skulle de vilja utplåna alla barn från jordens
  yta. Den ruskiga Storhäxan har en plan för hur de ska kunna göra precis det. Men tur nog står en liten
  pojke i häxornas väg. Han är visserligen bara åtta år, men han är påhittig och modig och har världens
  bästa mormor. Tillsammans tänker de försöka sätta stopp för Storhäxans onda planer.
