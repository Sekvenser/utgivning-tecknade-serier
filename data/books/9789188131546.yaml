description: 'I ett Sverige där Arbetsmiljöverket förbjuder människor att utöva riskabla yrken tvingas
  såväl rättsväsende som underrättelsetjänst att sätta sin tillit till närbelägna grenar i släktträdet:
  en genial vetenskapsman har hittat ett kryphål i lagstiftningen och via genetisk manipulation samt mångårig
  stridsträning framtagit en ny generation av hjältar.  Vårt hopp står nu till fem ovanligt verbala och
  någorlunda rakryggade apor som tillsammans måste stoppa eskalerande kriminalitet, kväsa utomjordiska
  invasionsplaner, tämja titaniska monster, binda skenande bolåneräntor och hålla vettvilliga superskurkar
  stången. Vårt hopp står till A.M.O.K. – Avdelningen Med Omänskliga Krav.  Denna samlingsbok inhyser,
  förutom Oscar Hjelmgrens alla minnesvärda serieäventyr kända från tidningen Herman Hedning och hundratals
  nytecknade sidor, även exklusivt bonusmaterial i form av oanvända bilder, berättelsen om A.M.O.K.:s
  uppkomst, kontroversiella avslöjanden från bakom kulisserna samt ett kort och koncist förord signerat
  serieskaparlegenden Patrik Norrman.'
