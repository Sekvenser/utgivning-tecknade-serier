description: Zodiakens riddare - människornas beskyddare! Sedan tidernas begynnelse har de olympiska gudarna
  kämpat om vem som ska styra över jorden. Den enda som vågar sätta sig upp mot dem är gudinnan Athena
  och hennes riddare, som har svurit att beskydda människorna. Men när en mäktig motståndare dyker upp
  är riddarnas framtid hotad. Serien bygger på den internationella mangasuccén och animen.
