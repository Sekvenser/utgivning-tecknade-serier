description: 'Upplev den älskade Star Wars-sagan på ett helt nytt sätt! Läs om Luke Skywalker, Han Solo,
  prinsessan Leia, Darth Vader och alla de andra hjältarna och skurkarna i den här serieromanen, som återberättar
  de klassiska filmerna i originaltrilogin. Följ med till en galax långt, långt borta och en tidlös berättelse
  om kampen mellan gott och ont!Följande delar ingår i samlingsvolymen:”Episod IV - Star Wars: Ett nytt
  hopp (A New Hope)”, ”Episod II - Star Wars: Rymdimperiet slår tillbaka (The Empire Strikes Back)”, och
  ”Episod III - Star Wars: Jedins återkomst (Return of the Jedi)”.'
