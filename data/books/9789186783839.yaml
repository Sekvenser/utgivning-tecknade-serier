description: Följ med på den spännande resan från Amsterdam till Indonesien... berättelsen utspelar sig
  1629 ombord på skeppet Jakarta. Baserat på en verklig händelse/historia.  “Endast de förtvivlade riskerar
  sig ombord på skeppet Jakarta.  Till besättning har man värvat Amsterdams absolut lägsta samhällsskikt,
  och i lasten ligger nog med guld och diamanter för att köpa en hel stadsdel.  Ett flytande helvete,
  och en flytande krutdurk.  Bland resenärerna på denna mardrömsfärd finner vi aristokraten Lucretia Hans
  och och den ruinerade apotekaren och kättaren Jeronimus Cornelisz. Hon är den enda som kan hindra den
  djävulske apotekaren att tända luntan.  Trevlig resa!”
