description: Siri är tillbaka för ett nytt äventyr! Den här gången kommer den modiga vikingatjejen och
  hennes kompis Zack en försvunnen skatt på spåren. De får hjälp av munken Ansgar som letar efter sina
  stulna böcker. Ledtrådarna pekar mot en mystisk plats som kallas Mimers brunn. Men de jagas av skurken
  Ivar och hans klantige medhjälpare Grym som försöker lägga beslag på skatten. Återigen får Siri använda
  all sin finurlighet för att lösa gåtor och ta sig förbi läskiga fällor. Och vad är det för dyrbarheter
  som döljer sig i Mimers brunn?
