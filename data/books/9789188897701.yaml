description: '"Näktergalen från Milano", operadivan Bianca Castafiore, är på turné i Latinamerika då hon
  fängslas anklagad för att ha deltagit i en sammansvärjning. Inspiration och bakgrund till händelserna
  i Tintin hos gerillan hämtade Hergé från den politiska situationen i Latinamerika under 1960- och 70-talet.
  Albumet utkom första gången 1976 och var det sista som gavs ut under Hergés livstid.'
