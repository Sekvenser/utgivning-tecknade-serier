description: Yvonne, eller Spyvonne som killarna kallar henne, är längst i sexan, kanske till och med
  i hela skolan. Hon hatar att prata inför klassen och nu när Hanna har flyttat frågar ingen om hon vill
  vara med längre. På temadagen hamnar hon i gruppen Sopornas vänner där hon träffar nya Emma som inte
  verkar bry sig ett  dugg om vad andra tycker. Kanske börjar livet bli lite enklare. Och kanske vet Nicke
  i sjuan till och med vad hon heter.
