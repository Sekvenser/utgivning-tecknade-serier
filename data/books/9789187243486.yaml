description: De tecknade serierna har en stolt tradition i Sverige. Alltsedan de yrvaket stack upp ur
  den litterära myllan i början av 1900-talet har de genomgått flera utvecklingsstadier. Jan Lööf, Joakim
  Pirinen, Cecilia Torudd, Mats Jonsson och Liv Strömquist har blivit en självklar del av vårt kulturarv.
  Ola Hellsten (f. 1972) är bibliotekarie och skriver en del. Sedan 2013 är han Konstnärlig ledare för
  Serieteket och Stockholms Internationella Seriefestival. Han gillar zerier.
