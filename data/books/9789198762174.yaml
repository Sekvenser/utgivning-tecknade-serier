description: Yona är det välmående riket Kōkas enda prinsessa. Som kejsarens enda barn växer hon upp älskad,
  skyddad och bortskämd. Då Yonas sextonde födelsedag närmar sig planerar hennes far ett storslaget firande.
  Men bland gästerna döljer sig oanade fiender, och plötsligt måste Yona fly för sitt liv! Vem står egentligen
  på hennes sida?
