description: Ingen är tuffare än Frida! Inget skrämmer henne, inte ens de banjo- och blockflöjtsspelande
  monstren som besöker henne om nätterna. Därför vänder sig monstren till Frida när deras land är fångat
  i en evig vinter och behöver räddas. Frode Øverli är hjärnan bakom dundersuccén Pondus och är en av
  Norges mest kända och lästa humorist. Frida är hans första barnbok som med behållning kan läsas av både
  barn och vuxna.
