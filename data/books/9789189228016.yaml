description: Det är vår och vikingarna ska segla till Miklagård. Men Siri får inte följa med! Hennes pappa
  hövdingen säger att hon är för liten. Och flicka! Trodde han att det skulle stoppa henne, så trodde
  han fel. Hon gömmer sig ombord. På skeppet finns också en mystisk låda som ska lämnas till självaste
  kejsaren. Men skurkarna Ivar och Grym är ute efter lådan och Siri får använda allt sitt mod och sin
  finurlighet för att skydda den. Som tur är får hon hjälp av Zack, en pojke hon träffar i Miklagård.
  Men vem är han egentligen?
