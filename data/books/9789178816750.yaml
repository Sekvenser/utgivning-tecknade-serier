description: Zick och gänget vill fånga ett monster. Det gör man genom en magisk ritual där man fångar
  in monstret i en burk. Något som bara en tämjare kan göra. Zick är ju en tämjare. Då måste det ju gå
  som smort. Eller?  Galna upptåg väntar i Konserverade monster som är den sjunde boken i Monster-Allergi.
  I serien får vi följa monstertämjaren Zick och hans vänner, och alla monster såklart. Galna och roliga
  äventyr utlovas i denna grafiska roman.     Hegas böcker – lätta att läsa. Svåra att motstå.
