description: Marta och Philly har en toppendag. De ska gå på 70-årskalas hos pensionärskompisen Gösta
  och håller på att fixa världens bästa present!    Mitt i allt fix dyker plötsligt sura tanten i port
  nummer 5 upp. Marta har varit rädd för henne så länge hon kan minnas.    Men saker och ting är inte
  alltid som de verkar och kanske finns det även något som kan göra sura tanten glad?I böckerna om Marta
  utforskar författaren Annika Jeppsson och illustratören Emma Ganslandt vardagens mystik och magi. Marta
  och det klappande hjärtat är en fristående del i bokserien om Marta.
