description: Hur skulle du reagera om du plötsligt en dag fick reda på att din mormor – som du nästan
  aldrig träffat – är vampyrjägare? Det är precis vad som händer Conny. När mamma måste jobba sent får
  han sova över hos mormor. Och att sova över hos mormor, det innebär inte direkt att dricka varm choklad
  och spela kort och sen gå och lägga sig i lugn och ro, det förstår Conny snart …Full fart framåt i den
  här första boken om Conny och hans knäppa marsvin Brutus! Lite läskigt, mycket roligt och framförallt
  underbara, knäppa bilder av serietecknaren Daniel Thollin. Stor läsglädje för nybörjaren som vill ha
  något både kul och spännande att sätta (de blodiga) tänderna i!
