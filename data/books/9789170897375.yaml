description: När 76-åriga Marjas lägenhet måste röksaneras flyttar hon motvilligt in på HBTQ-seniorboendet
  Plejaderna. I slutet av regnbågen är lika mycket en romantisk komedi som en serieroman om sorg, kärlek,
  goda grannar och att våga återvända till livet efter en depression. Det är också en specifik skildring
  av queert garderobsliv och vikten av att finna sitt sammanhang. Efterlängtad lyxig nyutgåva.
