description: 'Del 2 i serien som börjar med Tvättbjörnarnas stad. Efter att ha räddat Tvättbjörnarna från
  både illasinnade teknokrater och rivaliserande grupper har Klara blivit en självklar del av gänget.
  En mörk vinternatt smyger fem barn i tvättbjörnsdräkter genom nysnön. De har kommit till Clownernas
  kvarter för att stjäla deras flagga. Och Tvättbjörnarna har ett hemligt vapen: Klaras mystiska mask
  Panoptikon. Ålder 9-12 år.'
