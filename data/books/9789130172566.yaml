description: En morgon upptäcker Mina och hennes bror Jérôme enorma fotspår i snön. Varifrån kom de och
  vilket djur lämnar sådana spår? Jérôme tror att det är ett skämt, men Mina är övertygad om att en okänd
  varelse bor i skogen bakom hennes hus. En fängslande berättelse om naturens mysterier. En saga lika
  gripande som skogens tystnad, och lika viktig som det är att ta hand om platsen vi lever på. Ålder 6-9
  år.
