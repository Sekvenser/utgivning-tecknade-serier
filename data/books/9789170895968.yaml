description: En morgon kraschlandar ett flygande tefat i Muminmammans grönsaksland, och från ufot dinglar
  en konstig manick som Muminpappan tycker är precis den rätta tingesten för att laga familjens trasiga
  radio.  Men när Muminpappan börjar pilla på knapparna, så blir han plötsligt osynlig. Och Mumin och
  Snorkfröken också. Varje gång någon petar på manicken blir  kaoset i Mumindalen värre.
