description: I den här boken avslöjas hemligheter om farbror Joakims mer eller mindre okända släktingar.
  von Anka-borgen döljer nya, häpnadsväckande mysterier, och vi får en inblick i Joakim von Ankas farmors
  gåtfulla liv. Vem var Molly Vigg – och hur formade hon sin berömde sonson? Och vad hände egentligen
  den ödesdigra dagen då Havbard von Anka förliste med pepparrotskistan?   Boken innehåller tre fristående
  berättelser, var och en uppdelad i två episoder, som tar oss till olika tidsperioder i släkten von Ankas
  historia. Serierna hämtar inspiration från Barks, Rosa och Korhonens klassiska skildringar och bjuder
  på både humor, dramatik och oväntade avslöjanden.
