description: 'Talli söker svar om sitt ursprung: det försvunna folket Åkallerskorna. Hon är på flykt med
  riddaren Alan och deras nya vänner. Med sig har de jägaren Nina som de tagit gisslan efter att hon försökt
  fånga Talli på order av Lord Ulric. Gruppen blir attackerad av magiska vargar som hotar Talli med: “Skogens
  kung kommer ta er”. Vem är denna kung? En sak vet dem, deras resa kommer bara bli farligare.'
