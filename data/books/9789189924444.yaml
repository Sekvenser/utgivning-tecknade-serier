description: '”Jag tänkte på de sjukaste tjejerna i Lund och skämdes för att jag aldrig hade lyckats äta
  fullt så lite, bli fullt så skeletal.” Det börjar som ett sätt att lindra ångest, men spårar snart ur.
  För Siri kretsar nu tillvaron kring en enda sak: att kontrollera den egna kroppen. Hon fastnar i en
  ond cirkel av svält, behandling och återfall, och blir i allt högre grad en åskådare till sitt eget
  liv. "Hunger" är en närgången, autofiktiv berättelse om ett liv med anorexi, och ett försök att skildra
  en sjukdom som sällan beskrivs i sin fulla komplexitet.Siri LIdbeck (född 1991) är serietecknare och
  illustratör bosatt i Malmö. Hon är utbildad på Fatamorgana i Köpenhamn, Akademin Valand i Göteborg och
  Serieskolan i Malmö och har illustrerat för bland annat Galago, Lilla Piratförlaget och Sahlgrenska
  Universitetssjukhuset. "Hunger" är hennes debutbok.'
