description: En spinoff från den ordinarie Dylan Dog-serien, av Dylan Dogs skapare Tiziano Sclavi! För
  första gången ges Dylan Dog ut i inbundet format i Sverige, dessutom i färg!  “Stig på, Dylan. jag har
  väntat på dig.” “Men… känner du mig? Jag har aldrig varit här förut…” “Jag känner dig väl, och jag vet
  varför du gick in i min butik. För den här boken.” “Visst är det magnifikt? En samling berättelser som
  kommer att skrivas först i morgon.” “I morgon? Men… den verkar väldigt gammal…” “Det är den också. Sedan
  tidernas begynnelse har alla dagar haft en morgondag, även om vissa av dem aldrig inföll. Nå, ska du
  ha den?” “Jag… ja… jag antar det.” “Utmärkt. Du kommer inte att ångra dig, tro mig. Du köper framtiden.”
