description: Hans och Greta är zombier och blir utskickade av sina föräldrar för att hitta hjärnor att
  äta. Det blir lättare sagt än gjort. Långt in i skogen stöter de på ett hus gjort av kakor och andra
  godsaker. Blä. De vill ha hjärnor ju. Vad de inte vet är att i huset bor en häxa. Hur ska detta gå?  Serien
  Flippade sagor tar en klassisk saga och flippar den. Med fartfyllda illustrationer som påminner om animerade
  serier lockas läsaren till häftiga äventyr.    Hegas böcker – lätta att läsa. Svåra att motstå.
