description: Rasmus Nalle, Sälle och Pingo ger sig ut i skogen på trolljakt. För att inte tappa bort varandra
  binder de fast ett rep runt midjorna. Solen går sakta men säkert ner och snart är det helt mörkt. Knarr,
  bom, ssss. Bakom ett stort träd anar de ett troll. Sälle vågar sig dit... Hjälp! Vad var det? Snabbt
  kutar de hem igen, bara för att mötas av en ännu större överraskning.Carla Hansen (1906-2001) var en
  dansk författare. Tillsammans med sin man, illustratören Vilhelm Hansen (1900–1992) skapade hon den
  oerhört populära serien om Rasmus Nalle (på danska Rasmus Klump). Serien publicerades till en början
  i tidningar i Danmark, men blev snart tryckt i bokform och spridd till andra länder.Rasmus Nalle har,
  ända sedan den första utgåvan år 1951, varit en älskad figur hos både barn och vuxna med barnsliga sinnen.
  Rasmus Nalle älskar pannkakor, och tillsammans med sina vänner och far han världen runt på skeppet Mary.
  Det finns alltid ett nytt äventyr som väntar!
