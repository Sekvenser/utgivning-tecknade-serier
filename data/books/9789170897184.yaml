description: Ayas pappa vill att hans dotter snart ska gifta sig med en välbärgad karl. Men nittonåriga
  Aya drömmer om att bli läkare. Hennes två bästa väninnor Adjoua och Bintou däremot gillar att leva glatt
  tonårsliv i Elfenbenskustens största stad Abidjan. Deras liv kretsar kring mode och coola killar.  ”Aya”
  är en livfull afrikansk vardagskomedi i en värld som är på samma gång annorlunda och igenkännbar.
