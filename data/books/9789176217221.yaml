description: Ett kriminaldrama inleds när en furstinna rånas på sina juveler och en ung detektiv tar sig
  an fallet. Året är 1949 och platsen Paris. Atom Agency är en berättelse med fantastiska teckningar och
  högt tempo; de erfarna Yann och Schwartz levererar en enastående serie som för tankarna till klassiska
  franskbelgiska serier som Tintin och Spirou.
