description: Mio är stjärnan i fotbollslaget Attack. Men han känner att det är något som saknas. Han behöver
  ny energi. Så i smyg börjar han hänga i parken och spela boll med kidsen som brukar samlas där. I parken
  är det Lola som är bäst på plan. Mio tror att han ska kunna imponera på henne, men istället får han
  lära sig en hård läxa … och måste spela sitt livs tuffaste match.SportKlubben är serieromaner för alla
  i mellanåldern som gillar sport och spänning. Rapp dialog och coola illustrationer skapar de fartfyllda
  berättelserna som är lätta att följa, men aldrig blir långtråkiga. Varje historia inleds med en presentation
  av huvudkaraktärerna i text och bild. Sist i böckerna finns en ordlista som förklarar svåra ord. Serien
  är en perfekt ingång till läsning för den som vill ha historier med bra driv och högt tempo. Böcker
  att älska och att känna igen sig i – riktiga blandvändare.Lättlästa böcker från Nypon är ofta något
  kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.
