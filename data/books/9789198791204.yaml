description: "I boken Lär dig teckna (kawaii manga) chibi visar åtta mangatecknare från Nosebleed Studio\
  \ hur man tecknar chibi-figurer, på ett pedagogiskt och inkluderande sätt.\n\nDet grundläggande i att\
  \ teckna ansikte, kropp, hår, kläder och känslor finns på separata sidor, vilket gör boken lätt att\
  \ följa i klassrummet eller ger hobbyläsaren en stabil grund. Mellan genomgångarna visar olika tecknare\
  \ hur de ritar en hel chibi från början till slut, så att man kan skapa egna eller följa med i exemplen.\n\
  \n”Chibi” betyder ”mini” på japanska, och är en teckningsstil inom manga där man ritar söta figurer\
  \ med stora huvuden och små kroppar. Barn känner igen stilen från såväl gosedjur som appspel.\n\nKorta\
  \ meningar och lätt språk\n\r\nMånga steg – lätt att hänga med\n\r\nFlera svenska mangatecknare bidrar\
  \ med sina unika stilar – något för alla\n\nElise Rosberg har jobbat som lärare i mangateckning sedan\
  \ 2011 och har besökt över 200 skolor och bibliotek i Sverige för att hålla teckningskurser. Hennes\
  \ svenska Youtubekanal där hon lär ut hur man tecknar allt från djur till bilar till ansikten har över\
  \ 9 000 prenumeranter och hon har jobbat i fyra år som redaktör samt översättare på lättlästa barnboksförlag.\
  \ 2016 blev hon medlem i Nosebleed Studio.\n\nNosebleed Studio är ett svenskt serietecknarkollektiv\
  \ och förlag som producerar och publicerar manga på svenska. I denna bok hittar du chibi-figurer illustrerade\
  \ av medlemmarna Elise Rosberg, Felix Östergård, Viktor Engholm, Jay Callisto, Niki Hjort, Linn Olsson,\
  \ Sandra Andersson och Ray Johansson."
