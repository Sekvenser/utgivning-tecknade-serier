description: I början av 1930-talet flyttar en tysk fotograf till Mallorca med sin familj. När spanska
  inbördeskriget bryter ut flyttar mamman tillbaka till Tyskland med två av döttrarna. Där förföljs de  på
  grund av sin judiska härkomst. Först 1949 kan de återvända till den spanska ön. Tant Wussi, författarens
  gammelfaster, berättar om sitt liv i boken som är vackert illustrerad med akvarellmålningar.
