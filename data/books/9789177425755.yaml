description: 'Daniel Ahlgrens seriealbum Vår enda utväg är avstängd. Ett nytt seriealbum från Daniel Ahlgren
  är en första rangens kulturhändelse.  Vad ska komma denna gång?  Med sina tidiga album räknas Ahlgren
  som en av skaparna av den berömda svenska diskbänksrealismen som seriegenre - dit hör till exempel The
  girl who never fick nån post och Advent - serier med en genial känsla för små detaljer, ansiktsuttryck,
  kroppshållningar, gester och en makalöst skarp blick för vanligt vardagligt beteende.  Med albumet Ett
  liv utan superkrafter är väl inte värt att leva? bytte han inriktning och började berätta om svenska
  ungdomar som går superhjälteprogrammet på gymnasiet. Fortfarande gäller yppersta precision i detaljer,
  men i en annan ram: underhållningsindustrins fantasi om hjältar med superförmågor förverkligas här och
  nu, mitt ibland oss. Med både komisk och realistisk effekt.  Det nya albumet är en sorts kombination.  Nu
  har berättelserna djupnat ännu mer.  Det handlar om Hannah som rest norrut för att försöka lösa vissa...
  låt oss kalla det "personliga problem" som hotar att förstöra relationen med flickvännen Malin.  Under
  färden har hon hamnat i en idyllisk småstad där hon jobbar tillfälligt på ett litet kafé, mediterar
  och vandrar i skogen, men just som hon börjat finna det inre lugn hon söker uppenbarar sig en främmande
  himlakropp - en komet på kollisionskurs med jorden!  Nu gäller bara en sak: att så fort som möjligt
  ta sig hem till Malin, något som visar sig lättare sagt än gjort...  Tidigare volymer i superhjältesviten
  är Ett liv utan superkrafter är väl inte värt att leva?, Jag gråter bara i andra dimensioner, Operation
  A-barn, Passio och Där ute går världen under.'
