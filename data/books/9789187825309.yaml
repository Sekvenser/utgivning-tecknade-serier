description: The new volume of CBA features international comics dealing with the erosion of language.  How
  do we talk when words that used to mean certain things have become so vague that they can be freely
  appropriated by anyone, for any purpose? And what’s up with the currently so prevalent flirting with
  war, fascism and the dehumanization of anyone who doesn’t fit into the unspoken and conveniently unspecified
  national identity? Objective truth (if there ever was such a thing) and even language itself seems to
  be sacrificed on the altar of rhetoric and propaganda. What are the consequences when you can string
  any random, misspelled words together and people will make their own connections and decide to aggressively
  either agree or disagree, wholeheartedly even though the sentence actually makes no sense?
