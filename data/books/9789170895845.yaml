description: Hej! Det är jag som är Plum, och jag är en blandning av whippet, pudel och jack russell.
  Min tillvaro är full av roliga och spännande händelser, även om min matte Emma ofta är en glädjedödare
  som inte uppskattar alla fina saker jag gör. Vi bor i den fashionabla metropolen London, där jag försöker
  leva ett gott liv – simma i floden, slita itu mina leksaker och umgås med alla mina hundvänner.
