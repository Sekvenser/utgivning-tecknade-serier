description: KRIGET RASAR FÖR FULLT. CYBERTRON är numera ödelagd på grund av THUNDERWING och MEGATRON
  har skickat ut infiltrationsenheter till andra planeter för att förbereda dem för CYBERFORMING. Men
  vad har SHOCKWAVE egentligen för planer för JORDEN — och kan DYNOBOTERNA stoppa honom? Varför försöker
  BLUDGEON att återuppliva Thunderwing? Vad sysslar SCORPONOK med på planeten NEBULOS? Och vad är det
  för mysterium som NIGHTBEAT har upptäckt? Svaret på alla dessa frågor får du i den här boken — den första
  i berättelsen om INBÖRDESKRIGET mellan AUTOBOTER och DECEPTICONS.
