description: 'Stilla vatten är en gotisk och erotisk berättelse som utspelar sig kring vatten och en kult
  med destruktiva undertoner. Niko, som dras med sömnsvårigheter och en dålig mammarelation, är sedan
  ett år ihop med galleristen Mira. Runt Niko hopar sig de kusliga elementen: samtidigt som Mira är underbar
  är Niko rädd för henne, och Mira visar sig ha närmare kopplingar till den karismatiska kultledaren Tarja
  än man trott.  En gammal konstsamlare närmar sig Niko, fascinerad av hens androgynitet. I konstsamlarens
  rikemanssläkt ruvar därtill en mörk hemlighet som mynnar ur en våldsam händelse vid vatten. Edith Hammars
  originella och atmosfäriska verk undersöker frågor kring konservatism, skam och sexualpolitik.'
