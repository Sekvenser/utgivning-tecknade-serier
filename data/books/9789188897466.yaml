description: För fem år sedan gjorde tecknaren Matthieu Bonhomme stor succé med seriealbumet Mannen som
  sköt Lucky Luke, hans hyllning till cowboyen som drar snabbare än sin egen skugga. I denna fristående
  uppföljare finner vi Lucky Luke oskyldigt efterlyst för mord. Trots det tackar han ja till att eskortera
  tre unga kvinnor och deras boskap genom laglöst land, där både indianer och banditer väntar på dem.
