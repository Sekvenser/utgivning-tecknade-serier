description: Om man riktigt gärna vill bli något, då blir man det också - så sade en av Sveriges största
  författare någonsin, Selma Lagerlöf. Som liten var hon ofta sjuk och kände sig ensam, men hon var med
  om några märkliga händelser... Följ henne från uppväxten på en gård i Värmland till författare som lästes
  och blev älskad av en hel värld.
