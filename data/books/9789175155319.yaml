description: 'En tecknad serie fylld av humor och makalösa sammandrabbningar, baserad på de populära onlinespelen
  Clash of Clans och Clash Royale!


  Bågskyttarna och bästa vännerna Jane och Angie delar allt i vått och torrt. Tills den dag då Jane mitt
  under en strid plötsligt befinner sig helt ensam i en märklig grotta, där hon snubblar över en mystisk
  bokrulle. Det ska snart visa sig att den magiska bokrullen kan förändra hennes roll på den kungliga
  arenan för all framtid.


  Författaren Gene Luen Yang har bland annat skrivit manus till de första böckerna i den tecknade serien
  Avatar och har här skapat berättelser för läsare som älskar spel och fantasy. Clash of Clans och Clash
  Royale produceras av finska Supercell och har miljontals spelare världen över.'
