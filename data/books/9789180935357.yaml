description: Galna mober Blir mober kära? Kanske men det går så klart galet. Precis som med allt annat
  Minecraft-moberna tar sig för. Här finns mycket som Minecraft-älskarna känner igen. Knasigheter om allt
  ifrån endermäns rädsla för vatten och creepers förmåga att sprängas i tid och otid. Och zombier som
  kanske ändå längtar efter att få vara ute i solen? Kort och knasigt i Minecraft för nybörjarläsaren.
  I korta serie-strippar på en sida var får vi hänga med de mest älskade – och hatade – karaktärerna från
  spelet Minecraft. Det korta formatet avlastar arbetsminnet och ger den ovana läsaren välbehövda pauser.
  En enkel tröskelbok för den som har svårt att komma igång med läsning men lockas av serietidningar och
  Minecraft. Hegas lättlästa böcker väcker läslusten hos barn och unga.
