description: Extrem lägerskola är en vacker, humoristisk och poetisk historia om undergång, överlevnad
  och gemenskap. I Eva Björkstrands minimalistiska seriedrama gräver ett antal individer ner sig under
  jord. Övertygade om att jorden är i upplösning samlas de för att i väntan på döden skapa sig ett liv
  i grottsystemen, tills allting tar en ny riktning och de måste börja gräva igen. Uppåt? Utåt?
