description: I den här boken får den självgoda Pisse-Misse och hans miss-anpassade kompisar inte bara
  ta itu med barnet Sivert, utan även Siverts jobbiga kusin, lilla Marie. När lilla Marie hälsar på förstår
  alla snabbt att man kan pina katter på flera olika sätt. Nu är det inte bara Sivert som är ett problem,
  Marie måste också stoppas till varje pris. Boken ingår i en serie av flera Pisse-Misse böcker.
