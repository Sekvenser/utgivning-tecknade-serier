description: 'I Mina bokmärken får ett älskat format ny form och mening. För Johanna Gustafsson-Ahlzéns
  bokmärken liknar inget annat du tidigare sett. Här möter du vita brevduvor med inkassobrev, storkar
  som älskar människokött och änglar som trakasserar varandra sexuellt. Inget är tabu och inga ämnen för
  stora eller små: rasism, jämställdhet, trakasserier eller underbart förbjudna tankar får liv.'
