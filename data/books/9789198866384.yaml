description: "Kapten Grogg var en banbrytande svit tecknade svenska kortfilmer från 1910- och 1920-talen, vilka sedan omvandlades till serier som publicerades i skämttidningen Kasper 1919–21, i dagstidningen Dagens Nyheter 1922 samt i seriealbumet Kapten Grogg och Kalle 1923. Kortfilmerna och serieversionen av Kapten Grogg skapades av Victor Bergdahl (1878–1939), pionjär inom tecknad film i Sverige. Kapten Grogg själv var ett barn av sin tid, en man som gärna flydde sin familj för att bege sig till exotiska söderhavsöar, och som var mer än lite benägen att ta till flaskan. Detta är en komplett samling av serierna med Kapten Grogg, inklusive serieversioner av filmerna samt de licensproducerade serier som publicerades i Musse Pigg-tidningen 1937–1938. Boken innehåller dessutom ett faktaspäckat förord som sätter filmerna och serierna i en historisk kontext."
