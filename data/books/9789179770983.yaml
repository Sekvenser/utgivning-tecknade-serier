description: Det dyker ständigt upp nya superskurkar och det hänger på HUNDMANNEN (50% människa, 50% polishund)
  om de ska åka fast! Och nu är han inte längre ensam – vid sin sida har han SUPERKISSEN (världens gulligaste
  kattunge) och en alldeles fantastisk robot. Men det räcker inte den här gången! Hundmannen måste samarbeta
  med Percy, också känd som Världens Mest Elaka Katt. Kommer Percy klara att gå från den onda sidan till
  den goda? Loppornas herre är den femte boken om Hundmannen.
