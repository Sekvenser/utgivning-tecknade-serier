description: Året är 1957 och rymdkapplöpningen mellan USA och Sovjetunionen har just startat. På kosmodromen
  Bajkonur hetsar militären fram en uppskjutning trots att raketen riskerar att träffas av en meteoritsvärm,
  något som också sker. På vrakresterna efter raketen påträffas ett dödligt virus från rymden som basens
  KGB-chef, doktor Voronov, lägger beslag på, trots order om att det ska förstöras omedelbart.
