description: 2011 flyttade den svenska seretecknaren och illustratörer Åsa Ekström till Japan  för att
  försöka etablera sig som serieskapare i mangans hemland. Genombrottet via en webbdagbok i serieform
  som snabbt blev oerhört populär. I korta, roliga och insiktsfulla serier skildrar Åsa många av Japans
  underbara, annorlunda och ibland svårbegripliga sidor ur en inflyttad västerlännings perspektiv.
