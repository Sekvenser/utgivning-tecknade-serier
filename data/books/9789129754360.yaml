description: Conny håller på att vänja sig vid sitt nya vampyrliv. Han och kompisen Doris går i vampyrjägarskola
  hos mormor (så att de ska kunna fånga andra, onda vampyrer), mobbaren Bullen har slutat retas och till
  och med det blodtörstiga marsvinet Brutus håller sig på mattan. Livet är helt enkelt rätt bra just nu.
  Men då dyker det upp en ny lärare i skolan och han verkar lite för intresserad av Connys odöda tillstånd
  …Full fart framåt i den här tredje boken om Conny och hans knäppa marsvin Brutus! Lite läskigt, mycket
  roligt och framförallt underbara, knäppa bilder av serietecknaren Daniel Thollin. Stor läsglädje för
  nybörjaren som vill ha något både kul och spännande att sätta (de blodiga) tänderna i!
