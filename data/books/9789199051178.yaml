description: En ung man lämnar sin fru och sitt trygga liv för att söka äventyret till havs. Det som börjar
  som en romantisk dröm utvecklas snart till något betydligt mörkare. Stackars sjöman är den amerikanske
  serieskaparen Sammy Harkhams moderna klassiker – en kort, skoningslös och märkligt vacker berättelse
  om längtan, flykt och priset för våra drömmar. Med ett avskalat bildspråk och en berättarteknik där
  varje ruta räknas skapar Harkham på få sidor en historia med samma tyngd som en hel roman. Nu kommer
  Poor Sailor i separat bokform på svenska med ett belysande förord av Robert Aman – en liten bok som
  stannar kvar långt efter sista sidan.
