description: 'Latest issue of the international comics anthology series:   Step into the world of KOLAŻ,
  where images are discovered, altered, and transformed — merged with sketches, digital twists, and layered
  reconfigurations. It’s a creative process of cutting, rearranging, and reimagining, where fragments
  are pulled apart and pieced back together. Story themselves are patchworks of moments stitched into
  something new, where unexpected contrasts may emerge and magic happens when each reader brings their
  own meanings, their own interpretations, their own fragments to the pasteboard.  Comics by: Pavol Bratský,
  Mattias Elftorp, Tom Mortimer, Damir Stojnić von Ktonsky, Susanne Johansson, Markus Samnell, Julia Nascimento,
  Adam Boman, Mette Norrie, Helena Menanda, Aiden Kvarnström, Mileta Mijatović, Mårten Edman, Miku Maria
  Gustavsson. Cover & main editor: Kinga Dukaj.'
