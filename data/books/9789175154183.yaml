description: Tavutatet, egyptisk prinsessa och mumie, är instängd i en sarkofag på ett dammigt museum.
  Hennes största dröm är att resa och upptäcka världen tillsammans med sin vän, uttern Kepabet, men det
  är något som hennes mor Hatshepsut alltid sagt nej till. När en grupp som vill utplåna övernaturliga
  varelser är ute efter henne ger hon sig av för att hitta andra »unika« figurer som kan ge henne skydd.
