description: 'Pojken Sparvhök växer upp på ön Gont, som är känd för sina skickliga trollkarlar. Redan
  som elev på trollkarlsskolan får han rykte om sig att ha exceptionella krafter, och i hemlighet börjar
  han utforska olika besvärjelser som egentligen överstiger hans förmågor. I sitt högmod släpper han under
  en duell lös en mäktig skuggvarelse, vilket nästan kostar honom livet. Under många år vandrar sedan
  varelsen i hans fotspår, innan Sparvhök slutligen hittar modet att konfrontera ondskan.


  Ursula K. Le Guins berättelser om Övärlden fick snabbt klassikerstatus och hör till de mest läsa fantasyböckerna
  genom tiderna. Tecknaren Fred Fordhams omsorgsfullt utformade serieadaption ges nu ut på svenska i översättning
  av Carina Jansson.'
