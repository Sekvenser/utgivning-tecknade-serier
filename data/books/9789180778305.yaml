description: Oflelia och Björn kan äntligen ta det lite lugnt efter alla äventyr. Men när Ofelia förlorar
  det käraste hon äger måste de ge sig ut på en ny resa till Fingals ö. Faror lurar både över och under
  ytan. Och Ofelia upptäcker ett hus som verkar väldigt, väldigt bekant, och där hittar hon en gammal
  film. När filmen spelas upp är det som att hennes pappa finns i rummet. Men Krypto gillar inte det som
  kommer fram på filmen och Ofelia och Björn tvingas fly. Med Krypto-böckerna når Hans Jørgen Sandnes
  ut brett till en ny generation serieälskare. Sagt om tidigare böcker i serien:Serien om Krypto har snabbt
  hittat sina läsare och det är inte svårt att förstå. Det är bra driv i berättelsen som har ett tydligt
  budskap och låter huvudpersonerna kämpa för det goda. Illustrationerna ligger nära animerade bilder
  och håller en blågrön färgskala som associerar till havet. Textade versaler i pratbubblor, i kombination
  med textlösa bildrutor, för handlingen snabbt framåt och gör texten lättillgänglig. Christina Wedenmark,
  BTJ Käftarna i djupet är liksom tidigare delar i serien mycket bra. Den är vältecknad, med klara uttrycksfulla
  bilder i fina matta färger, och har välskriven dialog och handling. Texten är skriven med enbart versaler,
  vilket underlättar läsningen för lässvaga barn. Per Berg, BTJ Lättlästa böcker från Nypon är ofta något
  kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder. Nypons
  böcker är indelade i sex nivåer. Serien Krypto ligger på nivå 3 av 6.
