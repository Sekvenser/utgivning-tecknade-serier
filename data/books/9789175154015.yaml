description: 2011 flyttade den svenska serietecknaren och illustratören Åsa Ekström till Japan för att
  försöka etablera sig som serieskapare i mangans hemland. Efter flera års slit kom genombrottet via en
  webbdagbok i serieform som snabbt blev oerhört populär. I korta, roliga och insiktsfulla serier skildrar
  Åsa många av Japans underbara, annorlunda och ibland svårbegripliga sidor, som de kan upplevas ur en
  inflyttad västerlännings perspektiv. Detta är en första samling av dagboksserierna i ett urval anpassat
  för en svensk publik. En bok för alla som är nyfikna på Japan och japansk kultur, presenterad i mangaform
  och med bibehållen japansk läsriktning.
