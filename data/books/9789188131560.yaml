description: Den spanske serieskaparen Joan Boix har en omväxlande och imponerande lång karriär. I denna
  antologi samlas ett brett urval av hans serier från 1970- och 1980-talet. Skräck, satir, humor och science
  fiction, varav en del tidigare har publicerats på svenska i serietidningarna Fantomen, Agent X9, Magnum
  Comics, Serie-Nytt och Seriemix.  Sedan 1990-talet är Joan Boix en hörnsten i den svenska produktionen
  av serien Fantomen, och han var även en av de flitigaste tecknarna i den svenska produktionen av serierna
  Kerry Drake och Lefty Drake.  Dessutom har hans egna serier gjort avtryck i Sverige. Väktaren publicerades
  i Fantomen, och Robny publicerades i Seriemagasinet och har samlats i ett album.
