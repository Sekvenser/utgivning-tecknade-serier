description: I Magda Lundbergs Fåglar finns en självklar humor som balanserar mellan ömhet för det vardagliga
  och total galenskap. Fåglarna tar upp alla konstiga och allmängiltiga tankar som finns i relationer
  och i det mänskliga moderna varat. Som måste finnas för att vi ska stå ut. Hela verket genomsyras av
  Magdas unika språk, konst och lekfulla berättarglädje. Nu som mjukband/storpocket!
