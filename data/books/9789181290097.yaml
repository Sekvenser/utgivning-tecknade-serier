description: 'Farbror Joakim debuterade redan 1947 i Carl Barks serie Jul på Björnberget och etablerade
  sig gradvis som en av Disneys mest populära figurer. Men var det verkligen Barks plan? Förstod han redan
  1947 att han hade skapat sin egen gåsäggsklimp – precis som Joakim själv fann sin under guldruschen
  i Klondike? I dag är Ankeborg lika beroende av farbror Joakim som av Kalle Anka, och i den här boken
  utforskar vi hur det kommer sig.


  Vi följer den skotske snåljåpens utveckling genom berättelser av serieskapare som Carl Barks, Don Rosa,
  Romano Scarpa, Jan Gulbransson, Kari Korhonen, Sander Gulien, Daan Jippes och Giorgio Cavazzano – samt
  tar del av en guldgruva av artiklar och annat redaktionellt material från internationella Disneyexperter,
  redaktörer och tecknare.'
