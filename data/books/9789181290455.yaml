description: 'Farbror Joakims väg till att bli världens rikaste anka var allt annat än rak – den är full
  av äventyr värda att berättas. Ankmästaren Kari Korhonen antar utmaningen och avslöjar nya, fascinerande
  sidospår längs resan.


  Den utfattige men beslutsamme pojken från Glasgow i Skottland sökte sin lycka på varje kontinent. Han
  vandrade genom Afrikas regnskogar och över Andernas sluttningar, jagade kapare på Kinesiska havet och
  mötte till och med Japans kejsare. Vid sidan av äventyren hann han också stifta bekantskap med universitetslivet
  och konstkretsarna i Paris, utge sig för att vara tysk adelsman – och kanske till och med upptäcka Sydpolen.
  Korhonens glädjefyllda och uppfinningsrika serier berättar historien om farbror Joakims vilda ungdom,
  i samma anda som Carl Barks och Don Rosa. Samlingen rymmer tio äventyr ur Krönikor-sviten.'
