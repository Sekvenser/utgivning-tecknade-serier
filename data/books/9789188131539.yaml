description: KRIGET ÄR SLUT.  RODIMUS, DRIFT, ULTRA MAGNUS, SKIDS, RATCHET och 200 andra Autoboter (och
  CYCLONUS – som inte är en Decepticon) har lämnat Cybertron i rymdskeppet Den förlorade lyktan för att
  söka efter de mytomspunna RIDDARNA AV CYBERTRON. Nyligen upptäckte RED ALERT en cell i botten av rymdskeppet
  som innehöll en livs levande OVERLORD. Hur hamnade han där? Vad kommer att hända om (eller rättare sagt
  när) han bryter sig ut? Hur många kommer att dö? Hur kommer det att gå för CHROMEDOME och REWIND? Kommer
  FORTRESS MAXIMUS att få sin hämnd för vad Overlord utsatte honom för på Garrus-9? Vad var det egentliga
  syftet med Aequitasprojektet? Vart tog PHARMA vägen efter händelserna på Delphi? Varför letade LOCKDOWN
  efter titaner? Vart tog LJUSCIRKELSORDEN vägen? Svaren på dessa frågor (och många fler) får du i den
  här boken – den tredje i berättelsen om besättningen ombord på rymdskeppet DEN FÖRLORADE LYKTAN.
