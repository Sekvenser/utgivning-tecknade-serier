description: 'Latest issue of the international comics anthology series asks the questions: What’s in
  THE BOX? Who wants to know? How big is it? Where is it? Is it on its way somewhere? Why does it matter?
  Why can’t you know what’s in it? Or do you know? This issue is a box filled with stories. But what is
  THE BOX if you think outside the box? Comics by: Mattias Elftorp, Miguel Santos, Susanne Johansson,
  Sara Alma Safije Sheikhi, Manuel Rodriguez Navarro, Josef Noren. Text & illustration by: Eileen Laurie.
  Cover & main editor: Mattias Elftorp.'
