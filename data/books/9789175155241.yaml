description: 'När Glory och hennes vänner söker skydd i regnskogen får hon veta att flera drakar har försvunnit
  spårlöst från regnvingarnas rike. Märkligt nog verkar ingen vara särskild intresserad av hur det har
  gått till. Kan det verkligen stämma att regnvingarna är lika lata och ointresserade som alla säger?
  Glory bestämmer sig för att ta reda på vad som har hänt, även om det riskerar att dra in den fredligaste
  drakstammen i det pågående kriget.


  Tui T. Sutherlands populära böcker om vännerna från Pyrrhias fem drakstammar har nu blivit en tecknad
  serie illustrerad av Mike Holmes. Det här är den tredje boken i serien.'
