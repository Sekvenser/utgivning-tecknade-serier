description: Jonas är förälskad i världens coolaste tjej. Så han behöver pengar! Och det är brådskande!
  Alltså tar han vilket jobb som helst … och hamnar som städare i helvetet. En hetlevrad chef, kollegor
  som är dummare än dumma, en talande askhög som hela tiden pladdrar om kärleksfrågor och två djävlar
  som kidnappar världens häftigaste tjej. Jonas helvetesjobb blir ett mardrömsjobb!
