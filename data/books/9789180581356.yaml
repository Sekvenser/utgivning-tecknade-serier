description: 'I denna fristående uppföljare till Framtidens arab har Riad Sattouf återvänt till sin familjs
  historia, men nu skildras det ofta traumatiska händelseförloppet ur hans lillebror Fadis perspektiv.
  I den första delen berättar Fadi om den lyckliga barndomen i Bretagne med mamman och bröderna Riad och
  Yahya, fram till att han som sexåring kidnappades av fadern Abdel-Razak som tog honom med sig till Ter
  Maaleh i Syrien.


  Riad Sattoufs seriememoar Framtidens arab som beskrev hans uppväxt med en fransk mamma och en syrisk
  far, och deras liv i Libyen, Syrien och Bretagne, gavs ut i sex delar åren 2014–2022. Bokserien fick
  stor uppmärksamhet och blev en bestseller som har översatts till över 20 språk.'
