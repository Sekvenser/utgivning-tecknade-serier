description: Vintern kommer och skogsfolket lägger in förråd för vintern, klär sig i varma vinterkläder
  och värmer sitt inre med ångande ostfonduer. Men vargen har fått något mordisk i blicken igen och åter
  försvinner små värnlösa djur.  Panikslagna gör skogsfolket allt de kan för att blidka det farliga rovdjuret.  En
  intelligent och charmerande fabel om skillnaden mellan ” de som har” och ”de som intet har”
