description: Ny utgåva! Den franska adelsflickan Isa är i hemlighet passagerare ombord på en fransk fregatt
  i Karibiska havet, när hon räddar den unge matrosen Hoels liv och inleder ett förhållande med honom.
  Efter flera dramatiska händelser och en sejour i England och Frankrike fortsätter Isa och hennes färdkamrater
  Hoel och Mary sin resa ombord på slavskeppet -Marie-Caroline-.
