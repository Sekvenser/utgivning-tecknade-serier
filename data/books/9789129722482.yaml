description: Mamma Mu och Kråkan ska starta zoo i hagen hos bonden, men de har inte bestämt vilket sorts
  zoo det ska bli än. Ett kråk-zoo kanske?  Här samlas tre serienoveller med Mamma Mu och Kråkans oemotståndliga
  humor och uppfinningsrikedom.  Bakom den tecknade serien står också Micaela Favilla och Elin Fahlstedt,
  som tillsammans skapar serier utifrån Sven Nordqvists illustrationer av Mamma Mu. Serieberättelserna
  i deh här boken utkom för första gången i 2015 i boken Mamma Mu firar Kråkan.
