description: Mortimer har rest till Kairo för att träffa sin gamle vän professor Bey, intendent vid museet
  för egyptiska antikviteter. Bey har bett Mortimer delta vid dechiffreringen av hans senaste fynd, en
  papyrus från ptolemeernas tid. I textfragmentet berättas om Horus kammare, en krypta dold inne i pyramiden,
  som sägs innehålla otaliga skatter.
