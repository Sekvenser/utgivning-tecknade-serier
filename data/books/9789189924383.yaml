description: Ett av Nina Hemmingssons mest fascinerande projekt, En Hemmingsson om dagen, pågår just nu
  på Instagram och sträcker sig över 365 dagar. Här delar Nina dagligen en ny, unik teckning – utan att
  ge sig själv möjlighet att redigera eller censurera sig. Det gör att varje bild blir ett ­omedelbart,
  autentiskt uttryck för hennes känslor och tankar, vilket ger ett resultat som inte hade kunnat upprepas
  om hon hade haft tid att tänka om eller justera sina intryck. Det är just denna ofiltrerade och spontana
  skapandeprocess som gör projektet så kraftfullt och genuint. För Nina är tecknandet inte bara ett yrke
  eller en passion, utan också en terapeutisk handling – en möjlighet att få ut sitt undermedvetna på
  papper för att sedan kunna släppa taget om det. Hennes projekt är dock inte bara en personlig process.
  För många av hennes följare fungerar hennes bilder som en tröst i tider av ensamhet, sorg och ångest.
  Hennes konst ger en känsla av gemenskap och förståelse i stunder när livet känns tungt.
