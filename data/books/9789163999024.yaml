description: Det skulle ju vara en kroppsdel bara I Tilda Bergstens andra seriealbum Fången i Fittan får
  vi möta en hel hoper människor som på olika vis försöker leva med de begränsningar och krav som följer
  med en könsroll. Här träffar vi Ulrika, mamma till inte bara två barn utan även en äkta make, Robban
  som är en riktigt snäll kille men som kanske har felestimerat sin egen snällhet, och Mira som bara vill
  ha ett jävla preventivmedel men som tvingas inse att precis allt har oönskade biverkningar. Hur påverkas
  DU av den könsroll du fostrats in i? Är det de små sakerna som skaver eller är det de stora? Eller är
  det hela alltet?
