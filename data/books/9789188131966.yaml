description: Hobgoblin är tillbaka! Under många år var Hobgoblin (på svenska tidigare känd som Djävulstrollet
  och Gula Trollet) en av Spider-Mans värsta fiender. Hans identitet var länge höljd i dunkel, men sedan
  avslöjades det att han egentligen var Ned Leeds. Ned blev mördad och Jason Macendale tog hans plats
  som Hobgoblin. Men tänk om avslöjandet av Ned som Hobgoblin bara var en utstuderad bluff – en bluff
  iscensatt av den riktige Hobgoblin?
