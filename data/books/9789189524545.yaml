description: I den här boken ger en serietecknare och två forskare en lättläst introduktion till klimatet
  och omställningen, utan att väja för de svåraste frågorna.  Hur hamnade vi här? Vem bär ansvaret? Vad
  kan vi egentligen göra som individer och samhällsmedborgare? Hur ser vägen ut ur fossilberoende ut?
  Läs och bli en del av lösningen - innan det är för sent.
