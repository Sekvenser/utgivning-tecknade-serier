description: Känslan av att ha missat något är en berättelse om hur det är att som flicka leva med ett
  annorlunda sätt att fungera och vikten av att omgivningen förstår flickors autism och adhd för att minska
  risken för psykisk ohälsa. I boken varvas ett inifrånperspektiv med kunskap om neuropsykiatriska funktionsnedsättningar
  och neurodiversitet.
