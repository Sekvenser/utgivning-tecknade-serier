description: 'En familj som återförenas för att fira jul brukar vara en hjärtevärmande tillställning.
  Men gamle Simeon Lee är inte av den sentimentala sorten, och har han samlat sina barn omkring sig är
  det för att han har bistra besked att framföra. Är det kanske därför som familjens överhuvud på julaftonskvällen
  hittas död med halsen avskuren?


  När Hercule Poirot, som besöker en vän i närheten över julhelgen, erbjuder sig att hjälpa till med fallet,
  möter han en atmosfär som präglas av ömsesidig misstänksamhet. Snart ska det visa sig att samtliga närvarande
  verkar ha haft goda skäl att hata den döde.


  Agatha Christie (1890–1976) är känd som detektivromanernas drottning. Flera av Christies deckare har
  på senare år getts ut som seriealbum i Frankrike. Cobolts utgivning inleds med detta julmysterium från
  1938, som brukar räknas som en av Agatha Christies bästa romaner.'
