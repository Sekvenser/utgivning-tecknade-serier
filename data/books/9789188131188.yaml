description: Umgås du med planer på att fjällvandra i sommar? Då är detta boken som måste följa med i
  packningen! Här presenteras flertalet av de troll och oknytt som du kan stöta på i fjällen. Dessa växter,
  djur och varelser förekommer inte i den vanliga litteraturen om fjällens flora och fauna. Dina chanser
  att klara din fjälltur med hälsan i behåll ökar dessutom kraftigt om du tagit del av innehållet i denna
  skrift. Här ges inga rekommendationer om att inte glömma understället, nej här får du till exempel tips
  om hur du undflyr dödens käftar när du stirrar den trehövdade farsoten från Låkkta i vitögonen. Glöm
  inte heller den folkbildande aspekten. Tänk bara att kunna läsa på om Gormtrollens och Parabolgnomernas
  egenheter, för att sedan, under din fjällresa, stöta på dom i deras naturliga habitat. Lycka till på
  fjällvandringen! Och se upp med Tarmvredsmurklan….
