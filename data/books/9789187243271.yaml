description: 'På ett Spa- och konferenshotell någonstans i norra Europa har en gäst gått vilse. Ett gift
  par söker en tillflykt från sin hemsökta vardag, en massör känner sig ensam och en mystisk fuktskada
  sprider sig i korridorerna. SPA är Erik Svetofts femte bok, den första med text! Tidigare böcker är:
  Domus (2019), Mondo (2017), Hakken (2016) och Limbo (2014).'
