description: Don Rosa är idag världens mest berömda Kalle Anka-tecknare, älskad av stora som små. Don
  Rosa-biblioteket samlar nu alla hans Kalle Anka-serier i tio lyxiga böcker att läsa, vårda och förföras
  av, om och om igen. Don har själv gått över all färgläggning av serierna för denna utgåva och varit
  ytterst delaktig när materialet sammanställts.
