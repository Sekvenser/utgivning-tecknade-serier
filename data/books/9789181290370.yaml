description: Alice, som älskar att rita, börjar äntligen på en ny konstskola. Där blir hon snabbt vän
  med Azalea, en fantasifull tjej som misstänker att något inte står rätt till. De börjar undersöka saken
  – särskilt biblioteket, där bibliotekarien verkar som en zombie och assistenten Tio nästan som en vampyr.
  Allt förändras när de upptäcker skolans hemliga underjordiska gångar och ett rum för märkliga ritualer.
  Kan skolan styras av vampyrer? Och vad vill de egentligen?
