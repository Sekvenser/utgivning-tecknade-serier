description: 'Leonardo DiCaprio har dejtat femtioelva svinsnygga modeller men blir aldrig kär i någon.
  Varför? Beror det på konsumtionssamhället? Narcissism? Biologi? Eller har han bara inte träffat den
  rätta? Och: börjar vi alla mer och mer bli som Leo?


  Liv Strömquist undersöker hur det går för kärleken i senkapitalismens tid. Med hjälp av Beyoncé, Sören
  Kierkegaard, smurfarna, sociologisk teori, missnöjda dokusåpadeltagare, Platon och många fler söker
  hon svar på frågan om varför vi känner så lite. Kan vi styra förälskelse? Och vad är det egentligen
  som händer när kärlek tar slut?


  Den rödaste rosen slår ut utkom första gången 2019, men Liv Strömquists skildring av våra problem med
  att hitta kärleken har aldrig varit mer aktuell. Denna utgåva innehåller ett nyskrivet kapitel om vår
  hierarkiska och prestationsfixerade samtid, och om hur manosfärens framväxt gör det ännu svårare för
  oss att älska varandra.'
