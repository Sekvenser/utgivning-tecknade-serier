description: Visst är havet en vacker och fantastisk plats? Det tycker Rasmus Nalle också. Han bestämmer
  sig för att utforska det stora, vida havet med hjälp av Pelle och Pingo. Tillsammans börjar de bygga
  ett skepp. Men snart visar det sig vara ett större uppdrag än vad de tidigare trott. Och på sin väg
  träffar de på en massa spännande nya vänner! Carla Hansen (1906-2001) var en dansk författare. Tillsammans
  med sin man, illustratören Vilhelm Hansen (1900–1992) skapade hon den oerhört populära serien om Rasmus
  Nalle (på danska Rasmus Klump). Serien startade i tidningar i Danmark, men blev snart tryckt i bokform
  och spridd till andra länder.Efter att Rasmus Nalle hittat en gammal fartygsratt på en soptipp får han
  hjälp av sina vänner att bygga ett skepp. På skeppet, som de döper till Mary, reser de sedan runt i
  världen och upptäcker nya fantastiska platser.
