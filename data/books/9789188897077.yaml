description: '"Med Frankenstein, Den osynlige mannen, Ringaren av Notre Dame och Dr Jekyll och Mr Hyde.
  Få serietidningar har varit lika lästa och älskade som Illustrerade Klassiker. Amerikanen Al Kanters
  snilleblixt att göra serieversioner av »Berömda berättares bästa böcker« blev en framgångssaga, och
  affärsidén spreds över världen. 1956 kom Illustrerade Klassiker till Sverige och blev en succé från
  första numret. Utgivningen skedde i högt tempo: två nya tidningar gavs ut varje månad, vilka sedan trycktes
  om i takt med att upplagorna sålde slut. Totalt kom det ut 228 Illustrerade Klassiker på svenska. I
  den här återutgivningen har vi samlat en del av de bästa Klassikerna i böcker med olika teman. Nu har
  turen kommit till fyra stycken sällsamma berättelser vilka aldrig har upphört att fascinera, skrivna
  av några av alla tiders mest lästa författare. Trogen Illustrerade Klassikers pedagogiska ambitioner
  så ingår också ett läsvärt extramaterial i varje bok. I föreliggande volym ingår texter om Klassikernas
  svenska utgivningshistoria och presentationer av tecknarna, författarna och de litterära verken."--förlagstext'
