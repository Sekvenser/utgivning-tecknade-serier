description: Tommy och hans föräldrar ska köpa ett nytt hus. Det verkar perfekt, det ligger nära skolan
  och Tommys kompisar, men när de väl är där känner Tommy direkt att något är fel. Väldigt fel… Home sweet
  haunting är en labyrintartad rysare i högt tempo. Kommer Tommy att hitta en väg ut, eller blir han husets
  fånge för alltid? Under samlingsnamnet Rysliga serier presenterar vi serieromaner där läskighetsnivån
  uppskruvad för att passa dem som lockas av att få känna kalla kårar och spänning när de läser. Med bilder
  som speglar handlingen blir det lätt att hänga med och få nycklar och verktyg för att bemästra förståelsen
  av ord och bild.
