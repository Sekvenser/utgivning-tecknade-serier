description: Grace försöker vänja sig vid sitt nya liv i Hongkong. Men så dyker draken Nate upp och tar
  med henne till Drakkungens lya. Där får de veta att den mäktige Daijang och hans onda Skuggor letar
  efter en urgammal relik. Denna skulle ge dem kraften att kontrollera alla drakar. Grace och hennes vänner
  måste hitta reliken först! Och den finns i Paris, så vännerna försöker ta sig dit så snabbt som möjligt.
  Men det blir inte lätt, för Skuggorna gör allt för att stoppa dem på vägen. Skuggorna anfaller är den
  andra delen i prisbelönta Jaimal Yogis medryckande mangaserie Drakarnas stad. Lättlästa böcker från
  Nypon är ofta något kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens
  ålder. Nypons böcker är indelade i sex nivåer. Böckerna i serien Drakarnas stad ligger på nivå 6 av
  6.
