description: Kommer Max att vara en potatis för alltid? Ett gäng forskare försöker uppfinna en maskin
  som ska förvandla Super Potato tillbaka till Max. Men det går inte så bra. Allt de lyckas få fram är
  en tidsportal som kan hjälpa Super Potato tillbaka i tiden för att stoppa Doktor Elak innan Max ens
  blir en potatis. Kommer det att lyckas?  I den här lättlästa boken ger sig Super Potato ut på en hisnande
  tidsresa  tillbaka till dagen då han blev en potatis. Han möter galna skurkar och allvetande sköldpaddor
  i sina försöka att stoppa Doktor Elak från att förvandla honom till en potatis. Men vill han verkligen
  bli Super Max igen? Max var snygg, men Super Potato är ju … snäll.     Hegas böcker – lätta att läsa.
  Svåra att motstå.
