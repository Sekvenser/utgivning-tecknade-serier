description: 'Detta sista nummer är till brädden fyllt med tecknade serier: Ett långt barndomsminne av
  Anna Haifisch, en kryssningsfärd i norska fjordar av Melek Zertal, HTMLflowers berättar om sin pandemitillvaro,
  Sara Kupari om tonåringar som tar svampar i skogen och Hanselmann skildrar Varulv Jones oförmåga som
  vårdnadshavare ytterligare en gång till. Dessutom: Johannes Nilsson skriver om sitt havererade livsprojekt
  och Robert Aman intervjuar Pål Elmqvist och Annika Rydberg angående deras internationella seriesuccé
  "Historie-boken", som Ordfront gav ut 1970.'
