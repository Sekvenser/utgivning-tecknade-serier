description: Philadelphia 1776. George Washington besöker Betsy Ross och beställer Amerikas Förenta Staters
  allra första flagga. Ett USA som ännu inte finns. Angela Brown, hushållerska hos Ross, syr i hemlighet
  dit en hyllning till Amerikas färgade befolkning; en svart femuddig stjärna som hon gömmer under en
  av de vita stjärnorna. Dover, 1944. Menige Lincoln får ett brev som avslöjar Angela Browns hemlighet.
  Tänk om den svarta stjärnan verkligen fanns på riktigt? Skulle det leda till en omskrivning av historien?
  Från ett nyligen befriat Paris till stridszonen i de snöiga Ardennerna beger sig tre afroamerikanska
  soldater på en livsfarlig resa som kommer att få ett oväntat slut.
