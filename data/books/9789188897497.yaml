description: Tintin i Kongo är det andra Tintinäventyret i ordningen och tecknades 1930-31. Innehållet
  säger mer om dåtidens fördomar om den mörka kontinenten än om hur den tidens Kongo tedde sig. Ändå förtjänar
  äventyret att läsas, både för sin plats i Tintinseriens utveckling och som ett historiskt dokument från
  en tid då nästan hela den afrikanska kontinenten lydde under europeiska kolonialmakter.
