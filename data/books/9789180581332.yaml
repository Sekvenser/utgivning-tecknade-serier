description: 'Samlingsvolym med albumen Alla dessa monster och Underjordens gåta, båda för första gången
  i svensk översättning.


  Ett monster med röda tentakler, en druid, en flock dolksvansar, och en mordisk tandläkare är bara några
  av ingredienserna i den fjärde samlingsvolymen med Adèle Blanc-Sec. Efter att ha väckts ur sin mångåriga
  dvala måste Adèle på nytt tampas mot fiender av både mänskligt och omänskligt ursprung.


  Jacques Tardis serie om författaren Adèle Blanc-Sec och hennes märkliga upplevelser bland urtidsdjur,
  galna vetenskapsmän och samvetslösa gangsters är serieäventyr utöver det vanliga.'
