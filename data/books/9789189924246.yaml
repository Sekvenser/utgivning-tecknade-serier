description: Ända sedan han som barn var med om föräldrarnas skilsmässa har Scotts liv präglats av en
  djup rädsla för ensamhet. Han flyr från känslorna av tomhet med hjälp av snabba dejter och ytliga relationer.
  En talande anka i dammen ger honom levnadsråd, men efter ett tag börjar han misstänka att ankans varningar
  om ensamheten bara förvärrat hans situation. Vill ankan honom väl eller bara dra honom allt längre ner
  i fördärvet?"Ingen brist på tankar" är en gripande berättelse om att våga möta sina rädslor och finna
  mening i det som verkligen betyder något.Scott Huber, född 1999, är uppvuxen på Tranholmen utanför Stockholm
  Han är verksam som formgivare, ­illustratör och grafiker. Han är utbildad på Konstfack. "Ingen brist
  på tankar" är hans debut i bokform.
