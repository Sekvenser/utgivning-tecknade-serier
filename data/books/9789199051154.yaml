description: Det känns idiotiskt att påpeka att tidningen har återuppstått ännu en gång, men så är det.
  Om det förra numret var ett försök att skapa en Bild&Bubbla i dess åttiotalsinkarnation uppdaterad till
  vårt tidevarv är detta en spretigare historia. Här samsas tecknade serier med en rapport från sommaren
  2026 i Hultsfred och en turnédagbok på Balkan. Inbundet med övrigt material finns tidskriften Karaboudjan
  där olika aspekter av Tintin och klara linjen-serier behandlas på en mängd vis.
