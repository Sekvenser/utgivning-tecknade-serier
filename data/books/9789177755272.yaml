description: I boken Mina drömmars mack får vi följa Tommy Sundvalls arbetsdagar som stationsombud på
  en bensinmack i Ådalen. Kunder som tankar, köper snus och korv, lämnar in överkörda katter, mekar med
  lösnaglar eller bara vill prata en stund. En unik, rörande och rolig arbetsplatsskildring som också
  berättar bensinstationens historia i Sverige.
