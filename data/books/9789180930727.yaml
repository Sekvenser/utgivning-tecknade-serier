description: 'Havsodjuret Kraken är havets skräck. Men det är ingenting som hindrar Bella från att ge
  sig ut med sitt skepp. Hon har två drömmar: att bli en hjälte och att bota pappas hemliga förbannelse.
  När Kraken kommer gör hon sig redo för strid. Men istället för att slåss tar Kraken Bella till en ö.
  Vad har den i kikaren?   Skönheten och odjuret är en klassiker många barn har stött på. I sin flippade
  form är den fartfylld och full av havsskum –en spännande utgångspunkt för att prata både om hur sagor
  är uppbyggda och om hur klassiker influerar populärkulturen idag. Skönheten och havs-odjuret är den
  nionde klassiska sagan i grafiska romanserien Flippade sagor.  Hegas lättlästa böcker väcker läslusten
  hos barn och unga.'
