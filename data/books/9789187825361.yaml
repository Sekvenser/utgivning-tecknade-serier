description: 'Framtidens utopi har en besättning på tre: Astrid, Isak och Katten, var och en med sina
  hemligheter. På sin väg mot människokolonin på Nya Paradiset får de problem. De har fått stopp i sin
  sannolikhetsdrivna Schrödingerianska osäkerhetsmotor och de har viktig last som måste nå kolonin. De
  kan bli tvungna att öppna lådan... Sannolikhetsdrift är en liten rymdopera i serieform, skriver och
  tecknad av Mattias Elftorp, känd för bland annat Piracy is Liberation, Arg Kanin.'
