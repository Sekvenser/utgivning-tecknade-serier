description: Ett homosexuellt par flyr staden från en annalkande apokalyps. De möter en annan konstnär
  på vägen och deras förhoppningar och planer ändras. Den finska allkonstnären Jaakko Pallasvuos "Reträtt"
  är en postmodern tolkning av dystopisk-genren, i vilken när han utforskar de motstridiga ideologierna
  och känslorna i en queer kärlekstriangel som utspelar sig under en tid där mänskligheten närmar sig
  utplåning. En uttrycksfull, sardonisk återgivning av kärlek, rädsla och leda inför undergången. "Reträtt"
  tar slitna narrativa troper i uppfriskande nya riktningar.
