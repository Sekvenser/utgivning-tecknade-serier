description: Del 2 i fantasyserien Drakens öga, där första delen heter Förrådd. Askalven Kha befinner
  sig nu på Ytan efter att han i den första delen tvingades fly. På Ytan träffar han drakmänniskan Ranja
  som också har en förbannelse över sig. Det finns en magisk krans som kan häva förbannelserna och de
  nya vännerna ger sig i väg för att hitta den. Samtidigt blir de angripna av Khas förföljare och måste
  kämpa för sina liv. Passar läsare 9–12 år.
