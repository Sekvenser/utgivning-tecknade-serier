description: 'Michel Tanguy och Ernest Laverdure ansluter sig till en grupp pilotelever på militärflygbasen
  Meknes i Marocko. Där ska de genomgå den tuffa slututbildningen som krävs innan de är färdiga jaktpiloter
  i det franska flygvapnet. Den hårdföre flyginstruktören löjtnant Darnier är den som fått i uppgift att
  få ordning på manskapet, inte minst den odisciplinerade Laverdure, men till Tanguys förtrytelse har
  Darnier snart utsett ett regelrätt mobboffer bland eleverna: den snarstuckne Jacques de Saint-Hélier.
  Då en stridsspets från en topphemlig fransk långdistansrobot störtar i de otillgängliga Atlasbergen
  sänds piloteleverna och deras instruktör iväg på ett farligt uppdrag.


  Jaktpiloterna Michel Tanguy och Ernest Laverdure är ett omaka par, men samtidigt bästa vänner. Där Tanguy
  är allvarlig, korrekt och ärlig, är Laverdure en munter spelevink, förtjust i flickor, fest och snabba
  bilar. Men när det verkligen gäller är han en pålitlig och trofast kamrat som aldrig sviker.


  Jaktfalkarna skapades 1959, mitt under kalla kriget, och berör många av tidens aktuella ämnen, som kärnvapen
  och de franska kolonialkrigen. Men det är framför allt en äventyrsserie om flyg och flygare, om kamratskap
  och mod, och bjuder också på en hel del humor. För första gången kommer nu denna flygserie, skapad av
  seriegiganterna Jean-Michel Charlier och Albert Uderzo och lanserad i det första numret av det klassiska
  franska seriemagasinet Pilote, att ges ut i en kronologisk och genomarbetad samlingsutgåva. I varje
  volym ingår också ett rikt illustrerat förord och upphovsmännen och deras samtid.'
