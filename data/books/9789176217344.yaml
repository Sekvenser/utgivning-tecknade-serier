description: Äventyret fortsätter. Sonja har rest med trollpojken Espen till den magiska Jotundalen. En
  vacker plats som tagen direkt ur sagorna, med troll och talande djur. Men där finns faror som hotar
  och vikingarna i dalen vill ha blodshämnd. De allierar sig med oraklet för att sätta stopp för Espen.
  Allt blir inte som Sonja hade väntat sig när hon blir fångad i en dödlig konflikt mellan troll, vikingar
  och det mystiska fjällfolket.
