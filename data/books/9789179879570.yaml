description: 'Beth har inga kompisar och känner sig ensam, tills en dag när en tjej hon inte har sett
  förut står utanför hennes dörr. Beth och Lizzie blir snabbt vänner, till och med bästa vänner. Men Lizzie
  börjar ta över mer och mer av Beths liv. Snart har Beth knappt något eget liv kvar… Bästa vänner för
  alltid är en gastkramande kuslig serieberättelse som håller läsaren på helspänn fram till sista bildrutan.
  Under samlingsnamnet Rysliga serier presenterar vi serieromaner där läskighetsnivån uppskruvad för att
  passa dem som lockas av att få känna kalla kårar och spänning när de läser. Med bilder som speglar handlingen
  blir det lätt att hänga med och få nycklar och verktyg för att bemästra förståelsen av ord och bild. 
  Lättlästa böcker från Nypon är ofta något kortare, har alltid ett lättare språk och ett innehåll anpassat
  för den tänkta läsarens ålder. EPUB3: Fixed format'
