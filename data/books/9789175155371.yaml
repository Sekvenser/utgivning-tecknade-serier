description: 'Eldnationen hotas av en profetia som säger att riket kommer att gå under om inte Zuko avsätts
  från tronen. Medan avataren Aang och hans vänner eskorterar Zuko och hans familj tillbaka till huvudstaden
  förbereder Nya Ozai-sällskapet ett hemligt angrepp mot kronan. Samtidigt börjar barn försvinna från
  sina hem under mystiska omständigheter. Ska Aang lyckas rädda dem och skydda Zuko innan kaos bryter
  ut i staden?


  Avatar är en amerikansk fantasyserie i mangastil, med action, humor och spännande karaktärer. Böckerna
  tar vid där säsong tre av den tecknade tv-serien slutar.'
