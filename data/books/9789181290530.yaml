description: Elvis och Bella försöker få barn, kämpar på med IVF och får till sist goda nyheter. Men är
  det goda nyheter även för Lillan? Och hur förberedda är de egentligen på livet som småbarnsföräldrar? 
  Tony Cronstam fortsätter att roa och överraska med självutlämnande livsbetraktelser i Elvis andra samlingsbok.
  En bok som samlar de allra senaste publicerade serierna Cronstam skapat, men även sådant som aldrig
  förr visats.
