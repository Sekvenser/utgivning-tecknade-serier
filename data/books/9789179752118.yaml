description: '"Hundmannen" är Dav Pilkeys nya superhjälte. Efter tolv spännande och skruvade äventyr med
  Kapten Kalsong är det dags för denna sammansatta karaktär att göra entré. Vad får man om man syr ihop
  en trasig polishund med en trasig polisman? Hundmannen! En stark kropp parad med en smart hundhjärna
  blir ett vinnande koncept: även osynliga bovar kan sniffas upp med stor framgång. Frågan är bara om
  Hundmannen klarar av att ständigt välja plikten framför allt, med tanke på det vilda inom honom ...'
