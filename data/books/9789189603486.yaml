description: "Hela världen är desperat efter kärlek. Varje dag uppstår ett nytt dejtingprogram och det\
  \ kommer allt fler dejtingappar; den ena mer nischad än den andra. \nStandarden är hög och är man inte\
  \ nöjd med den man har finns det andra snygga singlar bara ett svajp bort. Iris tillhör generationen\
  \ som vuxit upp i romcom­filmernas guldålder. Men var tog romantiken vägen? Finns den på riktigt? Varför\
  \ finns den inte för alla? Iris idé om kärlek har lagt sig snett i hjärnan och gjort allting skevt och\
  \ ouppnåeligt. Hon ser saker ­genom en slöja som döljer allt hon inte vill se. Hon är girig. Hon vill\
  \ ha det där som alla andra verkar ha. I en samtid som kväver kärleken."
