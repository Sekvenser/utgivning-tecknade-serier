description: Anna Haifischs särpräglade serie berättar i korta episoder om en konstnärs upplevelser. Plågad
  av tvivel möts konstnären av motgångar som blandas med enstaka glimtar av erkännande. Baserat på Haifischs
  egna erfarenheter som illustratör i Tyskland och USA publicerades "The Artist" ursprungligen som en
  återkommande serie i Vice Magazine. Denna samlingsutgåva innehåller även ett antal lite längre episoder
  som ritats under senare år, varav vissa publiceras för första gången i bokform i denna bok.    "De senaste
  fem åren har Anna Haifisch utforskat konstnärskapets plågsamma sidor. Bergochdalbanan mellan hybris
  och självhat, de kreativa sammanbrotten. Tvivlet, den kollegiala avundsjukan. Avgrunden, som för hennes
  karaktärer alltid tycks nära."  - Dagens Nyheter  Det här är Anna Haifischs andra bok på svenska efter
  den kritikerhyllade "Von Spatz" som utgavs 2020, samma år som hon mottog Max och Moritz-priset för bästa
  tyskspråkiga serieskapare.
