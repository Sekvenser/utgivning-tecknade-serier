description: 'Om jag har upplevt någon spökhistoria, jo, var säker på det! Det hände för ett par år sen,
  och jag har inte varit mig riktigt lik sen dess. Det var så här.


  ur Astrid Lindgrens aldrig tidigare utgivna saga: En spökhistoria.


  I den här antologin ryms fem riktigt kusliga sagor av allas vår Astrid. Ingen kan som hon fånga både
  små och stora läsare. Det här är perfekt högläsning framför brasan en mörk kväll för den som tycker
  att det är härligt med rysligheter.


  Förutom En spökhistoria får vi återuppleva favoriter som Allra käraste syster och Ingen rövare finns
  i skogen , liksom de två lite mindre kända sagorna Skinn Skerping och Tu tu tu.


  Kusliga sagor är en vacker presentbok med färgillustrationer på alla uppslag. Här finns både välkända
  bilder av Ilon Wikland och Hans Arnold och helt nya bilder av Amanda Berglund och Malin Ahlin.'
