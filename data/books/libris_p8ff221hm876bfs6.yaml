description: Max försöker skaffa en vän genom att prata med folk på busshållplatsen. Han försöker många
  gånger utan framgång. Det är först när Carmen kommer förbi och tror att Max hejar på samma fotbollslag
  som hon som han lyckas. Max börjar genast heja på Grannarnas fotbollsklubb, GFK, och de går därifrån
  tillsammans sjungande GFK:s supportervisa.
