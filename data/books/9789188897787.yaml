description: '"Äntligen en albumserie värdig mitt geni!" Spirous ärkefiende Zafir, världens smartaste
  onda vetenskapsman, har blivit pappa. Närmare bestämt till sextonåriga Zandra. Hon är en tjej med mycket
  skinn på näsan som kräver att få leva ett normalt tonårsliv - vilket inte alls går ihop med hennes fars
  omåttliga kontrollbehov. Än värre blir det då Zandra upptäcker sanningen om sitt ursprung'
