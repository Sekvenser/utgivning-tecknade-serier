description: När Grace var liten brukade hennes pappa berätta fantastiska historier om drakar och deras
  magiska krafter. Grace trodde aldrig på berättelserna. Men sedan hennes pappa dog så älskade hon att
  minnas tillbaka på de där stunderna.På en skolutflykt träffar Grace en gammal gumma som ger henne ett
  mystiskt ägg. När ägget kläcks och en söt liten drake kikar ut förstår Grace att berättelserna hon hörde
  som liten inte bara var godnattsagor.Grace förstår snabbt att den nykläckta draken bär på stark magi
  och att det därför finns onda krafter som är ute efter den. Nu gäller det för Grace och hennes nya kompisar
  att skydda draken från fienden som vill utnyttja dess kraft. Samtidigt så får Grace också reda på mer
  om sin pappas död. Ingenting verkar vara som Grace trott.Kampen börjar är den första delen i Vivian
  Truongs medryckande mangaserie Drakarnas stad.
