description: På planeten Teknikus finns en flicka som heter Snövit. Hon är skapad av planetens smartaste
  snillen för att bli den perfekta drottningen. Det visar sig att hon också är expert på att laga robotar.
  Den onda drottningen på Teknikus hatar Snövit och skickar iväg henne för att hon inte ska ta över tronen.
  Men Snövit är snäll och hjälpsam och har många vänner. De vill gärna hjälpa Snövit att komma tillbaka.  Serien
  Flippade sagor tar en klassisk saga och flippar den. Det här är Snövit på ett helt nytt, galet och modernt
  sätt! Häng med till planeten Teknikus där vi får träffa universums smartaste och snällaste Snövit!     Hegas
  böcker – lätta att läsa. Svåra att motstå.
