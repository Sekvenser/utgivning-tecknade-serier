description: 'I sitt åttonde seriealbum riktar Nanna Johansson kängan mot samtidens hopplösa krav på perfektion,
  arbetsmoral och intresse för inredning. Hur orienterar man sig i systemet om man är fattig, ful, tjock,
  ledsen eller bara lite lat? Ska man rycka upp sig, känna sig värdelös eller bara ge fingret åt alltihop?Hata
  samtiden är satir när den är som bäst: ilsken och hysteriskt rolig!'
