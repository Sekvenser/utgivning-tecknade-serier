description: 'Sedan Asterix ärorika sprintseger i de olympiska spelen år 50 f.Kr. har de olika grenarna
  genomgått stora förändringar. Även om det har tävlats i idrott sedan urminnes tider, är de sätt som
  många sporter utövas på i dag relativt nya fenomen. Hur gick det till på Asterix tid och hur uppkom
  egentligen dagens fotboll, friidrottstävlingar och kampsporter?


  Följ med Asterix, Obelix och tränaren Panoramix till romarrikets arenor för ett galliskt perspektiv
  på olika sorters idrottsutövning. Vägvisare till antikens sporter är författaren Bernard-Pierre Molin,
  som också har skrivit Asterix: Historieboken och Asterix: Latinska citat med förklaringar.'
