description: Den franska konstnären Sammy Stein arbetar i skärningspunkten mellan seriekonsten och litteraturen,
  i avantgardets yttersta utmarker. I den här boken samlas 17 serier av varierande längd, ursprungligen
  publicerade i antologier, eller i fanzines i begränsad upplaga.  Vi får bland annat vandra genom ruiner
  från en svunnen storhetstid, besöka såväl märkliga restauranger som egendomliga, hopdrömda konstutställningar
  och läsa en nekrologi över en excentrisk konstnär.   Stein har en helt egen, nyskapande röst som serieskapare
  och arbetar med en estetik som känns oerhört samtida. Det här är hans första bok på svenska.
