description: Tintin i Kongo publicerades första gången för drygt 90 år sedan. Den dåvarande belgiska kolonin
  var det andra landet som den unge reportern Tintin reste till, efter besöket i bolsjevikernas Sovjet
  1929. Den här versionen av äventyret är daterad till 1946, då Hergé tecknade om albumet helt och hållet
  inför att det skulle ges ut i färg.
