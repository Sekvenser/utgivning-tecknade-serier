description: 'Popstjärnan Sophie Lims senaste låt Kiss of Death ligger etta på topplistorna när hon plötsligt
  trillar huvudstupa nedför en trappa och dör. Som tur är visar det sig att liemannen Elijah, som kommit
  för att hämta henne, är ett fan! Med Elijahs hjälp lyckas Sophie efter en del köpslående ta sig tillbaka
  till de levandes värld. Men hennes återkomst från de döda har rubbat den kosmiska balansen, vilket inte
  kommer att underlätta för Sophie när hon försöker passa in som popstjärna i sin nya klass.


  Violet Karims populära webbserie är en romantisk komedi med övernaturliga inslag och oväntade vändningar,
  som har charmat miljoner läsare från hela världen.'
