description: Den den franska serieskaparen Juliette Mancinis verk Uppvaknanden (Éveils) är en självbiografisk
  betraktelse av hennes uppväxt, konventioner och om att utveckla sig själv där hon ställer många frågor,
  bland annat om kvinnors plats i ett patriarkalt samhälle men också om nationella trauman som elfte september
  2001 i USA och terrordåden i Paris november 2015. Uppvaknanden är hennes första bok på svenska.
