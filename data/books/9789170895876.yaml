description: När Lilla My hittar en låda med tropiska fröer sår hon förstås ut hela lådan, och morgonen
  därpå har hela Mumindalen förvandlats till en jättestor djungel. Muminpappan letar genast fram sin tropikhjälm
  och vill ge ut sig på safari. Mumintrollet hittar sin inre Tarzan och försöker svinga sig från lian
  till lian. Muminmamma myser för att sovrummet har förvandlats till en fruktträdgård.
