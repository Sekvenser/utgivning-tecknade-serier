description: KRIGET ÄR SLUT. Vad hände egentligen med DRIFT efter att han blev avkastad från DEN FÖRLORADE
  LYKTAN? Kommer RATCHET att hitta honom? Hur kommer SKARPRÄTTARSKVADRONEN att reagera när de får veta
  att MEGATRON har gått över till Autoboternas sida? Kan HOT ROD, ULTRA MAGNUS, SKIDS, NAUTICA, BRAINSTORM
  och resten av besättningen på DEN FÖRLORADE LYKTAN få hjälp av THUNDERCLASH att hitta RIDDARNA AV CYBERTRON?
  Varför har SWERVE pratat med läsarna på sista tiden? Vad har SKROTLETARNA för sig... och vad tänker
  de göra med GRIMLOCK? Svaret på alla dessa frågor får du i den här boken - den femte i berättelsen om
  besättningen ombord på rymdskeppet DEN FÖRLORADE LYKTAN.
