description: Kalle Anka & C:o gavs ut för första gången 1948 och är därmed Sveriges äldsta ännu utkommande
  serietidning. Under 75 år har alltså generationer av svenskar både roats och bildats av Kalle Anka och
  hans vänners öden och äventyr. I den här jubileumsutgåvan samlar vi ett urval av de bästa och mest klassiska
  serierna ur Kalle Ankas enorma seriearkiv.
