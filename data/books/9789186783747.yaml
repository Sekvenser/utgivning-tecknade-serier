description: Serieroman löst baserad på den klassiska filmen The most dangerous game.  ”Jag heter Fiona
  Flanagan. Ni känner mig inte, general Zaroff… Ändå fick ni för ett tag sedan mitt liv att ta en ny vändning,
  då ni dödade min far under en av era vidriga människojakter. Jag föreslår att ni nu får betala er skuld
  till mig! Mina medhjälpare har hittat er yngsta syster och hennes tre barn. Liksom de lyckats lokalisera
  ön där ni håller till… Detta väckte jaktlusten hos mig också! Vem av oss blir den första att hitta er
  syster och hennes barn? När ni läser detta kommer de redan att befinna sig på er ö. Hittar jag dem dödar
  jag dem. Hittar ni dem först, kommer ni att behöva slåss för att försvara dem. Jag kommer aldrig att
  sluta jaga er förrän alla vid namn Zaroff är utplånade.”
