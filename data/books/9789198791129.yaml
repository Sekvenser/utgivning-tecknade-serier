description: 'Efter en klimatkatastrof har världen blivit en iskall plats. Få människor överlevde och
  flydde in i murade städer där de varje natt måste försvara sig mot ismonster. Den unga Sami bor i en
  sån stad  och har en dröm: Han vill bli nattvakt och skydda sina medmänniskor från ismonstrena. Men
  en dag blir han attackerad och skadad, varpå hans kropp förvandlas till halvt människa och halvt monster.'
