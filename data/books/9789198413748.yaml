description: '"I denna fristående uppföljare till uppväxtskildringen Om någon vrålar i skogen berättar
  Malin Biller om hur det är att ha nära anhöriga som drabbas av demens. Kampen för att låta dem få rätt
  vård. Sorgeprocessen i att se någon förändras och förtvina. Om platser som en gång varit trygga för
  en i en turbulent barndom, som en dag inte finns mer. Ändå gör de det. I hjärtat, i minnena man alltid
  bär med sig. Inget går att ta för givet, och tomrummet efter en enda liten människa kan vara större
  än att hela världen kan fylla upp det."--förlagstext'
