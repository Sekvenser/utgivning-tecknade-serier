description: Tillbaka till träsket. Äntligen ska Dion få bevisa att han kan bli en Nattens krigare. Men
  till Dions förvåning tar Luna Lark med honom tillbaka till Träsket på dagen för inträdesprovet. Där
  pågår ett rån och Luna förklarar att Dion måste stoppa rånet. Det är dags att Dion visar vad han går
  för. Han måste kämpa, för både sitt liv och för sin framtid. En rik läsupplevelse, på få ord. För alla
  som sneglar mot Amulett men behöver något mer lättläst bjuder Jan Kjær på ett grafiskt äventyrsepos
  . Med ena benet i nordisk mytologi och andra benet i manga har Kjær skapat ett magiskt universum att
  upptäcka tillsammans med huvudpersonen Dion. Dödlig kamp är den tredje delen i serien Nattens krigare.
  Hegas lättlästa böcker väcker läslusten hos barn och unga.
