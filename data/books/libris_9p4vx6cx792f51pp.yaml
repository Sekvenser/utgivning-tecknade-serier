description: Serieroman där Mats Jonsson, efter sin farfars död, upptäcker sitt okända samiska ursprung.
  Han reser tillbaka i tiden, genom Sveriges, Sápmis och sin egen släkts historia. Är både en släktkrönika
  och en bred skildring av det samiska folkets historia, från att Sápmi växer fram i Nordens norra delar
  till att svenskarna koloniserar området söderifrån och tvingar samerna till anpassning. Skönlitteratur
  för seende.
