description: 'Hur har människan hanterat sex genom tiderna? En informativ och underhållande rundmålning.


  Människor har alltid haft sex på hjärnan, för njutning, makt, hämnd, fortplantning eller helt enkelt
  för att det inte var tillåtet. Idag omger sex oss på alla håll och kanter, men det är sällan vi får
  veta något om sexets omtumlande, kaotiska historia från mänsklighetens gryning fram till idag.


  I den här boken kombinerar sexologen Philippe Brenot antropologi, sociologi, psykologi och historia
  om detta viktiga ämne i en av de mest mångbottnade böcker som någonsin tagits fram inom ämnet. Alltihop
  återgivet i lättsamma illustrationer av Laetitia Coryn.


  Innehåll: Begynnelsen (nakna apor, Bibeln och tabun), Babylon, Egypten, Grekland, Rom, Medeltiden, Renässansen,
  Kyrkans långa välde, Upplysningen, 1800-talet, 1900-talet och 2000-talet (internet, robotar och framtidssex).'
