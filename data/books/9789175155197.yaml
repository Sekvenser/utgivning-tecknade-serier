description: 'Trollkarlen som är den eviga flammans väktare och hans adopterade barnbarn Bea lever ett
  fridfullt liv på planeten Irpa när trollkarlen en dag försvinner spårlöst. Tillsammans med galdurianen
  Cad och katten Nimm lämnar Bea sin trygga tillvaro för att försöka ta reda på vad som hänt honom.


  På sin färd upptäcker de att stora faror hotar bland skuggorna när ett evigt mörker är på väg att lägga
  sig över världen. Kommer de tre att lyckas hitta trollkarlen innan solen går ned över Irpa en sista
  gång?


  Tim Proberts kritikerhyllade fantasyserie Lightfall vänder sig till alla som gillar vackert tecknade
  magiska världar och spännande äventyr i samma genre som Amulett och Norrsken.'
