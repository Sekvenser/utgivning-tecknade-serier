description: Varje år tävlar öarna i Göteborgs norra skärgård om vilken ö som har den största påskbrasan
  och öborna försöker samla alla uttjänta julgranar man kan till bålet. De olika öarna drar sig inte ens
  för att stjäla av varandra, ibland utbryter rena rama grankriget! Just det här året är dock alla granar
  spårlöst borta, så Ugly får i uppdrag att ta reda på vem som tagit dem.
