description: Under 80-talet förändras den svenska seriekulturen i grunden. Ingen symboliserar denna förändring
  mer än den excentriske Horst Schröder och hans förlag Epix. I Epix, Pox, Tung Metall och en rad andra
  tidningar introducerar Schröder svenska läsare till tidens mest betydelsefulla serier från hela världen.
  Allt med ”Serier för vuxna” tydligt märkt i ena hörnet på omslagen för att markera att det rör sig om
  ett innehåll väsensskilt från Kalle Anka eller Fantomen. Under en period på tio år får Epix uppleva
  både triumfer och skandaler. Nu berättar alla inblandade för första gången hela historien om det mytomspunna
  förlaget som var en adrenalinspruta rätt i hjärtat på serie-Sverige. Robert Aman – kulturskribent och
  serieforskare – har inte bara intervjuat Schröder och Epix-redaktionens mångtaliga medarbetare utan
  även svenska och internationella seriestjärnor som publicerar sig i Epix tidningar, konkurrenter som
  går i klinch med Schro¨der (eller tva¨rtom), journalister som rapporterar om fo¨rlagets fo¨rehavanden,
  kritiker som helst av allt o¨nskar att tidningar som Epix och Pox inte existerade. Och ma°nga fler.
  Serier för vuxna berättar ett stycke vild och lätt osannolik litteraturhistoria. Kokain gömt i kopieringsmaskinen,
  åtal för olaga våldspornografi och en kidnappning är endast några av de ämnen som berörs. Men framför
  allt är det en berättelse om en grupp unga eldsjälar övertygade om att seriekonsten är ämnad för något
  större. Denna bok slungar läsaren tillbaka till 80-talet och innanfo¨r va¨ggarna hos redaktionen pa°
  Frejgatan 19 i Stockholm där luften a¨r tjock av stora fo¨rhoppningar, brinnande entusiasm, gnisslande
  konflikter – och svart ro¨k fra°n Horsts pipa.
