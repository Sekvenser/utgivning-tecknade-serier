description: När Askungens mamma dör lägger hon all sin kraft på att bli ninja. Hon blir Ask-Ninjan! Hennes
  pappa gifter om sig och hon får en elak styvmor och hemska styvsystrar. Livet blir bara tuffare och
  tuffare för Askungen. När även hennes pappa går bort får hon slita åt sin styvfamilj.  Ask-Ninjan drömmer
  om att bli livvakt åt prinsen. Men hur ska det gå till när hon bara får slita i hemmet och gå i trasor?
  Kanske kan hennes ninja-egenskaper hjälpa henne?  Ask-Ninjan tillhör en ny serie, Flippade sagor. I
  denna actionfyllda Askungesaga blandas ninjor och goda féer när den klassiska sagan flippas. Med fartfyllda
  illustrationer som påminner om animerade serier lockas läsaren till detta häftiga äventyr.   Hegas böcker
  – lätta att läsa. Svåra att motstå.
