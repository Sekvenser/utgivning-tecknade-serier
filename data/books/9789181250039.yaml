description: Tokiga Minecraft-monsterVad händer om man dricker en Minecraft-häxas tvål? Det och mycket
  annat får du reda på i den här knasiga boken. Följ med både mober och äventyrare på allt från kapplöpning
  till trollerishower med skumma avsikter.Kort och knasigt i Minecraft för nybörjarläsaren. I korta serie-strippar
  på en sida var får vi hänga med de mest älskade – och hatade – karaktärerna från spelet Minecraft. Det
  korta formatet avlastar arbetsminnet och ger den ovana läsaren välbehövda pauser. En perfekt tröskelbok
  för den som har svårt att komma igång med läsningen men lockas av serietidningar och Minecraft. Mobernas
  busiga liv är den tredje fristående boken i serien Mober – Klantiga Minecraft-monster. Hegas lättlästa
  böcker väcker läslusten hos barn och unga.
