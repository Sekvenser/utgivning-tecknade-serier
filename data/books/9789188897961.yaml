description: Charlie och Nick går på samma brittiska pojkskola, men har aldrig träffats då de en dag hamnar
  bredvid varandra i klassrummet. De två killarna blir snabbt kompisar och snart har Charlie fallit pladask
  för Nick, trots att han är övertygad om att det är kört på förhand. Men kärlekens vägar är outgrundliga.
  Det visar sig att Nick är betydligt mer intresserad av Charlie än vad någon av dem hade kunnat ana.
  Heartstopper berättar om den första stora, förvirrande och allt uppslukande kärleken, men handlar också
  om att stå för vem man är och att lära sig acceptera sig själv. Serien publicerades först digitalt på
  nätet där den på kort tid fick en stor mängd läsare. Då författaren och illustratören Alice Oseman bestämde
  sig för att hennes webcomic också skulle ges ut som bok, tog det bara två timmar att få den finansierad
  via Kickstarter. Några år senare har hennes självpublicerade serie blivit en internationell försäljningssuccé
  som översatts till närmare 30 språk.
