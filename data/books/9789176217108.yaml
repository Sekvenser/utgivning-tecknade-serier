description: Asterix och gripen är det femte albumet av Asterix nya skapare, författaren Jean-Yves Ferri
  och tecknaren Didier Conrad. I sällskap av den framstående galliska druiden Miraculix förbereder de
  sig inför en lång och mystisk resa i jakten på en märklig och skräckinjagande varelse  till hälften
  örn, till hälften lejon.
