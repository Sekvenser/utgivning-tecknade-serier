description: Long John Silver, den enbente skeppskocken från R.L. Stevensons Skattkammarön, har gått i
  land och blivit värdshusvärd i Bristol. Men då lady Vivian Hastings föreslår att Silver och hans män
  ska ledsaga henne på en resa till Amazonas, varifrån hennes make har skickat bud hem om att han har
  funnit det legendariska Eldorado och Guyanacapac, en stad fylld av guld, förmår han inte säga nej.
