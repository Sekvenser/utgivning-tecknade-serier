description: Detektivarbetet för att få veta vad som egentligen hände de släktingar som ”försvann” under
  andra världskriget förflyttar berättaren och läsaren över tre kontinenter, men också genom tid och rum.
  Medan de mördade träder fram i ljuset, i all sin modernitet och självklara livsvilja, hotar mörkret
  att sluka den som kliver in i det.Med sin unika förmåga att enkelt och slagkraftigt skildra vår existens
  berättar Joanna Rubin Dranger i ”Ihågkom oss till liv” om det allra svåraste på ett sätt som både drabbar
  och ger oss nya insikter.En tecknad dokumentärroman om smärtan över att bli främmandegjord och avskuren
  från sin historia.
