description: Sommarsemester och kroppskomplex Adele tar med Lina och Abeba till Sardinien. Det känns pirrigt
  och stort att resa iväg själva. Men även bland varma vågor och spännande vespa-turer letar sig mörkret
  in. Kroppskomplex och förvirrade känslor tvingar dem att utforska hur modiga de verkligen är i förhållande
  till sina hjärnspöken. Det kan kännas plågsamt när kompisarnas kroppar ändras medan man själv fortfarande
  känner sig som ett barn. Och det kan kännas skrämmande att börja agera på sina känslor.
