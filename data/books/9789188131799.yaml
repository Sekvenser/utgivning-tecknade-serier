description: Den hyllade Daredevil-berättelsen av Frank Miller och David Mazzucchelli. En man utan hopp
  känner ingen fruktan! Matt Murdocks hemliga identitet som Daredevil har sålts av hans tidigare flickvän
  Karen Page till den undre världen för en dos heroin. Ryktet går i storstadsdjungeln och når till brottsfursten
  KINGPIN, som nu gör allt för att förgöra den plötsligt sårbare MATT MURDOCK… Jagad, hemlös och paranoid
  måste Matt nu stå ensam mot den samlade undre världen, samtidigt som en skyddsängel från hans förflutna
  plötsligt uppenbarar sig.
