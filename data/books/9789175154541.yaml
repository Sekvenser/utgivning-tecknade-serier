description: Den levande mumien Tavutatet har tvingats lämna tryggheten på museet för att fly undan de
  ondsinta molosserna. För tillfället är hon i säkerhet i London, men Tavutatets mor, farao Hatshepsut,
  har tagits tillfånga. Som tur är får prinsessan hjälp av sina nya vänner, en brokig grupp övernaturliga
  varelser. Tillsammans ger de sig iväg för att försöka befria Hatshepsut och leda motståndet mot molosserna
