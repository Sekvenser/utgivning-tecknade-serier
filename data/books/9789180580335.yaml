description: Johan, Lotta och Jocko i nyutgåva! Efter att ha flytt från piraternas undervattensbas har
  Johan, Lotta och Jocko hamnat på en ö. Det dröjer dock inte länge innan deras förföljare dyker upp i
  sin ubåt. Men på ön finns en stor vulkan som är på väg att få ett utbrott, och plötsligt måste Johan
  och Lotta försöka rädda både sig själva och piraterna från ett regn av glödande aska.
