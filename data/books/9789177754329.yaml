description: I Folkbokförd i rännstenen gör Tommy Sundvalls rebelliska lowlife-trio Morris, John och Hunter
  comeback. Ännu en gång gör de allt de kan i sin ständiga jakt på pengar. Det blir en flippad färd genom
  en surrealistisk samtid. I desperata och vilda seriehistorier levererar Tommy Sundvall en rasande kritik
  av gig-ekonomin och klassamhället. Det är vackert, helt bisarrt och hysteriskt kul.
