description: Liminal space, a concept that deconstructs the notion of fixed boundaries and absolute realities.
  It is a space that challenges the dualities of self and other, inside and outside, past and future.
  A bridge to cross, a door to open. A place to question and transcend.  Liminality has always been a
  part of humanity. Maybe not as a state of transition but rather as a state of constant becoming. It
  is a space that disrupts the linearity of time and questions the stability of identity. That area of
  blurred boundaries is very much an integral part of the creative process for us as humans and artists.
  A realm of ambiguity. A pause in time, a shift in state. A realm of potentiality. Where form and meaning
  await.  Here (or in there) we can push the boundaries of the unexpected. With comics, the idea of the
  liminal space can be used to craft stories and narratives that exist between different realms of reality.
