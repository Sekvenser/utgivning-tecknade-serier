description: Hur säger man de där särskilda orden till någon man älskar? Medan Charlie funderar över hur
  han ska sätta ord på sina känslor oroar sig Nick alltmer över Charlies ätstörning, samtidigt som han
  försöker hitta ett sätt att komma ut för sin pappa. När sommaren övergår i höst visar det sig att Nick
  och Charlie fortfarande har en hel del kvar att lära sig när det kommer till kärlek.Det här är fjärde
  boken i Alice Osemans serie Heartstopper, som blivit en internationell succé både i bokhandeln och på
  Netflix. Den andra säsongen av tv-serien kommer att släppas under 2023.
