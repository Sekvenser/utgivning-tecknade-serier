description: 'När LeBron och hans son Dom fångas i en digital värld av en A.I skurk, måste LeBron få hem
  dem i säkerhet genom att leda Snurre Sprätt, Lola Kanin och hela gänget av de notoriskt odisciplinerade
  Looney Tunes till seger över A.I datorns digitala mästare på planen: ett lag av spelare från NBA och
  WNBA som du aldrig sett dem förut. Det är Tunes mot Goons i en utmaning med den högsta insatsen i hans
  liv, som omdefinierar LeBrons realtion till hans son och belyser vikten av att vara sig själv. De stridsberedda
  Tunes bryter mot reglerna, använder sina unika talanger och överraskar även "Kungen" James genom att
  spela basket på sitt sätt.'
