description: Vikingapojken Ubbe förlorar sin mamma när den fruktade Fenrisulven attackerar deras by. Några
  år senare dyker guden Loke upp i form av en korp. Loke övertalar Ubbe och schamanen Tyra att följa med
  honom för att fånga ulven. Under resan möter de stora faror och svåra hinder. Den svåraste är enstridslysten
  viking  jarl Blåtand. Ubbe utmanas till en kylig duell på liv och död.
