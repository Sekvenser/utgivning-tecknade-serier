description: Raquel är 16 år och bor i en sömnig liten stad i Portugal där alla känner till allt om alla.
  Raquel har två bästa vänner och en pojkvän. Allt man behöver för att överleva gymnasietiden. Varför
  känns det som att något saknas? En dag ser Raquel henne. Pardalita, som går sista året och är med i
  teatergruppen, som drömmer om att flytta till Lissabon och bli konstnär. Och blir förälskad.
