description: På vinguden Dionysos vilda vårfest storhångade, underjordens enstöriga härskare Hades och
  fruktbarhetsgudinnan Demeters tvära dotter Kore. Men så far han ner till underjorden igen, och Kore
  börjar snart misströsta. Tycker han inte om henne mer? Charmig och respektlös, inspirerade av grekisk
  mytologi, med ena foten i sagans magiska värld och den andra i den jordnära vardagen. Detta är femte
  boken om Hades och Kore
