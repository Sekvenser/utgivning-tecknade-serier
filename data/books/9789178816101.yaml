description: Varje år ser Aster fram emot Midvinter-festivalen. Det är en återförening av hela Vanissen-släkten,
  där alla tävlar mot varandra i den magiska Jolrun-turneringen. I år ska Aster själv få tävla – som en
  häxa. Han är ser fram emot att få visa alla hur mycket han har lärt sig och hur stolt han är över sig
  själv. Men det kommer inte vara lätt att trotsa traditionen. Ariels tankar kretsar istället kring den
  mystiska häxa som hemsöker hennes drömmar. En häxa som hävdar att hon vet sanningen om Ariels förflutna.
  Men ingenting går som Aster och Ariel planerat. En mörk magi invaderar återföreningen och allt ställs
  på sin spets – kommer de två häxorna att hitta modet att kämpa mot ondskan tillsammans? Eller kommer
  mörka krafter att slita dem isär?  Midvinter-häxan är tredje delen i serien om Witchboy – en spännande
  tecknad serie om magi, drömmar och normer och om de personer som vågar utmana dessa. En fantastisk hyllning
  till att våga vara den man är, inte den man förväntas vara. Det är inte bara vi som upptäckt hur bra
  serien är – filmrättigheterna är redan sålda till Fox Animation.   Hegas böcker – lätta att läsa. Svåra
  att motstå.
