description: 'Ugly blir kallad till Töreboda i Västergötland för att hjälpa den lokale sheriffen att stoppa
  en liga av bohagstjuvar. Under undersökningens gång stöter Ugly på ett flertal västgötalegender: Jösse
  James, Vilde Bill Hackspett, Jonah Tax, Dog Holliday med flera. Älgarås urinvånare får en visit, liksom
  det kråkslott som en gång tillhört arvtagerskan till Husqvarnas vapenfabrik.'
