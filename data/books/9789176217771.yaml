description: Unge Maximin av Stupenborg har svurit att han aldrig mer ska slåss. Men bakom varje hörn
  lurar ett skurkgäng som utmanar honom. Johan och Pellevin slår följe med Maximin på vägen till Stupenborg.
  Med på resan finns även ett resande teatersällskap med tre påhittiga gycklare. De förser Pellevin med
  lutor som han sliter ut med förbluffande hastighet. Lyckas Maximin ta sig hela vägen hem utan att hamna
  i något slagsmål? Han är så illa tvungen, för hela hans framtid står på spel. På slottet i Stupenborg
  lurar nya faror, någon försöker förgifta Maximins far...
