description: En liten flicka adopteras av ett folk som lever på gränsen till människornas värld. Inom
  henne brinner en längtan att få veta sitt ursprung och när hon blir äldre söker hon sig allt närmare
  människorna. Ödet leder henne till Al-Far, den farligaste staden i Gwendalavir, där hon blir vän med
  en grupp gatubarn och legenden om Ellana tar sin början.
