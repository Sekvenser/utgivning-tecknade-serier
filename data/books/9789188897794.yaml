description: Rom, år 12 f.Kr. Kejsar Augustus är allsmäktig härskare över det väldiga imperiet. Alix Graccus
  har fyllt 50 år och är numera senator och kejsarens förtrogne. Kejsarfamiljen drabbas av en tragedi
  då Augustus svärson Agrippa blir dödad av en örn. Alix får i uppdrag att undersöka om det rör sig om
  ett gudomligt straff eller ett skickligt iscensatt politiskt lönnmord.
