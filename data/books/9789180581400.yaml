description: 'På jakt efter bröderna Dalton får Lucky Luke syn på tre skumma typer som är på väg att hänga
  en man, något som Luke raskt sätter stopp för. De tre männen är Pinkertonagenter och mannen han räddade
  är ingen annan än den svenske agitatorn August Palm. Mäster Palm har rest till USA på föreläsningsturné
  för att uppmana landets arbetare att organisera sig för att kunna stå upp mot rika fabriksägare och
  järnvägsbolag.


  Luke och Mäster Palm slår följe till Minneapolis och slummen Swede Hollow i stadens utkant, hemvist
  för många fattiga svenska immigranter, dit Palm kommer för att hålla tal. Snart väntar nästa sammandrabbning
  med Pinkertons, samtidigt som bröderna Dalton har egna idéer om hur de ska dra nytta av agitatorns besök
  för egen vinning. Men då har de inte räknat med Lucky Luke och hans nya svenska vänner.


  För första gången har en svensk serieskapare fått äran att teckna en serie med Lucky Luke. Det här specialalbumet
  innehåller fem serier av fem tecknare från lika många länder. Det svenska bidraget heter Agitatorn och
  är gjort av Mats Källblad, en av landets mest mångsidiga tecknare.'
