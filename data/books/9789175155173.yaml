description: 'Efter äventyren på planeten Oshun har Hilo fått sällskap på jorden av sin robotsyster, Izzy.
  Tillsammans med sina bästa kompisar Gina och D.J. ställs Hilo inför en ny utmaning när megastora robotmonster
  plötsligt går till attack. Men varifrån kommer monstren och vem är det som ligger bakom allt?


  Böckerna om Hilo är en rolig blandning av E.T. och Hundmannen, fulla av action och snabba vändningar.
  Detta är den fjärde boken i en serie om robotar, vänskap och muterade rymdmonster, skriven och tecknad
  av Judd Winick.'
