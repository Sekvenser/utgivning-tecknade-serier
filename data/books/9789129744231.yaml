description: 'Mördarclowner i Rosenhill!En helt ny serie med Röda Masken: Äventyr för superhjältar är
  renodlade serieböcker för de lite äldre fansen, med snabbare tempo och nervkittlande handling − perfekta
  för alla de som älskar superhjältarna och bara vill ha mer!Det händer mystiska saker i Rosenhill på
  nätterna. I hus efter hus bryter sig läskiga clowner in och binder fast husägarna. Sedan lämnar de −
  utan att stjäla någonting. Ingen förstår varför och snart råder clownskräck i staden. Att tidningen
  kallar dem ”mördarclowner” gör inte saken bättre. Det är något skumt på gång, och Röda Masken och de
  andra superhjältarna tänker ta reda på vad det är!Handbok för Superhjältar är den största boksuccén
  i Sverige på senare år. Nu återvänder vi till Rosenhill och träffar Röda Masken, Vildbiet och de andra
  superhjältarna. Böckerna är skrivna av Elias Våhlund och illustrerade av serietecknaren Kim W Andersson.'
