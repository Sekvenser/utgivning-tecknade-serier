description: I det här seriealbumet berättas Malmös historia från den färgstarka medeltiden till nutid.
  I vår stad har det alltid bott människor från olika länder och här får vi följa dem genom århundradena
  – vi går på sillamarknad, är med om dramatik under de skånska krigen, tågar med i rösträttsdemonstrationer
  och jublar på fotbollsmatcher i en stad som aldrig stått stilla.
