description: Isak älskar att spela hockey, men hans spelstil är hård. Under en träningsmatch skadar han
  sitt eget lags bästa spelare. Då blir det problem i laget. Men om Isak inte spelar tufft, då tycker
  hans pappa inte att han spelar bra. Hur ska Isak hitta rätt spelstil i rinken?Sportklubben är serieromaner
  för alla i mellanåldern som gillar sport och spänning. Rapp dialog och coola illustrationer skapar de
  fartfyllda berättelserna. Böcker att älska och att känna igen sig i – riktiga blandvändare. Isak på
  isen är tredje delen i serien om Sportklubben.Lättlästa böcker från Nypon är ofta något kortare, har
  alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.
