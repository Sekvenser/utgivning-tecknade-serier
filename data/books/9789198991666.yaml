description: Daniel är fem år och han är rädd. Daniel är nio år och han är ensam. Daniel gråter men tårarna
  driver bara på hans mobbare. I en historia där verklighet blandas med fiktion möter Daniel Thollin sin
  barndoms mobbare. Det är 1980- och 1990-tal, en tid där pojkar förväntas slå tillbaka och inte gråta.
  Att visa känslor är inte manligt utan ses som svaghet och en anledning att hacka, reta och slå. Det
  är en skoningslös berättelse där styrkan finns i Bruce Springsteen, Marvelserier och Nintendo.
