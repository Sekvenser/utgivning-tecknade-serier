description: Upptäck den gripande berättelsen om Chang, en ung naturvårdare, och hennes kamp för att rädda
  den gamla elefanten H’non från ett liv i fångenskap. Baserad på en sann historia, lyfter “Rädda H’non"
  fram vikten av naturvård och djurskydd. Författaren Trang Nguyen, en internationellt prisad miljöaktivist,
  och illustratören Jeet Zdung har skapat en bok fylld med värme och vackra illustrationer.
