description: 'Med fem färgstarka personligheter är Ella inte riktigt som alla andra. När som helst kan
  hon byta humör och hårfärg, samtidigt som hon försöker hantera en omtumlande vardag hemma med familjen
  och i skolan. För att få någon ordning på allt behöver hon ta reda på vem hon egentligen är mitt bland
  alla olika känslor och temperament.


  I den fjärde boken om Ella får vi veta mer om de händelser som gjorde att hon valde att byta skola och
  försöka börja om på nytt. Ska Ella äntligen lyckas lämna allt det som hände bakom sig och gå vidare?


  Ella är en fängslande och charmigt tecknad berättelse om identitet, vänskap och mystik, skriven av Kid
  Toussaint och tecknad av Aveline Stokart.'
