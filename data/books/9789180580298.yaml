description: I den sjätte och sista delen av Riad Sattoufs hyllade självbiografi får vi följa Riads liv
  som tonåring, hans steg in vuxenvärlden och gradvisa frigörelse från sin traumatiska uppväxt i en splittrad
  familj sliten mellan två kulturer. Med hjälp av psykoterapi lyckas Riad komma till rätta med sina skuldkänslor
  över det som varit och finner så småningom fram till rätt spår i livet.
