description: En liten sjuk kanin väntar i skogssjukhuset på sin kemoterapi. Av en slump råkar han rädda
  en stor stygg varg från jägarens kulor. Vargarnas hederskodex kräver att vargen nu måste återgälda hjälpen
  och rädda den lilla kaninens liv. Med mycket situationskomik, fartfylld action och bitande sarkasm berättar
  Josephine Mark hur flykten från jägaren förändrar en påtvingad gemenskap till vänskap.
