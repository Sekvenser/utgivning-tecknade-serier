description: En personlig berättelse om selektiv mutism / A personal experience of selective mutism  En
  självbiografisk serieberättelse om Emmas uppväxt med selektiv mutism - en ångestdiagnos som drabbar
  1 av 100 barn och innebär en oförmåga att tala i vissa sociala situationer och med vissa personer –
  oftast utanför hemmet. Barnet har generellt ett fullt utvecklat språk och pratar med sina familjemedlemmar.  Berättelsen
  berättas på både svenska och engelska.
