description: I en historia där verklighet blandas med fiktion möter Daniel Thollin sin barndoms mobbare.
  Det är 1980- och 1990-tal, en tid där pojkar förväntas slå tillbaka och inte gråta. Att visa känslor
  är inte manligt utan ses som svaghet och en anledning att hacka, reta och slå. Det är en skoningslös
  berättelse där styrkan finns att hämta i Bruce Springsteen, Marvelserier och Nintendo.
