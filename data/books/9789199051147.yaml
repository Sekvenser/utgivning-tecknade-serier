description: Med akvarell, blyerts, krita och collage skapar Koch ett lågmält och poetiskt bildspråk där
  människor, djur och landskap existerar sida vid sida – och där gränsen mellan dem ibland tycks lösas
  upp. Berättelserna rör sig mellan kärlek och ensamhet, förändring och tillhörighet, men också kring
  människans plats i naturen och våra försök att förstå andra liv än våra egna. Dialog, tystnad och stora
  öppna ytor får samma betydelse i ett berättande som befinner sig någonstans mellan seriekonst, poesi
  och bildkonst. Aidan Koch är en av den amerikanska alternativseriens mest särpräglade röster. Hennes
  verk har publicerats i bland annat The Paris Review och The New York Times och ställts ut på bland annat
  Whitney Museum of American Art. I dessa tre berättelser visar hon hur seriemediet kan användas för att
  skildra inte bara vad vi ser omkring oss, utan hur vi förhåller oss till den värld vi är en del av.
