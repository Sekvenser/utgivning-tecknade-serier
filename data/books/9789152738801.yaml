description: Sture Hegerfors vitsiga, slagfärdiga, respektlösa, underfundiga och tänkvärda ”P.S.”-teckningar
  från Göteborgs-Posten sitter på kylskåp och anslagstavlor runt om i Göteborg och Västsverige.  Här har
  nu de vitsigaste, slagfärdigaste, respektlösaste, underfundigaste och tänkvärdaste ”P.S.”-teckningarna
  samlats i en historiebok, som avspeglar vad vi roats och oroats av från 1970-talet och framåt. Det handlar
  bland annat om pandemierna, fotbollen, politiken, spårvagnarna och Västlänken.  Möt Sveriges värsta
  Göteborgsvitsare Andesson & Läling!
