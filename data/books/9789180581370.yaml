description: 'Kontorets olycksfågel i högform!


  Ingen går säker när Gaston är i farten, antingen han ägnar sig åt att uppfinna nya maträtter eller försöker
  göra livet på kontoret lite bekvämare för sig själv. I det nya albumet av Lewis Trondheim (manus) och
  Delaf (teckningar) fortsätter Gaston att ställa till med kaos och katastrofer på redaktionen för Spirou-förlaget.
  Gastons hårt prövade arbetskamrater, redaktionschefen Mossberg och direktör Gyllenhammer får verkligen
  passa sig varje gång Gaston får en ny snilleblixt!


  Serien om Gaston, som först var tänkt som en bifigur till Spirou, skapades på 1950-talet av André Franquin,
  en av seriehistoriens främsta tecknare och humorister.'
