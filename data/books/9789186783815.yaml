description: Mot slutet av ett städat och välordnat liv åker en pensionerad familjejurist iväg på sitt
  livs första riktiga äventyr. Inget märkvärdigt äventyr, men för honom är det rena rama Odyssén. Hans
  gamla värkande kropp får stå ut med en hel del i jakten på en förmodad arvtagare när han ger sig iväg
  i en gammal cabriolet som aldrig lämnat garaget. Med sitt underliga resesällskap upptäcker han att det
  aldrig är försent att försöka förstå sina medmänniskor… …eller att upptäcka sig själv.  SYLVAIN VALLÉE
  (Det var en gång i Frankrike) och MARK EACERSALL, som båda erhållit priser på seriefestivalen i Angouleme,
  har slagit sina berättartalanger ihop i denna rörande, humoristiska och poetiska roadtrip.
