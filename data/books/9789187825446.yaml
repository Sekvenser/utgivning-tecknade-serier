description: 'This issue of CBA, the international comics anthology, offers new insights through voices
  of resistance from a neighbor who affects us all: Russia. How were its dreams of democracy shattered?
  How did it go from flaunting extravagant Eurovision stunts to prisoners dying at the frontline in Ukraine?
  From celebrating V-day with Americans on the Red Square to threatening nuclear war. Is it possible to
  steer into other pathways? Through the stories of Russian and ex-Russian artists, these comics share
  rarely heard perspectives on what it means to live within these changes, reflections that are normally
  out of reach for Western readers.'
