description: Invånarna i Ankeborg är en skara färgstarka personligheter. Författaren Maya Åstrup har en
  speciell förmåga att fånga de här unika egenskaperna hos Ankeborgarna, och hennes serier säger något
  väsentligt om figurerna och deras omvärld. I den här boken samlar vi därför hennes bästa serier om alla
  de karakteristiska figurerna och deras särskilda karaktärsdrag för att förklara vem som är vem i Ankeborg.
