description: När Mats farfar dör öppnar familjen för första gången den förslutna och förbjudna svepask
  som alltid funnits i farfaderns hem. Där ligger renmärkesbevis, brev från lappfogden i Västerbottens
  län och foton från renskiljningar. Det visar sig att Mats härstammar från en släkt av skogssamer i Malåtrakten.
  Varför har det varit hemligt? Och varför vet de så lite om sin historia?
