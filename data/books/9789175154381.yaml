description: Vad händer med en relation och en familj när den ena föräldern inte kan hantera sin ilska?
  Mirjas frustration och vredesutbrott över både stort och smått hotar att förstöra hennes förhållande
  till dottern Hanni och partnern Nihad. Vi får också möta Mirjas bästa vän Ellen som inte kan sluta vara
  otrogen mot sin pojkvän. Mirja beskriver dem som "två fuckups". Måste de fortsätta vara det, eller kan
  man bryta negativa mönster? Och vad är en ilskeorm?  I Hårda sanningar vänder Malin Svedjeholm upp och
  ned på existerande vardagsnormer och ställer frågan om förändring alltid är önskvärd eller ens möjlig.
