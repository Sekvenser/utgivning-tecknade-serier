description: Under en resa till Sydney får Tintin, kapten Haddock och professor Kalkyl lift av en mångmiljardär,
  den excentriske Laszlo Carreidas, ombord på hans privata flygplan. Olyckligtvis planerar en brottsorganisation
  att kidnappa Carreidas under resan för att pressa honom på pengar, och ligan tvingar ner planet på en
  ö. Det visar sig snart att det är Tintins ärkefiende Rastapopoulos ligger bakom kuppen.
