description: I Blå lotus fortsätter den unge journalisten Tintin den resa som inleddes i Faraos cigarrer.
  Inför det här albumet började Hergé göra grundliga förstudier för att kunna återge främmande miljöer
  och kulturer på ett realistiskt sätt i serien. I och med albumet Blå lotus tar Hergé, och med honom
  den fransk-belgiska seriekonsten, ett stort kliv framåt.
