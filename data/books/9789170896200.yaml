description: Tänk om århundradets stöld ägde rum i ett nazistiskt koncentrationsläger?   Francisco Boix,
  en spansk pressfotograf och kommunist, flyr till Frankrike efter det spanska inbördeskriget. När Hitlertyskland
  1940 ockuperar Frankrike överlämnas han till de tyska nazisterna som skickar honom till Mauthausen.
  Där smider han en livsfarlig plan för att låta världen få veta sanningen.
