description: Författarens mormorföräldrar kom till Sverige redan 1906, då de undkommit blodiga judepogromer
  i Ryssland. De lyckades skapa sig ett bra liv Västergötland men deras kvarlämnade släktingar kom i princip
  att bli mördade, både före och efter kriget. Johanna ville emellertid ta reda på de släktingar som överlevde,
  vilket ledde till en starkt känslomässig inre resa. Resultaten har blivit en tecknad dokumentärroman
  som ger en inträngande kunskap om både hennes familjs historia och om antisemitism.
