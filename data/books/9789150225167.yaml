description: Akai och Juli är bästa vänner och de har bott på Atmo hela sina liv. När de i hemlighet tog
  sig ner till jorden för att hitta Akais hund hamnade de i trubbel och bara Juli lyckades ta sig tillbaka.
  I denna avslutande bok om Atmosfärbarnen är Akai fortfarande kvar på jorden. Juli försöker övertyga
  alla om att det fortfarande finns människor kvar där nere och att de och Akai behöver deras hjälp.
