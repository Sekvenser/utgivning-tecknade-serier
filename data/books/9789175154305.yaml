description: En internationell äventyrare, krigshjälte och geniförklarad brottsbekämpare. Kriminologen
  Harry Södermans livsöde var fyllt av dramatik. Smeknamnet Revolver-Harry fick han på grund av sina exceptionella
  vapenkunskaper. Efter studier i Tyskland och Frankrike blev Söderman 1934 chef för New Yorks polislaboratorium.
  Efter återkomsten till Sverige fick han ansvar för den nya institutionen Statens Kriminaltekniska Anstalt
  och bidrog till att lösa några av tidens mest uppmärksammade mordfall. Harry Södermans händelserika
  liv skildras här av serieskaparen Jakob Nilsson, känd för sina seriebearbetningar av Stieg Trenters
  klassiska deckare Roparen, Färjkarlen och Sturemordet.
