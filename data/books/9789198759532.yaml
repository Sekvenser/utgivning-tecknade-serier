description: '"Att låtsas är att ljuga" är den belgiska serieskaparen Dominique Goblets principiella huvudverk,
  och hennes första bok på svenska. Goblet föddes 1967 och har publicerats en enda gång på svenska, i
  tidskriften Galago 2006. Denna bok är självbiografisk, och handler om förhållandet till hennes alkoholiserade
  far, samt om ett komplicerat kärleksförhållande. Goblet har givit boken ett gestaltning som på ett förbluffande
  sätt är både lättillgängligt, adekvat, nyskapande och konstnärligt fulländat.'
