description: Vänner får man. Syskon har man. Och bortom dagens frihet finns en annan frihet. De elva novellerna
  i denna elfte bok om Johanna och Eliana spänner över Elianas liv från barndomen till femtioårsåldern.  Patrik
  Rochlings enastående känsla för den ’banala’ vardaglighetens undertexter tolkas suveränt av Li Österbergs
  bildkonst. En bok som för varje omläsning öppnar sig mot nya spår och dofter, och som sakta sjunker
  in hos läsaren.
