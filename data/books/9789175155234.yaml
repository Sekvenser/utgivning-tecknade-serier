description: 'Berglins nya årsbok samlar det senaste årets teckningar och serier av paret som utmärkt
  sig som svenska folkets skarpaste iakttagare. Med vass och dråplig humor låter Jan och Maria Berglin
  sina stornästa figurer kommentera och driva med såväl livets stora frågor som de mest bagatellartade
  problem. Här bjuds på en generös blandning begivenheter från året som gick, från det galopperande guldpriset
  till energikris, sagotransor, lill-chefer och den senaste Skarsgårdaren.


  Jan och Maria Berglins skarpsynta och roande bilder publiceras varje vecka i Svenska Dagbladet och åtta
  andra dagstidningar.'
