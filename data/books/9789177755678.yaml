description: '52 år gammal ska Mats Jonsson skriva förordet till en nyutgåva av sin legendariska serieroman
  Hey Princess, som utkom 2002 och skildrar hans kaotiska ungdomsår i Stockholms indiekretsar på 90-talet.
  När Mats för första gången på många år läser om boken gör han en upptäckt. Det finns en lucka i berättelsen;
  av någon anledning har hans yngre jag utelämnat månaderna mellan juli och oktober 1998.


  Det blir inget förord. I stället kastar sig Mats än en gång handlöst ner i sitt lika bitterljuva som
  solkiga 90-tal och tecknar en ny serieroman som utspelar sig under de där sensommarmånaderna för nästan
  30 år sedan.


  Snarare än en uppföljare blir serieromanen Not Forever till en pendang, en fördjupande variant på ett
  tema. Liksom Hey Princess är det en mörk och humoristisk berättelse om sökandet efter kärlek och sammanhang
  i en ytlig och oförlåtande tid, som nästan trettio år senare snarast framstår som oskuldsfull. En tid
  av osäkerhet, ängslig positionering och mansgriseri, men också av innerlig vänskap, levnadsglädje och
  inomhusrökning. Avståndet i tid ger nya insikter (inte minst om hur dum i huvudet han själv var) och
  boken blir ett försök för Mats att bättre förstå både sig själv och den tid som formade hans generation.'
