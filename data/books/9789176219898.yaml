description: Farbror Joakim, världens rikaste anka, står i fokus i boken som inleds med Carl Barks episka
  serie Tillbaka till Klondike. Joakims bedrifter förklaras utifrån de livsavgörande händelser Barks återger
  i just denna serie. Don Rosa berättar vidare i uppföljaren Sista släden till Dawson om hur Joakims ungdomskärlek
  format hans liv och de minnen han knappt vågar erkänna ens för sig själv.
