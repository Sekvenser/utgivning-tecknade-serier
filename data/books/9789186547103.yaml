description: Jag minns inte vilket år de kom, men plötsligt var de överallt i trädgården. Utan pardon
  och med en hiskelig hastighet satte de i sig alla mina grönsaker, vissa så fort grodden stack upp ur
  marken. Efter ett regn kunde de äckliga små varelserna vara så många att man inte ville gå ut barfota,
  om man trampade på en satt slemmet kvar under foten länge. Jag påbörjade en kamp mot sniglarna som kom
  att uppta mycket av min tid och tankeverksamhet. För att inte gå under av förtvivlan började jag 2017
  att rita serier om mina vedermödor. Man kan ju skratta åt eländet också, tänkte jag. Nu har jag samlat
  dessa totalt fjorton små strippar i den här boken som jag hoppas ska vara till glädje för läsaren, oavsett
  om du har en trädgård eller inte.
