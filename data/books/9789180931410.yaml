description: Vad är riktig lycka?  Wow! Lyckoplaneten är det gladaste stället Astrid och Stella varit
  på! Eller …? Verkar inte invånarna lite spända? Astrid och Stella ger sig ut på ett nytt rymdäventyr
  när den bråkiga Kisse Klös smider nya planer och en superstjärna försvinner från hår-planeten. Men det
  är inget lite magi och vänskap inte kan råda bot på!  Hur vet man om någon är glad på riktigt? Och vad
  kan man göra när andras förväntningar på en själv inte matchar ens egna?
