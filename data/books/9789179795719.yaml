description: 'Tidernas största rymdäventyr som seriebok! På över tvåhundra sidor berättas här historien
  om Anakin Skywalkers uppgång och fall, från hans tid som begåvad Jedi-lärling till hur han blev en av
  de mest fruktade utövarna av Kraftens mörka sida. Det är en episk science fiction-saga full av äventyr,
  dueller med ljussablar och rymdstrider, där Anakins tragiska öde ska visa sig förödande för dem han
  älskar mest – Obi-Wan Kenobi och Padmé Amidala – och i slutändan för hela galaxen. Här får vi nämligen
  vara med om den galaktiska republikens förfall till politiskt kaos, och hur den ondskefulle Kejsaren
  Palpatine manipulerar sin väg till oinskränkt makt.Star Wars episod I-III är prequel-trilogin till de
  klassiska filmerna om Luke Skywalkers och rebellernas kamp mot Darth Vader och Imperiet (episod IV-VI).
  Den grafiska romanen återberättar i serieformat Star Wars-filmerna: ”Episod I - Det mörka hotet”, ”Episod
  II - Klonerna anfaller”, och ”Episod III - Mörkrets hämnd”.Den älskade Star Wars-sagan är en klassisk
  berättelse om kampen mellan gott och ont. Mot en bakgrund av politiska intriger och maktspel utforskas
  mänskliga teman som förlust, kärlek och lojalitet, och hur våra val kan få en avgörande betydelse.'
