description: 'För min syster, din syster, våra systrar – för friheten!


  Den 16 september 2022 grips den kurdisk-iranska studenten Mahsa Amini av den iranska moralpolisen. Det
  påstådda skälet är att hon inte anses ha burit sin huvudduk på korrekt sätt. Under arresteringen blir
  hon så misshandlad att hon dör två dagar senare.


  22-åriga Mahsas död utlöste en aldrig tidigare skådad protestvåg, som snart spred sig över hela landet
  och utanför dess gränser. Irans regim försökte hårdhänt stoppa protesterna, och flera människor uppges
  ha dödats.


  Marjane Satrapi (skaparen av den sjävbiografiska serieromanen Persepolis) har samlat sjutton tecknare
  från Iran, Europa och Amerika tillsammans med tre Iran-experter – statsvetaren Farid Vahid, journalisten
  Jean-Pierre Perrin och historikern Abbas Milani – för att placera in de historiska händelserna i sitt
  sammanhang och vittna om en fundamental kamp för friheten.


  »Regimen kommer att falla, för den är för länge sedan död i människornas medvetande.« — Marjane Satrapi'
