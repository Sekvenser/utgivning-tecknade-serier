description: 'Ishockeymästerskapet närmar sig med stormsteg. Jackson och hans lag, Leoparderna, har tränat
  stenhårt och i år har de chansen att bli mästare! Men Jackson har en klump i magen. För att vinna behöver
  de besegra Vildhundarna. Och Archer. Jackson har inte pratat med sin barndomsvän, Archer, sedan han
  lämnade Leoparderna för att spela i Vildhundarna. Sveket bränner fortfarande inom Jackson och trots
  att han saknar sin vän vill han också vinna över honom. Under ett möte utanför ishockeyrinken har vännerna
  chansen att begrava stridsyxan en gång för alla men i stället blir grälet värre än någonsin. Och snart
  möts de på isen i en rafflande och bråkig match. Vad är egentligen starkast: vänskapen eller viljan
  att vinna?'
