description: Systrarna Lucille, Sara och Cassiopeja är på sommarläger vid kusten. När en enorm val blir
  strandad i sanden får Lucille en känsla av att den vill varna om en stor fara. Hennes oro delas dock
  inte av de andra. Men det finns en legend om att den kvinna som bodde i fyren efterlämnade en skatt.
  Kommer systrarnas detektivklubb att lyckas reda ut vad som är legend och sanning?
