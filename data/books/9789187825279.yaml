description: The pandemic was supposed to have a deadline, most of us agreed on a year. CBA deadlines
  are like the pandemic:we’re still open for submissions for the theme PLACEHOLDER. The world is paused
  for an indefinite time. What does this do to our experience of our existence? How do we replace our
  routines? We’re waiting, and in our wait, we imitate the “real” we hope will soon return. Like placeholders
  in our own lives.
