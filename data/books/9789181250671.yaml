description: Fast i bokenAlice hittar en bortglömd bok i hyllan och sugs in direkt. Bokstavligen. Hon
  fastnar i boken på sidan 7. Men hon är inte ensam. Fler läsare har fastnat där! På nästa sida lurar
  nämligen en hemsk drake. Och Alice måste ta till alla knep i boken för att ta sig vidare med sina nya
  vänner. Den som kämpar med läsningen kommer att fastna direkt. För den här serien alltså. Den här boken
  suger skildrar läsprocessen i ett magiskt äventyr och finurlig lek med boken som medium. Humor och fängslande
  handling för läsaren framåt i berättelsen – trots att vi är fast på sidan 7, uppslag efter uppslag!
  Det magiska biblioteket är en fristående grafisk roman-serie med mycket värme.  Hegas lättlästa böcker
  väcker läslusten hos barn och unga.
