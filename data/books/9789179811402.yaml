description: 'Episkt rymdäventyr som seriebok! När Kraften vaknar börjar kampen om galaxens frihet på
  nytt. Möt både gamla och nya hjältar i trilogin som tar vid efter Jedins återkomst.Imperiet besegrades
  för 30 år sedan, men mörka krafter är åter i rörelse. När skrotletaren Rey träffar en droid på flykt
  dras hon in i en konflikt som spänner över hela galaxen. Leia leder fortfarande motståndsrörelsen, och
  snart måste alla de gamla hjältarna – Luke Skywalker, Han Solo och Chewbacca – ta upp kampen mot ondskan
  en sista gång.Samlingsvolymen innehåller:”Star Wars: Episode VII - The Force Awakens”, ”Star Wars: Episod
  VIII – The Last Jedi”, och ”Star Wars: Episode IX – The Rise of Skywalker”.'
