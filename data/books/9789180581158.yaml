description: 'Prinsessan Nausicaä tar med sig den gigantiska krigaren till Shuwas krypta, för att ta reda
  på vilka hemligheter som legat gömda där sedan Infernots sju dagar. Men det finns många som vill förhindra
  att Nausicaä slutför sitt uppdrag, till och med kryptans egen väktare.


  Det tog mästerregissören Hayao Miyazaki över tolv år att färdigställa Nausicaä från Vindarnas dal, som
  avslutades 1994. Mangan blev en succé i Japan och den blev också förlaga till en populär tecknad film.
  Framgångarna ledde till grundandet av filmbolaget Studio Ghibli, som sedan blivit världsberömt för filmer
  som Spirited Away och Pojken och hägern. Den svenska samlingsutgåvan av Nausicaä från Vindarnas dal
  ges ut i fyra delar.'
