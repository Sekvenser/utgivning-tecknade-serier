description: 'Liv Strömquists tionde seriealbum är en självhjälpsbok mot självhjälp.Vi lever i en kultur
  som mer och mer handlar om att optimera vår hälsa för att leva länge, men som fortfarande saknar svaret
  på VARFÖR vi bara ska fortsätta pinna omkring på klotet så extremt jävla länge som det är fysiskt möjligt.I
  sin nya bok ger Liv Strömquist sju livsråd för att hjälpa mot livsråd. Vi möter experter, förebilder
  och livsrådgivare, som på olika sätt ägnat sig åt att ge råd: Ronald Reagans astrolog Carrol Righter,
  vars två vanligaste horoskopråd var ”var snygg” och ”var glad”, 1300-talshelgonet Katarina av Siena
  som svälte sig själv till döds, hertiginnan Meghan Markle som skrev ner levnadsråd på bananer till hemlösa
  sexarbetare, manfluencern Rollo Tomassi som ger män rådet att stå helt stilla i hallen för att hålla
  kärleken vid liv, instagrampsykologen Nicole LePera som uppmanar oss att sätta gränser för människor
  som exploaterar vårt emotionella kapital – och så den karibiske cirkusartisten Ludger Sylbaris, vars
  absolut bästa livsbeslut var att gå ut på stan, bli full och starta bråk.Med hjälp av filosofer, psykologer,
  sociologer och poeter diskuterar Liv Strömquist – som alltid med träffande humor och en knivskarp blick
  på samtiden – hur vi ska leva och varför.'
