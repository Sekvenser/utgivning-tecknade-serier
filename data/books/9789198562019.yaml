description: Spelnörden Mauro förklarar att om de dör i spelet så dör dem även i verkligheten! Denna skrämmande
  information splittrar tjejkompisarna i två grupper. Lumias grupp försöker lista ut hur de ska återställa
  verkligheten snarast, medan Novas grupp bestämmer sig för att levla upp och bli starkare. Vad ingen
  förväntar sig är slutbossen Kalamitas! Kommer de kunna ta sig igenom det här levande? Och om de gör
  det … kommer de någonsin att bli vänner igen?
