description: När Tabby Simons pappa hittas död under ett gammalt träd som ger ifrån sig en mystisk dimma
  bestämmer hon sig för att ta reda på vad som har hänt. Dimman leder henne till en portal och innan hon
  vet ordet av befinner hon sig i en avlägsen värld full av magi – planeten Rema. Medan Tabby söker efter
  sanningen om sin pappa försöker den blåhåriga remanen Philip hjälpa henne att ta sig hem igen.
