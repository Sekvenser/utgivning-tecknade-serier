description: Hur borde man bete sig på ett konstmuseum (eller här i världen överlag)? Och varför är konst
  så konstigt? Vad händer om man inte fattar något alls? Lumi och Niki, 14 år gamla och best friends forever,
  åker till Helsingfors. Det viktigaste med resan är naturligtvis att komma bort från ”Fisboda” men de
  ska också titta på Lumis kusins konstverk som blivit valt (!!!) till en utställning på ett stort konstmuseum.
  Kusinen har bara inte gått med på att berätta hur verket ser ut. Konstmuseet är ändå inte riktigt vad
  Lumi och Niki hade förväntat sig. Vad gör fotis-Alfa från nian där? Vad händer om man tar en tupplur
  i museet? Kommer Lumi och Niki någonsing att hitta kusinens konstverk mitt bland apokalypshästar och
  alla underliga performanser?
