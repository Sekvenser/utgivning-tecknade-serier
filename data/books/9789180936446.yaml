description: Rymdäventyret fortsätter!Vad gör man när ens wifi försvinner, mitt ute i rymden? Om man är
  Astrid och Stella beger sig man sig till en ny tokig planet fylld av roliga datorspel. Men är det verkligen
  kul att spela spel utan regler? Och vad är grejen med alla mardrömmar på den mystiska Dröm-planeten?Kan
  vänskap stå emot orättvisor och besannade rädslor? Det utforskar vi i ett nytt kosmiskt äventyr fylld
  av humor och färgstarka serierutor. För den som älskar rymden, tokiga djur och datorspel! Drömmar och
  datorspel är den sista fristående delen i serien Astrid och Stella. Hegas lättlästa böcker väcker läslusten
  hos barn och unga.
