description: Vid 83 års ålder har Pierre Christin som tillsammans med Jean-Claude Mézières 1967 skapade
  Linda och Valentin skrivit en ny berättelse om de båda rumtidsagenterna. Eftersom vännen och kollegan
  Mézières tog farväl av jordelivet i januari 2022, har Christin denna gång allierat sig med Virginie
  Augustin, den första kvinnliga tecknare som gett sig ut i rumtidens kringelkrokar.
