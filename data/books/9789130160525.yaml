description: En septembermorgon 1999 hittas tre män skjutna vid Klippan i Skåne. Några dagar senare grips
  musikentreprenören Ricard och döms mot sitt nekande. Berättelsen bygger på intervjuer med närstående
  om livet före och efter det som hände. De är anhöriga, gamla kollegor och barndomsvänner, en polis,
  en domare, en präst och mördaren själv. Ricard själv berättar varför han 13 år efter domen till slut
  erkände allt. Dokumentär serieroman.
