description: Sayed sitter på bänken med sin papegoja och lyssnar på musik. Florence slår sig ner bredvid
  honom och berättar om sina bekymmer med sin man Erik. Hon märker inte att Sayed inte hör, att det i
  stället är papegojan som svarar. När hon går därifrån känner hon sig lyssnad på och mycket gladare.
  Efter henne kommer Erik och gör samma sak. Han slår sig ner och är bekymrad över att hans fru Florence
  är arg på honom.
