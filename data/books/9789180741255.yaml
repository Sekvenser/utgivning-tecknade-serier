description: Carl Barks skapade Ankeborg, befolkade staden med de figurer vi älskar och gav dem liv och
  karaktärsdrag, svagheter och styrkor, vänskap och konflikter. Don Rosas ändlösa beundran av Carl Barks
  verk resulterade i geniala uppföljare till Barks klassiska serier, vilka fått en helt ny generation
  att älska Ankeborgs universum på ett helt nytt sätt, kanske än mer anpassat våra dagar. I Originalen
  och uppföljarna samlar vi några av Barks mest klassiska berättelser tillsammans med Rosas uppföljare
  och sätter dem i ett sammanhang, levandegjort med insiktsfulla tankar från Don själv.
