description: I "Anna" målar Mia Oberländer porträtt av tre generationer kvinnor, som alla heter Anna och
  som var på olika sätt trotsar samhällets normer. Alltför fria kvinnor i en alldeles för liten by, där
  de tar för mycket plats såväl psykiskt som fysiskt.  Med en vacker formmässig uppfinningsrikedom berättar
  Mia Oberländer om dessa tre atypiska livsbanor (delvis inspirerad av sin egen familjs historia) och
  bygger kring denna säregenhet - storleken på kvinnorna i hennes familj - en vacker berättelse med sociologiska
  accenter,  med fokus på konflikter och missförstånd mellan generationerna såväl som till normerna i
  ett samhälle vars dogmer så lätt vänds upp och ner. Med ett skarpt öga och  en bitande ironisk humor,
  som lyfter fram många av de motsättningar som styr våra sociala relationer, vittnar Mia Oberländer om
  hur minsta skillnad i ett ganska standardiserat  samhälle kan ändra livsvägar
