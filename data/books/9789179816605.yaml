description: Mer kaos, knas och kat(t)astrofer med världssuccén Hundmannen!Måttet är rågat hos Borgmästaren!
  Han har fått nog av Hundmannens hundvanor (gräva upp rabatter, tugga på saker, dregla ...) och ger honom
  sparken! Hundmannen får städa av skrivbordet, lämna in polisbrickan och lämna sitt älskade polishus.
  Men en riktig hjälte ger inte upp. Med hjälp av sina vänner vädrar han en ny möjlighet för att klösa
  sig tillbaka till poliskåren!Dav Pilkeys älskade berättelser om Hundmannen och Kapten Kalsong lockar
  till läsning med sin knasiga humor. På köpet får man bra ordförråd, uppmuntras att skapa egna berättelser
  och positiva teman som empati, vänlighet, tålamod och vikten av att göra gott!
