description: 'När den hyllade serieskaparen Anneli Furmark tecknar serier är människor och relationer
  i fokus. Som bildkonstnär fångar hon istället landskap, vacker tomhet och stämningar. Några människor
  syns inte till. Det är stillbilder av platser som kanske är helt övergivna, eller så har någon just
  passerat och försvunnit ur bild.


  Januarikala träd inbakade i snö, Vännäs kyrka i sken av gatlyktor en decembernatt, knallorangea lönnar
  mot en blygrå himmel eller ett litet torp som hukar under magnifika tallar vid en sjö. Det är bilder
  som utgör ett slags andningspauser i bebyggelsen och i tiden.


  Furmarks väggkalender innehåller 12 fantastiska bildkonstverk. Motiven är hämtade från framför allt
  Västerbotten och Ångermanland, men också västkusten och Malmö. Tekniken är blandad; kritor, färgpennor
  och akvarell.


  Furmarks väggkalender fungerar som en väggkalender under hela 2027, men bilderna kan sedan ramas in
  och bli konstverk som räcker under många år.'
