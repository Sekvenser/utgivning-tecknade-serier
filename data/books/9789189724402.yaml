description: Vad gör man när världen är paralyserad. Stadsministern har permiterat sig själv och ingen
  riktigt vet vad som skall göras. Handbromsen i affärslivet är hårt åtdragen och storebror ser dig oavsett
  om mobilen är på eller av. Andas in, andas ut och titta inte ned i brunnen utan titta upp. Se på den
  klarblå himmeln och de tidiga svalorna som ystert jagar sina flugor i krispig försommarsol och njut
  av att bara finnas till. Så, nu är djupsinnet slut. Nu är det dags att se på världen med förundrad blick
  och försöka förstå hur de tänker... de där andra som också lever här i världen.
