description: Tintin, kapten Haddock och Dupondtarna reser till Syldavien för att besöka Professor Kalkyl
  och beskåda hans nya uppfinning, men något går snett under flygresan. Planet fattar eld, men Tintin
  lyckas nödlanda och senare får de hjälp av barnen Niko och Nouchka. Flera andra figurer från Tintinserien
  dyker också upp i äventyret, som Bianca Castafiore och Tintins ärkefiende Rastapopoulos.
