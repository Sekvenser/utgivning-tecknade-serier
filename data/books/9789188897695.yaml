description: Haddock, Kalkyl och Tintin är på semester i den fiktiva orten Vargése i de franska Alperna.
  Under ett lugnt parti schack på hotellet somnar Tintin och drömmer att hans vän Tchang Tchong-Jen, som
  han lärde känna i äventyret Blå Lotus, behöver hjälp. När Tintin sedan får se att ett flygplan störtat
  över Tibet anar han att Tchang är i fara och bestämmer sig för att omedelbart resa till Tibet.
