description: I en värld av frid och fröjd klarar en man att stå emot.  Tecknade serier kan erbjuda läsaren
  sylvass satir, relaterbar diskbänksrealism, psykologiskt bråddjup, storslagen eskapism och samhällskritik
  med politisk slagkraft.De kan även erbjuda ett jävla as som är taskig mot allt och alla.  Detta album
  utgör en komplett samling av Oscar Hjelmgrens beryktade pantomimserie En ful fisk, ökänd från bland
  annat Sydsvenskan och Göteborgs-Posten. Förutom de 86 stripparna bjuds det också på berättelsen om seriens
  uppkomst och ett fritt fabulerande förord signerat det litterära stjärnskottet ChatGPT.
