description: I fem tecknade berättelser och över trettio intervjuer gestaltar Joanna Rubin Dranger en
  outforskad erfarenhet av att leva med dold judisk identitet i Sverige. En ung kvinna berättar att hennes
  farfar raderat alla spår av sin bakgrund, så att familjen inte ska gå att identifiera som judar ”om
  det skulle hända igen”. Det dolda arvet har i tre generationer skapat spänningar i familjen. Ett annat
  exempel är hen som varken berättar för vänner eller kollegorna på förskolan om sin judiska identitet,
  trots ett i övrigt normöverskridande liv. En bok om en erfarenhet många kan känna igen sig i, om att
  på olika sätt moderera sin annanhet och inte till fullo kunna vara den man är.
