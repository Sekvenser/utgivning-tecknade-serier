description: En mystisk profetia har pekat ut Clay som en av de fem unga drakar som en dag ska lyckas
  förena Pyrrhias drakstammar och avsluta det långa kriget. Clay bryr sig inte särskilt mycket om gamla
  profetior, men han kan inte tänka sig ett liv utan sina fyra bästa vänner. Så när en av drakarnas liv
  är i fara bestämmer de sig för att lämna berget där de vuxit upp för att ta ödet i egna händer.
