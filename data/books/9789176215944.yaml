description: Få svenska figurer är så älskade och ständigt aktuella som Åsa-Nisse. Manusförfattaren Pidde
  Andersson och tecknaren Patrik Norrman började 2016 skapa nya Åsa-Nisse-serier med en modern prägel,
  och vi samlar nu ett urval av deras sjövilda äventyr i denna lyxiga hyllningsbok. Deras version av Åsa-Nisse
  har kallats såväl retro-cool som hipster-Nisse och lär inte göra någon besviken.
