description: Hayao Miyazakis mästerverk om prinsessan Nausicaä utspelar sig tusen år efter Infernots sju
  dagar, när jorden till stora delar täckts av en skog vars giftiga sporer gör luften svår att andas.
  Nausicaä bor i en fridfull dal mellan olika riken som slåss om jordens sista naturresurser, men när
  en stor farkost kraschlandar i Vindarnas dal blir det svårt för invånarna att undvika konflikterna.
