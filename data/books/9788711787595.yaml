description: Rasmus Nalle och hans vänner är ute till sjöss och då kan allt hända. När lille Sköld blir
  förkyld får han ligga till sängs ett par dagar. Under tiden bygger Rasmus och Pingo tre jollar av en
  gammal tunna. Den ena jollen får Sköld när han tillfrisknat och de två andra ska Rasmus och Pingo ro
  i. När de ror iväg träffar de fru Strömming som blir så förtjust i jollen att Rasmus ger den till henne.Carla
  Hansen (1906-2001) var en dansk författare. Tillsammans med sin man, illustratören Vilhelm Hansen (1900–1992)
  skapade hon den oerhört populära serien om Rasmus Nalle (på danska Rasmus Klump). Serien startade i
  tidningar i Danmark, men blev snart tryckt i bokform och spridd till andra länder.Efter att Rasmus Nalle
  hittat en gammal fartygsratt på en soptipp får han hjälp av sina vänner att bygga ett skepp. På skeppet,
  som de döper till Mary, reser de sedan runt i världen och upptäcker nya fantastiska platser.
