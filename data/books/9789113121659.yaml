description: 'Visste du att Melania Trump är en typisk oxe – bäst av alla tecken på att härda ut? Att
  Boris Johnson är tvilling – zodiakens fladdriga pratkvarn? Vet du skillnaden mellan en rigid stenbock
  och en flippad stenbock? Och vet du vilket tecken som är så hänförande och bedårande att vi inte märker
  att de egentligen bara totalt fuckar oss? Liv Strömquist är tillbaka med ett humoristiskt, satiriskt
  seriealbum, som med stjärntecken som ram roastar mänskligheten. I den här boken får du läsa om en rad
  personer, vars handlingar och livsöden förklaras utifrån deras stjärntecken: läkemedelstillverkaren
  Arthur Sackler, den psykoanalytiska pionjären Sabina Spielrein, rapparen Flavor Flavv, drottning Kristina
  och den brittiske designern som övergav mänskligheten och började leva som get i Alperna är bara några
  exempel. Som ingen annan skildrar och speglar Liv Strömquist den värld vi lever i, samtidigt som hon
  sätter fingret på samtidens – och våra egna – ömma punkter. En astrologibok även för dig som hatar astrologi.'
