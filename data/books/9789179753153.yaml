description: '"Hundmannen" är Dav Pilkeys nya superhjälte. Efter tolv spännande och skruvade äventyr med
  Kapten Kalsong är det dags för denna sammansatta karaktär att göra entré!Vad får man om man syr ihop
  en trasig polishund med en trasig polisman? Hundmannen! En stark mänsklig kropp ihopsydd med en smart
  hundhjärna blir ett vinnande koncept! Polischefen är till en början skeptisk till detta håriga tillskott
  i polisstyrkan. Men snart inser även han att lagens långa arm kan ha nytta av en polis som både kan
  sniffa upp skurkaktigheter och samtidigt pinka in stadens revir. Frågan är bara om Hundmannen klarar
  av att ständigt välja plikten framför allt, med tanke på det vilda inom honom ...Dav Pilkey låter huvudpersonerna
  från Kapten Kalsong, George och Harold, berätta även denna historia. De gör det som vanligt på sitt
  ytterst infallsrika och humoristiska sätt, resultatet blir stor läsglädje för både lässvaga och läsvana.
  Och särskilt för serieälskare, för nu blir det 100% serie och 100% färg!'
