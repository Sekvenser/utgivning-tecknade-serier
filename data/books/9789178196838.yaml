description: Marie-Louise Ekman skapade serien Arty Stiffneck för Aftonbladet 1994. Tanken var att ta
  upp aktuella ämnen som identitet, kommunikation och önskan om att passa in. Dialogen kretsar kring relationer
  och den osäkerhet som kan uppstå när man pratar förbi varandra. Det är en berättelse om en lite sorglig
  figur gestaltad med stor kärlek och humor. Här återges samtliga 13 delar om Arty Stiffnecks liv, vissa
  aldrig tidigare publicerade. "Vilken självsäker drygputte han är, denne Stiffneck! Söker ständigt bekräftelse,
  fast han behandlar sin omgivning som luft. Och är ändå en rörande figur, som väcker ens medkänsla."
  - Magnus Bons, Konsten.net
