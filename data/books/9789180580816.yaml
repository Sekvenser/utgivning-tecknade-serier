description: Striderna rasar i Cyfandir. Drottning Boadicé slåss för sitt liv och sitt rikes framtid,
  medan Ocoho har tagits tillfånga på handelsbaronernas luftskepp, där hon brottas med ett oväntat avslöjande
  om sin vän Mordred. Innanför stadens murar står Melie öga mot öga med taumaturgen Liselotte, samtidigt
  som Seth och den mäktiga inkvisitorn Santori möts i en hård kamp ute på slagfältet.
