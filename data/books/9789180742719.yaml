description: 'Äventyr, spänning och humor i 14 nervkittlande berättelser från 1965.


  I den här boken är Kalle lägerledare, på skattjakt och företar sig resor till lands och till sjöss.
  Vare sig han hjälper farbror Joakim eller hamnar i trubbel själv så gör han det med sin sedvanliga neurotiska
  frenesi. Han får sällskap av Knattarna, professor Ludwig von Anka, och för första gången Jack och Gus,
  Askungens två små musvänner. Dessutom hjälper Korpus Musse Pigg och tillsammans med Atominus råkar han
  ut för Svarte-Petter i serien Ett hårdkokt rymdägg .'
