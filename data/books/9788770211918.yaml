description: När William Howard Russell, den förste moderne krigskorrespondenten, anländer till Amerika
  för att skildra det stora inbördeskriget är det självklart Blutch och Chesterfield som får uppdraget
  att bli hans livvakter.  Men vad händer när båda sidor i ett krig tröttnar på en sanningssägare? Kommer
  våra vänner att klara av att skydda honom mot en kombinerad styrka av nord- och sydstatssoldater? Och
  hur ska det gå för det barnhem som riskerar att hamna mitt i korselden?
