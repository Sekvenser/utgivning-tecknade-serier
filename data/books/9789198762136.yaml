description: Den unga adelsdamen Violette har fängslats för ett fruktansvärt brott mot sin halvsyster.
  Med djup ånger önskar hon att hon hade gjort andra val. Och när hon efter en plötslig ljustblixt vaknar
  upp i sin egen säng ett år tillbaka i tiden får hon också chansen att göra det! Men varför får alla
  hennes fina planer helt andra resultat än vad hon räknat med...?
