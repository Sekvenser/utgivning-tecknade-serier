description: En dag ger Linneas pappa henne en spelande glaskula som en gång tillhört hennes nu försvunna
  mamma. Föga anar hon att kulan snart leder henne till en magisk värld, där sökandet efter hennes mamma
  tar sin början. På vägen upplever hon fantastiska äventyr och träffar magiska varelser, som lär henne
  om vänskap, fiender och om att bli vuxen.
