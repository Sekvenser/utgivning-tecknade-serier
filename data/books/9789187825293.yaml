description: 'New issue of the international comics anthology CBA:  Uncomics – an artistic field where
  contemporary art and comics inform each other. Where the absence of sequence encourages the reader to
  investigate the picture plane(s) in any direction and order, becoming an active co-creator in the process.
  A space outside the tedious limitations of story, where images both abstract and suggestive interact.
  Comics, at last, as a visual art form.'
