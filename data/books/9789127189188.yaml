description: I serieboken Vi som kom – sju berättelser om flykt möter vi sju livsöden som en gång korsade
  hav, gränser och språk. De kom till Sverige som barn och tonåringar, undan krig, förföljelse och politiskt
  våld i länder som Iran, Syrien, Somalia, Afghanistan, Ukraina och Palestina.Alexandra Pascalidou har
  lyssnat till deras berättelser om flykten, om ankomsten, om det som började om.
