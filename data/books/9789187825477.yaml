description: 'One day, Gregor Samsa woke up and found himself transformed into an insect. Do you think
  that bugged him? Puns aside, insects are fascinating. Many people find them disgusting and associate
  them with filth and decay, but without them we wouldn’t have anything to eat, considering they’re also
  the main pollinators of our plants. How could we survive in a world with no bugs? Then again, fleas
  were quite significant in spreading the plague. Insects are hailed as the protein of the future and
  shunned as vectors of disease. They’re pests, pets and objects of fear and fascination. But they aren’t
  the only kind of bug out there. If you’re sick, you’ve caught a bug. If your computer program doesn’t
  run as intended, it’s due to a bug. If you experience a glitch in the matrix, there might be a bug in
  the very fabric of our reality. If something is bugging you, you can’t stop thinking about it. And remember:
  shrimp are also bugs. Comics by: Aiden Kvarnström [SE], The Chemical Jam [IT], Matteo Galasso [IT],
  Angela Schmold [CA], Monica Nielsen [SE], Sandra G [RS], Adrián A. Astorgano [ES], Jon Högman [SE],
  Susanne Johansson [SE], Vlad Gaast [PT], Jason Song Quinn [US], Mattias Elftorp [SE]. Text & illustration
  by: Mattias Elftorp [SE]. Cover & main editor: Aiden Kvarnström [SE].'
