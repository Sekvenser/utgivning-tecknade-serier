description: Arne Elefant och Emma Gasell levde ett stillsamt liv på den afrikanska savannen, när de en
  dag hittade en mobiltelefon som några safariturister tappat. I den fick de höra om en människoskapelse
  som hette ”stad”. Arne och Emma började längta till denna underbara plats. En vacker dag ger de sig
  av över savannen … men för att komma till staden blir de tvungna att flyga med människornas flygplan.
