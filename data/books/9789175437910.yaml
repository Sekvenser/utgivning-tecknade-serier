description: En sista strid genom tid och rum!  Skuggorna tar över i Alledia. Emily har äntligen förstått
  amulettens kraft och beger sig till Tyfon för att hjälpa Navid och mamma. Samtidigt är prins Trellis
  på väg mot Älvornas kungarike för att överta tronen. Stenväktarna enas och måste ta hjälp av alla sina
  vänner när mörkret hopar sig inför den sista striden.
