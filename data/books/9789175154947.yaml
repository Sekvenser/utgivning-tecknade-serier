description: Systrarna Gyllenspets har blivit inbjudna till ett bröllop på en ö och Cassiopeja ser verkligen
  fram emot festligheterna. Sara följer motvilligt med och hittar snart en lika missnöjd bundsförvant
  i brudens dotter Aurélie. Men pusselbitar med gåtfulla budskap döljer sig på ön, och när Sara tar hjälp
  av Aurélie för att söka efter ledtrådar splittras för första gången sammansvetsade trio.
