description: 'Maja, Hugo och broccolizombien är förväntansfulla: snart är det dags för den årliga byfesten
  och då ska det firas med ett rejält fyrverkeri. Men krutet, som behövs för fyrverkerierna, är slut.
  För att rädda festen bestämmer sig de tre vännerna för att fixa fram nytt krut. De beger sig till Creeper-dalen
  och hoppas att de farliga varelserna lämnar efter sig tillräckligt mycket pulver innan de exploderar.
  Äventyret kan börja!'
