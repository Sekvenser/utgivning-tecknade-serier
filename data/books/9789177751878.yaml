description: Vem laddar elsparkcyklarna, levererar paketen och gräver gravarna på kyrkogården på undermåliga
  kontrakt? I Tommy Sundvalls satiriska äventyrsserier är det Morris, John och Hunter som gör det. I en
  ständig men hopplös jakt på pengar försöker de försörja sig på olika gig. På deras äventyr i senkapitalismen
  får vi följa med på dödgrävarmöte, Finlandsfärja och roadtrip till Pajala.
