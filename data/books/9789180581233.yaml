description: 'Utökad jubileumsutgåva i stort format!


  Det kalla kriget når ända fram till det lugna Moulinsart, när de rivaliserande grannländerna Syldavien
  och Bordurien båda vill åt professor Kalkyls senaste uppfinning. Då Kalkyl försvinner under resa till
  Schweiz måste Tintin, Milou och kapten Haddock på nytt rycka ut för att rädda sin vän. Samtidigt gör
  den påflugne försäkringsagenten Serafim Svensson entré i serien.


  I år är det 70 år sedan Det hemliga vapnet först publicerades som följetong i den belgiska serietidningen
  Tintin. Denna version skiljer sig markant från det ordinarie albumet beträffande text, bild och färgläggning
  – i synnerhet de sista 19 sidorna i liggande format. Jubileumsalbumet innehåller också ett förord som
  berättar om bakgrunden till detta spännande Tintinäventyr, influerat av såväl Hitchcock-thrillers som
  kraftmätningen mellan öst och väst.'
