description: 'Tintin och Milou upptäcker märkliga burkar som ska innehålla krabba, men det visar sig vara
  opium som smugglas! Jakten på opiumligan tar våra vänner ända till Saharas öken och Marocko. Under resans
  gång möter Tintin en försupen sjökapten som med tiden blir hans bäste vän: den koleriske och whiskytörstande
  kapten Archibald Haddock.'
