description: '"När pandemin slog till våren 2020 ställdes livet om helt för oss alla - men kanske mest
  för de äldre, som var vana att resa fritt och umgås med vänner och familj. För Gittan Jönsson och Kristina
  Abelli Elander skapade den nya vardagen ett nytt sätt att umgås och att kommunicera på: de började brevväxla
  med varandra i form av tecknade serier. Detta album av konstnärerna och serietecknarna Gittan Jönsson
  och Kristina Abelli Elander gjordes under tiden sompandemin pågick, när vi fort farande inte visste
  någonting: hur det skulle gå, vad som skulle hända imorgon, om vi allåskulle dö, om ekonomin skulle
  kollapsa, om vi någonsin mer skulle kunna gå på en konsert. Som Gittan skriver i sitt första brev till
  Kristina: "Tiden har stannat. Allt är inställt. Ensamhet. Ett krig pågår. Hur länge?" Ur Liv Strömquists
  förord"--förlagstext'
