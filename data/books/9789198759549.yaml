description: Denna självbiografiska serieroman skildrar hennes erfarenheter av klinisk depression under
  sin ungdom, hur hon långsamt glider ner i hopplöshetens träsk, för att sedan efter kontakter med psykvården
  komma på fötter igen. Emmi Valve visar även upp ett imponerande handlag av färgen - som sedermera spelar
  en viktig roll i hennes kamp för att leva ett "normalt" liv - vilken hon använder för att gestalta känslor,
  och mycket ofta av ångest och mörker.  "Nåden" är den finska serietecknaren Emmi Valves debut i bokform
  på svenska, men hon publicerades fortlöpande på svenska i tidskriften Det Grymma Svärdet medan 2015
  och 2019.
