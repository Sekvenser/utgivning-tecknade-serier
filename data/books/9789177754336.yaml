description: Hur tar man sig framåt när man redan har nått över kulmen? När är man egentligen passé? Och
  hur långt är det okej att gå i jakten på erkännande? Pelle Forsheds bok Club Lonely är en verklighetsnära
  serieroman om att tappa hoppet och att känna sig passé. Med enkla färger och den klara linjen tecknar
  Forshed en berättelse om Stockholm, självtvivel och ängslighet.
