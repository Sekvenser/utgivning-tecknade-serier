description: I femton personliga berättelser skildrar den franska serieskaparen Pénélope Bagieu avgörande
  händelser från sin uppväxt fram till vuxen ålder. Med lätt hand blandar hon humor med starka känslor
  och det till synes vardagliga med djupaste allvar. I lager på lager samlas insikter och erfarenheter
  som tillsammans ger en bild av författaren och visar vad som har format henne till den hon är i dag.
  Pénéope Bagieu slog igenom år 2007 med den tecknade bloggen Ma vie est tout à fait fascinante där hon
  humoristiskt och träffsäkert skildrar vardagen för en ung kvinna i Paris. I Culottées som kom 2016 porträtteras
  inspirerande kvinnor som gått sin egen väg. Boken blev en stor succé och har översatts till ett tjugotal
  språk. Bagieu har på senare tid också riktat sig till barn med nytolkningen av Roald Dahls Häxorna (Kartago
  2022).
