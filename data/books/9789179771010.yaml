description: Är Hundmannen arbetslös nu när katten Percy fått lämna kattfinkan och blivit en hederlig
  förälder till Lill-Percy? Har alla skurkar lämnat staden? Absolut inte! Världen behöver sina hjältar
  mer än någonsin när 22 grodyngel råkar få telekinetiska krafter. Lägg till en utklädd fe som tycker
  att allt är orättvist så har vi en flygande katastrof! Vad kan en ensam kattunge och ett litet grodyngel
  göra åt detta? Det krävs mycket mod för att ensam gå emot de onda krafterna!Dav Pilkey har skapat de
  globala succéerna Kapten Kalsong och Hundmannen. Hans hjältar kämpar mot korkade och småsinta människor
  med makt och för det godas seger över ondskan. Alla berättelser ger på köpet bättre ordförråd och uppmuntrar
  till kreativitet, empati och att vara schysst!
