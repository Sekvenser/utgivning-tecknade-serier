description: När Mio vägrar att läsa en saga för sin lillasyster händer det märkliga saker. Boken får
  plötsligt liv och Mio hamnar i sagan om Skönheten och Odjuret. Han försöker hitta en väg ut, men precis
  som Belle är han nu fånge hos Odjuret. Hur ska han komma hem igen? Och varför lyssnar inte Odjuret på
  vad Belle säger. Ett nej, är ju ett nej! Nu introducerar Nypon förlag serieböcker som tar ett modernt
  och humoristiskt tag om några av historiens mest välkända sagor. Lättlästa böcker från Nypon är ofta
  något kortare, har alltid ett lättare språk och ett innehåll anpassat för den tänkta läsarens ålder.
  Nypons böcker är indelade i sex nivåer. Böckerna i serien Moderna sagor ligger på nivå 2 av 6.
