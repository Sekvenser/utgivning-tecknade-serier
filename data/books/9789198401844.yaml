description: Karelen! är Pia Koskelas grafiska roman om hennes far som stred i finska vinterkriget. Han
  pratade inte om kriget eller om tvångsförflyttningarna i Karelen när det blev ryskt. Efter hans död
  åker Pia på en bussresa till Karelen. Hon lägger ett pussel av familjehistorier, soldatanteckningar
  och minnen som skapar ett collage av både Mikael Koskelas liv och Karelens blodiga historia.
