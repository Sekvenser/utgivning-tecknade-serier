description: I 1600-talets Japan har Inbördeskrigens epok nätt och jämnt tagit slut, och shogun, militärregenten,
  har tagit makten över landet. Samurajerna är den högsta klassen i samhället, och de följer en hederskodex
  som kallas bushido. Det är en tid av oro och politiska intriger, och vi får följa en herrelös samuraj
  vid namn Miyamoto Usagi – även känd som Usagi Yojimbo  Drakvrålskonspirationen är det längsta och mest
  spännande av de tidiga Usagi Yojimbo-äventyren. Det är Lord Tamakuros onda och ambitiösa planer som
  sätter igång händelserna i denna episka saga. Återigen får vi möta karaktärer från tidigare berättelser
  – inklusive Gennosuke, den omoraliske prisjägaren; och Zato-Ino, den blinde svärdsgrisen. Kommer dessa
  stolta krigare att hinna lösa konflikten sinsemellan – och med Miyamoto Usagi – i tid för att ta sig
  an Lord Tamakuro?  Drakvrålskonspirationen skulle kunna beskrivas som ”De sju samurajerna möter antropomorfa
  djur” och är en dramatisk, rolig och hjärtskärande berättelse som inte lämnar någon oberörd.  Som bonus
  innehåller boken även en crossover-berättelse med Teenage Mutant Ninja Turtles!
