description: 'Under 1970-talet svepte vänstervindar genom Sverige – och rakt in i seriernas värld. Plötsligt
  fylldes rutorna av klasskamp, befrielserörelser och onda direktörer, men också fascistiska statskupper
  och blågul slavhandel. Orättvisorna hemma och ute i världen fick pratbubblorna att koka och försäljningssiffrorna
  att gå i taket. Till och med de mest kommersiella serierna ägnade sig åt revolutionsromantik och internationell
  solidaritet. För att inte nämna en och en annan slängkyss till Mao eller Fidel Castro. I Kamrat Bamse
  tar serieforskaren Robert Aman med oss till en tid då serierna stod mitt i samhällsdebatten. Vi får
  möta ett Sverige i en politisk och social brytningstid genom några av tidens mest inflytelserika serier:
  Bamse, Johan Vilde, Mystiska 2:an och Tumac. Här sitter åsikterna på första parkett, paketerade i ett
  format som når långt utanför de politiska rörelsernas vanliga kretsar. Robert Aman (f. 1982) är kulturskribent,
  serieforskare och biträdande professor i pedagogik vid Linköpings universitet.'
