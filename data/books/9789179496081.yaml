description: 'Från en minut till en annan krossas Samirs liv. Plötsligt är han på flykt från sitt hemland
  Afghanistan. Han hinner inte ens säga hejdå till sin familj. I Hamburg kommer Samir och hans kompis
  Hamid ifrån varandra. När Samir efter en lång och farlig resa äntligen är framme i Sverige, är Hamid
  inte med på tåget. Han kommer först nästa dag. Den enda dagen blir avgörande för deras framtid i Sverige.
  Nästan framme är en stark berättelse om två 15-åriga pojkar som kom till Sverige under det stora flyktingmottagandet
  2015. Vi får följa dem under deras nästan tre år långa väntan på besked om de får stanna. Nästan framme
  är en serieroman som skildrar kulturkrockar, hemlängtan, saknad, glädje, sorg, vänskap och kärlek. Boken
  innehåller också ett faktaavsnitt där Sveriges flyktingmottagande och asylprocessen förklaras på ett
  enkelt sätt. EPUB3: Fixed format'
