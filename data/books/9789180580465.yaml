description: I en tid av bräcklig fred ser den tibetanske despoten Basam-Damdu en chans att gripa makten,
  och på några timmar utplånas världens metropoler i en storskalig attack. Men kapten Francis Blake från
  brittiska underrättelsetjänsten MI5 och hans vän professor Philip Mortimer lyckas komma undan med ritningarna
  till det revolutionerande vapnet Svärdfisken, som kan vinna kriget åt det fria världen.
