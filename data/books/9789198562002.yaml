description: Talli, en flicka som härstammar från ett försvunnet folk som kallas Åkallerskorna, utplånade
  av människorna som fruktade deras magiska krafter. Talli var bara ett spädbarn när det hände och blev
  därför skonad och adopterad av Lord Koska som uppfostrade henne som sin egen dotter. Men när deras slott
  attackeras tvingas hon ut på en resa för att söka svar på frågorna om hennes ursprung och krafter!
