description: 'Varför är hjältinnan i en bok alltid vackrare än den man har hemma? Mumintrollens sökande
  efter kärlek, berömmelse och lycka fortsätter. Ett flygande tefat stör ordningen då det landar i Mumindalen
  och får invånarna att bli osynliga eller ändra storlek. Muminpappan vill bli fyrvaktare och inspireras
  till sin stora havsroman, och drar med sig hela familjen till fyrön. I den tredje delen av den klassiska
  seriesamlingen ingår Mumin blir förälskad, Vi bor i en djungel, Mumin och marsmänniskorna, Mumin och
  havet och Föreningsliv i Mumindalen, som tecknades 1956–57.


  I den här nyutgåvan återgår vi till originaltext och ursprungliga bilder. Den svenska texten härstammar
  från den första svenska bokutgåvan och bilderna är de engelska original som Tove Jansson tecknade för
  brittiska Associated Newspapers i början av femtiotalet. Serien om Mumintrollet började ingå i Evening
  News 1954, och publicerades snart i över 40 tidningar världen över. Som mest hade serien hisnande 20
  miljoner läsare dagligen.'
