description: 'Denna självbiografiska serieroman handlar om besatthet, könsroller och självförverkligande,
  berättad med en uppriktighet som få serietecknare är kapabla till. Lusts uppföljare till sin första
  internationella storsuccé "Idag är första dagen på resten av ditt liv" (på svenska 2012) fortsätter
  direkt där dess föregångare slutade. Avslöjande och kraftfullt berättar Lust om sitt liv som en ung,
  entusiastisk anarkist i Wien på 1990-talet - och om sin kärlek till två män: den "perfekta följeslagaren"
  Georg, en skådespelare som är tjugo år äldre, och den "perfekta älskaren", Kimata, en nigeriansk invandrare.
  I takt med att hennes relationer med de två männen utvecklas ökar svartsjukan alltmer och leder till
  känslomässiga och våldsamma utbrott som hotar hennes liv.'
