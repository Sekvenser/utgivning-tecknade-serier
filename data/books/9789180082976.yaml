description: Morgan bor i en liten stad vid havet och livet känns väldigt trist. Hon har en hemlighet
  som hon inte vill berätta för någon, att hon gillar tjejer. En natt räddas Morgan från att drunkna av
  en mystisk tjej som heter Keltie. Men Keltie har egna hemligheter. Och när de kommer närmare varandra
  kommer hemligheterna att hitta upp till ytan, oavsett om Morgan är redo eller inte. Denna sommar kommer
  förändra allt.  Molly Knox Ostertag är tillbaka med en mycket vacker grafisk roman. Om hemligheter,
  lesbisk kärlek, och mystiska väsen. Perfekt för alla som gillar Witch boy.   Hegas böcker – lätta att
  läsa. Svåra att motstå.
