description: Sasha är en deprimerad ung slacker som bor hos sina föräldrar och letar efter en mening med
  sitt liv. Eliza är en ensamstående varannanveckasmamma som jobbar på en deli och försöker hinna med
  nåt slags karriär som spoken word-artist och författare. Sasha fascineras av Elizas verk och försöker
  påstridigt skapa en vänskap mellan dem, men berättelsen tar en olycklig vändning.  Tommi Parrish föddes
  1989 i Melbourne och har publicerats fortlöpande på svenska i tidskriften Det Grymma Svärdet sedan 2017.
  På engelska föreligger två tidigare böcker samt publiceringar i Granta och The New Yorker, men detta
  är första gången denna berättelse publiceras i bokform.
