description: Kosmisk action! Bu, Luna och Orion är ute på hjälteuppdrag i rymden! De klär ut sig till
  rymdpirater, spelar rymd-fotboll och besegrar ondingen Rump Huve som ser ut som en rumpa! Dessutom blir
  de inbjudna att medverka i en film, men det visar sig vara en del av Lord Ondskas onda plan för att
  fånga hjältarna. Fyra fartfyllda berättelser fullpackade med kosmisk action. Den som gillar Guardians
  of the Galaxy eller rymdäventyr kommer att älska denna tokiga berättelse, full med influenser från den
  tecknade tv-serieriens värld! Jagade i rymden är första fristående delen i serien Galaxens hjältar.
  Hegas lättlästa böcker väcker läslusten hos barn och unga.
