description: Det klassiska seriealbumet Asterix och tvekampen släpps nu som specialutgåva med 16 sidor
  extramaterial. Majestix, hövding över gallernas by, utmanas av romarna till en tvekamp om ledarskapet,
  samtidigt som byns druid Miraculix råkar ut för en olycka och inte kan tillverka trolldrycken som ger
  våra hjältarsuperstyrka. Allt är upplagt för ett fartfyllt äventyr med många sköna skratt.
