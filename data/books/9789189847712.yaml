description: 'Enligt Jecko är det någon (mest föräldrar) som är så tråkiga att de har blivit förvandlade
  till tråkzombisar. För de stirrar mest i sina mobiler och pratar bara om jättetråkiga saker som skatter
  och bygglov med varandra. Jecko och hans vänner måste få de vuxna att skratta och ha roligt igen. Annars
  blir de tråkzombisar för alltid.


  Jecko (Joakim Assarsson) är clown och akrobat och har sedan 2012 gjort populära barn- och ungdomsprogram
  på SVT. Han har också uppträtt på Talang TV4, American Got Talent och Cirque du Soleil. Författaren
  Patric Nyström och illustratören Jonas Anderson flyttar nu över Jecko till böckernas värld. Det blir
  nya knasiga och skruvade äventyr i Charlie Chaplins anda som lockar till många skratt.'
