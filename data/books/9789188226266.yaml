description: 'En historiker kommer till Folkets hus i Vidåkra för att föreläsa om demokrati. Med sig har
  han föreningshandböcker han undersökt i sin forskning. Men när böckerna väcks till liv går inte allting
  som det var tänkt... I Försök till demokrati får vi vetenskapliga perspektiv på ett av folkstyrets stora
  dilemman: utan tydliga spelregler blir det ingen fungerande demokrati. Men demokrati är så mycket mer
  än formalia. Formalia har också en tendens att ta över och kväva delaktighet. Vad är det som krävs för
  att bygga en levande demokrati där var och en kan göra sin röst hörd?'
