description: 'Fyra serier som reflekterar över den aktuella situationen vid tiden då de skrevs och försöker
  se hur enskilda händelser passar in i större sammanhang. Första delen av det här seriehäftet, Arg Kanin
  om ett folkmord, gjordes till en utställning i protest mot Israels deltagande i Eurovision 2024, under
  pågående folkmord i Gaza. Andra delen, Arg Kanin om en vapenvila, gjordes ett år senare efter att Israel
  brutit den alltför korta vapenvilan. Här finns också två tillbakablickar: Arg Kanin om yttrandefrihet
  och maktrelationer (2006) och Arg Kanin om svensk/israelisk vapenhandel (2011) som visar på att situationen
  inte startade den 7 oktober 2023 utan har pågått i årtionden med ockupation, apartheid och massakrer,
  men också med uppror.'
