description: '"Årets by" är en serieroman som skildrar livet i Kiruna – den grå gruvstaden som av många
  invånare liknas vid ett arbetsläger. Mitt i den pågående stadsflytten, där marken spricker och människor
  tvingas lämna sina hem, växer en kollektiv känsla av oro och ångest fram. Kärleken till de närliggande
  byarna och hatet till storstaden är påtaglig. Hilda flyttar från Stockholm till sin mors hemstad i ett
  försök att hitta sin identitet och komma närmare sina rötter. Men samtidigt som staden förändras i grunden
  blir det tydligt att hon själv måste konfrontera sprickorna i sitt eget fundament. Med en teckningsstil
  som för tankarna till Owe Gustafson och Marie-Louise Ekman, samt ett formspråk som påminner om tekniska
  instruktionsböcker, förenar "Årets by" samhällsskildring och komiskt drama i en berättelse som är både
  drabbande och visuellt särpräglad.'
