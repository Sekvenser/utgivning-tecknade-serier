description: Grafisk roman som handlar om terrordådet på Utøya, men också om några ungdomar i Oslo och
  deras liv efter attentatet. Vi följer gymnasietjejerna Rebekka och Fariba som på olika sätt, genom teater,
  kärleksrelationer och engagemang inom politiken försöker ta sig vidare i livet. Men det är svårt att
  släppa det fruktansvärda som har hänt och mardrömmarna och tankarna fortsätter att komma. Prisades med
  Nordiska rådets pris för barn- och ungdomslitteratur 2022. 15 år och uppåt.
