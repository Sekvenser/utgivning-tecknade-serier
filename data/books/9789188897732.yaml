description: Belgien, sommaren 1942. Det tyska övertaget i kriget har börjat svikta och inom några månader
  kommer krigslyckan att vända för gott. Det växande motståndet mot den tyska ockupationsmakten tar sig
  många olika uttryck, från underrättelseverksamhet till sabotage. Mitt i detta tumult försöker Spirou
  vara trogen sina ideal också när han själv och flera av hans vänner tvingas sätta sina liv på spel.
