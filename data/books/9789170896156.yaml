description: På hösten 1915 föds en flicka i Östersund. Flickan får namnet Märit och hennes liv ska komma
  att spänna över hela det omvälvande 1900-talet och vidare in i våra dagar.   MÄRIT är en berättelse
  om en kvinnas liv, om sökandet efter ett eget utrymme, om det lilla och unika livet som vi alla lever,
  och om den stora världen vi försöker förstå. Vem är en individ i alltet? Vad betyder ett liv?
