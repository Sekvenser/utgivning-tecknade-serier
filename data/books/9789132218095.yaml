description: 'Världens första Minecraft-serieböcker är här!Tylers liv vänds uppochner när familjen flyttar
  från stan där han vuxit upp. Som tur är kan han hålla kontakten med sitt gamla kompisgäng genom Minecraft!
  Tillsammans har de upplevt många äventyr i spelets värld och nu bestämmer de sig för att anta den största
  utmaningen av dem alla: att försöka besegra Ender dragon!Böckerna i serien är bildrika och fulla av
  äventyr och spänning. Perfekt läsning för den som just börjat bekanta sig med spelet men också för redan
  inbitna Minecraft-fans.'
