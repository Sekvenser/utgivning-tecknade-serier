description: En kanot flyter i land med en död präst. Prästen för med sig budskap som han har skrivit
  med sitt eget blod på utrivna bibelsidor. Meddelandet är riktat till Jim Brandon vid den ridande polisen.
  Det här leder till att Brandon överger sin röda uniform och försvinner in i den oändliga arktiska ödemarken.
  Efter att Brandon varit försvunnen i månader anländer Tex Willer och Kit Carson för att rädda sin vän
  från Wendigo, den våldsamma skogsanden som äter sina egna söner!  Tex Willer skapades i Italien 1948
  av författaren Giovanni Luigi Bonelli och tecknaren Aurelio ”Galep” Galleppini. Tex blev med tiden en
  enorm framgång och Italiens populäraste seriefigur. Hans äventyr spreds över världen och Tex blev populär
  i många andra länder, inklusive Sverige men i ännu högre grad i våra grannländer Finland och Norge.
  Sedan starten har det producerats tusentals äventyr om Tex Willer av hundratals serieskapare, i mängder
  av olika format.
