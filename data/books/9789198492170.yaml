description: The second ”ceasefire” in Gaza turned out to be not much more than an empty phrase, and the
  struggle is far from over. Israel’s genocide is a continuation of decades of occupation and apartheid,
  but also of Palestinian resistance. As the violence persists, it affects not just Gaza and Palestine,
  but also neighboring countries like Lebanon, Syria, and Iran. While people all over the world are protesting,
  many states and corporations are complicit in what can’t be called anything other than a genocide. Den
  del av bokens pris som går till förlaget, dvs ca 60:-, går till folket i Gaza via Senabil Society. ParaVox
  är en ny antologitidskrift från Tusen Serier, en plattform för antirasistiska serier av serieskapare
  från olika länder.
