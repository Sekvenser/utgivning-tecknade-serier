description: Alla korna ligger redan och sover när Kråkan kommer in i lagården efter en lång dag utomhus.
  Men var är Mamma Mu? Hon ligger inte sitt bås. Var kan hon vara? Det låter som om nån hoppar och ropar
  uppifrån höskullen.Jujja Wieslander och Sven Nordqvists böcker om Mamma Mu och Kråkan är översatta till
  30 språk och har underhållit flera generationer barn, först som radioteater och sedan som bilderböcker,
  kapitelböcker och film. 2015 tog Mamma Mu ett ko-språng in i seriernas värld. Här samlas två serieberättelser
  om Mamma Mu och Kråkan.Bakom serien står också tecknaren Micaela Favilla och färgläggaren Elin Fahlstedt,
  som tillsammans skapat serien utifrån Sven Nordqvists illustrationer av Mamma Mu.
