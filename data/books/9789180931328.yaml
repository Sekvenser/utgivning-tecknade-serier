description: Magisk vänskap i rymden! Varken problem med raketmotorn eller en ond kattdespot stoppar enhörningen
  Astrids och ekorren Stellas glädje. Tillsammans med sin robotvän ger de sig ut på knasiga äventyr i
  rymden. Först ut är att övertala en ond (men mycket gullig) katt att bryta förtrollningen han lagt över
  planeten Katturnus! Hegas lättlästa böcker väcker läslusten hos barn och unga.
