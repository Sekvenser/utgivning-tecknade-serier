description: 'Achilles Wiggen, kapten i det svenska flygvapnet, har hjälpt fredliga utomjordingar att
  försvara sig mot sina fiender. Med hjälp av bioiden JPX försöker han ta sig hem men istället kastas
  kapten Wiggen ständigt in i nya halsbrytande äventyr. Med på färden finns även tonårspojken Anders Nilsson
  och Illea, prinsessa av Atlantis! En episk scifi-berättelse om en svensk hjälte på äventyr i tid och
  rum! Denna volym innehåller berättelserna: MOT SHERWOODSKOGEN EN FÖR ALLA! ALLA FÖR EN! INDIANDÖDAREN
  DEADWOOD 1876 CUSTERS SISTA STRID Samt ett efterord där Kari Leppänen beskriver det som var tänkt att
  bli seriens sista avsnitt: MÄNNISKOÄTARNAS PLANET'
