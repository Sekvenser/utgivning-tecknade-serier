description: 'I sitt sökande efter andra varelser som liknar honom själv låtsas fiskpojken Sashimi att
  han är en helt vanlig elev i en helt vanlig mellanstadieskola. Han ser fram emot att få följa med klassen
  på sin första skolutflykt, men efter ett stopp i Gamla stan råkar Sashimi kliva på fel buss och blir
  ganska snart avsparkad. Plötsligt befinner han sig helt ensam mitt i ingenstans – utan vatten! Panik
  bryter ut i klassen när de inser att Sashimi är försvunnen. Det är säkert bara en tidsfråga innan han
  hittar hem igen, men inte utan att först ha ställt till med en massa problem.


  Sashimi är en charmig tecknad serie för alla som gillar humor och äventyr – och sjöodjur!'
