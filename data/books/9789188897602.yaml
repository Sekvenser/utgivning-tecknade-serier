description: När kapten Haddock berättar om sin legendariske förfader, herr François de Hadoque, faller
  bitarna på plats och det visar sig att Tintin och Milou är en sagolik sjörövarskatt på spåren. I Enhörningens
  hemlighet inleds en fantastisk skattjakt med tre parallella historier som skickligt vävts samman och
  som avslutas i nästföljande album, Rackham den rödes skatt.
