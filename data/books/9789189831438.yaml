description: Det stormar i kompiskretsen kring Abeba och Lina, men de vet att tillsammans klarar de allt.
  Den populära tjejen Enjoy verkar plötsligt hatad av alla. Men hon vill inte prata om det. Samtidigt
  får Adele oväntat mycket uppmärksamhet för sin grafitti-konst. Hur kul som helst, tycker Lina och Abeba,
  men Adele blir mest obekväm. Varför då?  Precis så här känns det att vara pre-teen. Det är komplext,
  rörigt, känslomässigt och hemskt. Men också alldeles, alldeles underbart, speciellt när man kan luta
  sig mot sin bästa vän. Med fin fingertoppskänsla skildrar författarduon BeKa och illustratören Maya
  boken En sång om kärlek. Den tredje delen av serien LOVE – om relationer, vänskap och kärlek.
