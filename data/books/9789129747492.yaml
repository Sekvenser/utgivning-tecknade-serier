description: 'Vad skulle du göra om du plötsligt fick reda på att du var vampyr? Conny som är en nybliven
  vampyr försöker hitta ett svar på just den frågan. Men det är svårare än vad han tror att hinna med
  att vara vampyr, klara av skolan och se till att hans vampyrmarsvin Brutus inte äter upp någon pensionär.
  Som om det inte var nog så dyker en mystisk vampyrlärare upp och vad kommer hans vampyrjagande mormor
  att säga när hon får veta att han är en vampyr?  Full fart framåt i den andra boken om Conny och hans
  knäppa marsvin Brutus! Lite läskigt, mycket roligt och framförallt underbara, knäppa bilder av serietecknaren
  Daniel Thollin. Stor läsglädje för nybörjaren som vill ha något både kul och spännande att sätta (de
  blodiga) tänderna i!Läs också första delen: Basketbollar och blodpudding.'
