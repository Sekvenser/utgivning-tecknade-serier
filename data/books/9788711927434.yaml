description: Följ med Rasmus Nalle och hans glada vänner på ett äventyr! När Rasmus Nalles bästa vän pingvinen
  Pingo får i uppdrag att hämta hem ett speciellt tyg till sin mormor så tar han med sig vännerna på den
  långa resan till Pingonesien.De älskade serierna om Rasmus Nalle skapades av författaren Carla Hansen
  och illustratören Vilhelm Hansen. Paret skapade mellan åren 1951 och 1990 över 30 album med serier som
  beskrev de äventyr som den godmodiga björnen och hans vänner gav sig ut på. Berättelserna om Rasmus
  Nalle älskas av barn i hemlandet Danmark, och över hela världen. Serierna har sålts i över 20 miljoner
  exemplar i ett 20-tal länder.Efter att Rasmus Nalle hittat en gammal fartygsratt på en soptipp får han
  hjälp av sina vänner att bygga ett skepp. På skeppet, som de döper till Mary, reser de sedan runt i
  världen och upptäcker nya fantastiska platser.
