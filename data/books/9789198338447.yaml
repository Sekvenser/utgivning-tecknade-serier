description: 'Petter och Sahar hälsar på mamma Maja som avtjänar ett långt fängelsestraff för narkotikabrott.
  Båda längtar efter att hon ska komma hem igen. Men hur blir vardagen när mamma äntligen muckar? Mamma
  fuckar upp bygger på verkliga händelser och ungdomars egna berättelser och erfarenheter.  Omkring 30
  000 barn och unga i Sverige lever dagligen med en frihetsberövad förälder eller anhörig.  Elisabet Omsén,
  född 1965, är uppvuxen i Värmland och utomlands men är numera bosatt i Stockholm. Hon började som fotograf
  men sadlade sedan om till skribent med inriktning på människor som lever i ett socialt utanförskap.
  Elisabet har en kandidatexamen i kriminologi vid Stockholms universitet. Tidigare utgivna böcker på
  temat barn och unga med föräldrar i fängelse: Pappa bor på fängelset (2008), Utestängd – om att lämnas
  kvar utanför fängelsemuren (2014) och Du Jag Vi – om att ha en förälder i fängelse (2017). Charlie Rosales,
  född 1993, har bott i Norrköping större delen av sitt liv. Han fann ett intresse för bild och form redan
  som liten och har sedan dess alltid sökt nya utmaningar i sitt skapande. Charlie har bland annat gjort
  illustrationerna till barnboksserien M-Deckarna som är skrivna av författaren Gabriella Nilsson Ringqvist.'
