description: Hur kunde jag bli gravid? Så jävla dumt! Malin har bestämt sig för att aldrig skaffa barn,
  när hon en dag blir gravid. I början är hon och hennes sambo tveksamma, men sedan bestämmer de sig tillsammans
  för att behålla barnet och bli föräldrar. Ett stort och omtumlande beslut i några unga människors liv
  i Sverige idag.
