description: Äventyrliga Edda trivs med jobbet på familjens nöjesfält, men det hon verkligen drömmer om
  är bilracing och sin stora idol, den oslagbare racingstjärnan Ed. När hon äntligen får träffa honom
  slutar det i en katastrof. Edda lovar att ställa allt tillrätta genom att vinna Grand Prix för dem båda.
  Snart inser hon att någon av medtävlarna försöker sabotera för de övriga, för att själv kunna ta hem
  den stora prissumman. Hon måste nu lyckas övertyga Ed om att hon har rätt och tillsammans med honom
  överlista den skyldige. Det här kommer bli den mest fart- och farofyllda Grand Prix i tävlingens historia!
