description: KRIGET ÄR SLUT  Har MEGATRON verkligen gått över till Autoboternas sida? Och om han nu är
  kapten på DEN FÖRLORADE LYKTAN, vad har då hänt med RODIMUS? Vem sände egentligen det där meddelandet
  från framtiden när RODIMUS, ULTRA MAGNUS, RATCHET och de andra lämnade CYBERTRON? Kom meddelandet VERKLIGEN
  från framtiden? Vad innehåller egentligen BRAINSTORMS portfölj? Och… ÄR allt verkligen WHIRLS fel? Svaret
  på alla dessa frågor får du i den här boken – den fjärde i berättelsen om besättningen ombord på rymdskeppet
  DEN FÖRLORADE LYKTAN.
