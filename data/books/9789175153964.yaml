description: Det första han tänker när han får meddelandet om sin brors död, är att han måste ringa brorsan,
  för att berätta. Så börjar Magnus Jonasons självbiografiska serieroman, en bok om en familj i kris och
  om att sörja en bror redan innan han är borta. I kontrast till berättelsen om sorg, minnen och förlust
  står inslagen av den svarta humor som uppstår när vardagslivet tränger sig på.
