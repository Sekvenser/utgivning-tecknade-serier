description: Alisik har accepterat sin nya tillvaro. Hon dog vid 15 års ålder och är dömd att leva mitt
  emellan liv och död. Hon har inget minne av olyckan som kostade henne livet, men hon kämpar för att
  ta reda på vad som egentligen hände. Ruben, den blinde pojken som kan höra henne, är till stor hjälp
  och verkar också mycket intresserad av att få reda på sanningen .
