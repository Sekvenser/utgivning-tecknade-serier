description: 'För första gången kommer nu alla Medleysidospåren, samlade i ett enda minialbum! Utöver
  Människomaskinen och Maestrons Dotter från Utopi Magasin kommer en ny berättelse: i Våga inte (glömma
  mig) får vi veta hur Axel begav sig ut och blev den ökände Synthpopparen från Öst (som vi lär känna
  honom i Medley – En ny våg). Alla berättelserna är fristående, men kan funka som inkörsport till tyngre
  musik.'
