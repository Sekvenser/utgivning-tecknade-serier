description: Cormac McCarthys mästerverk som hyllad serieroman. En far och hans son vandrar genom ett
  nedbränt amerikanskt landskap. Snön som faller blandas med askan i luften. Deras mål är kusten, utan
  att de vet vad som väntar dem där. Allt mannen och hans son har är en revolver att försvara sig med,
  en kundvagn med mat de har hittat, kläderna de går i - och varandra.
