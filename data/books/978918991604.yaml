description:
  Förr hade nästan varje by en egen idrottsplats där pojkar och flickor kämpade i byns färger.
  Eldsjälar såg till att gräset var klippt, linjerna kritade och bollarna pumpade. Men tiderna förändrades.
  Landsbygden avfolkades, skolor lades ned och barnakullarna blev allt mindre. Många planer har sedan
  dess övergivits – långsamt uppslukade av naturen. I denna bok har Göran Bergmark och Mats Tallkvist
  rest genom landet och dokumenterat 65 idrottsplatser från norr till söder. Genom berättelser och bilder
  skildras platserna som en gång var samhällets hjärta, en naturlig samlingsplats, men som idag är tysta
  minnesmärken över en tid som inte längre är.
