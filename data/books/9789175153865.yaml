description: Ugly Mareowl lämnar storstaden för några dagars rekreation i jämtländska Strömsund. Det går
  rykten på bygden om en pågående rymdinvasion och att traktens bönder driver upp utomjordingar i salladen.
  Ugly går med på att undersöka saken. Att blondiner kan vara farliga vet vi sedan tidigare, men hur rädda
  ska vi vara för grönsaker? Kanske får vi svaret i detta glesbygdsmysterium.
