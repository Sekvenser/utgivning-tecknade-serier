description: Porten mellan världarna har öppnat sig och tillsammans med Pantalaimon tar Lyra språnget
  in i ett annat universum. På platsen dit hon först kommer, det hemsökta och skrämmande Cittàgazze, möter
  hon Will, en pojke från vår egen värld som nyss fyllt tolv och redan har ett mord på sitt samvete. Lyras
  och Wills öden verkar vara sammanflätade, och tillsammans ger de sig ut för att ta reda på mer om de
  mystiska krafter de kämpar mot.Detta seriealbum är det första av tre baserade på Philip Pullmans bok Den
  skarpa eggen, som utgör andra delen av trilogin Den mörka materian/His Dark Material.
