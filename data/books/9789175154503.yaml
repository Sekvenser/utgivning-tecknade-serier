description: Sara, Cassiopeja och Lucille reser till de franska bergen, där deras pappa är astronom på
  ett stort observatorium. Systrarna får snart veta att en komet närmar sig jorden mitt under deras besök.
  Samtidigt blir de indragna i en märklig skattjakt som leder dem till förtrollade skogar, mörka grottor
  och igensnöade stigar.
