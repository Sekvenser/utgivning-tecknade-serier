description: Rädda Sorya handlar om Chang, en orädd tjej som beslutar sig för att rädda djur genom att
  bli naturvårdare. En dag träffar hon den övergivna solbjörnen Sorya. De andra viltvårdarna tror att
  Sorya är för liten och svag för att klara sig i vildmarken, men Chang bestämmer sig för att göra allt
  i sin makt för att återföra Sorya till friheten.  Följ Changs spännande äventyr i Rädda Sorya!
