description: Upplev succéserien The Mandalorian som seriealbum!Mando och Grogu återförenas och tillsammans
  utforskar de Mandaloriernas förstörda planet, där Mando hoppas söka botgöring för att ha brutit mot
  sitt folks traditioner. På färden träffar de mandaloriernas tidigare ledare, Bo-Katan, och tillsammans
  kämpar de för att ena mandalorierna. Men vägen dit är lång och krokig, och de tvingas kämpa mot såväl
  rester av Imperiet som mytologiska monster.Fantastiska bilder och action för alla Star Wars-fans! Berättelsen
  följer tredje säsongen av tv-succén.
