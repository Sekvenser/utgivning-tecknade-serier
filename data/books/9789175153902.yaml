description: 'En natt när Raina är tio år vaknar hon av att hon mår illa och måste kräkas. Snart är Raina
  tillbaka i skolan, men hennes magont vill inte släppa. Raina oroar sig för det mesta: för maten hon
  äter, för hur det går i skolan, för relationen till sina klasskamrater och för att hon ska behöva kräkas
  igen. Till slut verkar nästan allt i Rainas liv ge henne magknip. Vad är det egentligen som händer?'
