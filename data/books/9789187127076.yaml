description: Gökboet är en ny, svensk, familjeorienterad seriestripp som tar inspiration från klassiska
  strippserier som Blondie och Familjen Flax, men förlägger berättelserna till ett Sverige av idag.  Serien
  handlar om familjen Gök, en vanlig, om än ganska fånig familj, som uppvisar vissa gemensamma drag med
  skaparen Hanna Strömbergs egen familj. Denna samlingsvolym innehåller de första 134 stripparna.
