description: 'Samlingsvolym med albumen På order från Washington, Mission Sherman och Den blodiga gränsen.


  Arizona, 1868. Löjtnant Blueberry vid Fort Navajo får i uppdrag av general Sherman att tillfälligt tjänstgöra
  som sheriff i den illa beryktade gränsstaden Heaven. Staden tros vara centrum för en omfattande illegal
  vapenhandel med indianerna, där korrumperade politiker och rika ranchägare också misstänks vara insyltade.


  Marshal Blueberry tillhör de banbrytande tecknade serierna i westerngenren. Manusförfattare är Jean
  Giraud, som denna gång lämnat över pennor och penslar till sin vän William Vance, känd bl a för serierna
  Bruno Brazil, Bob Morane och XIII. Vance tecknade de två första delarna av Marshal Blueberry innan den
  talangfulle Michel Rouge tog över inför den avslutande delen av denna spännande och storslagna berättelse.'
