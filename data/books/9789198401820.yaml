description: 'Nikki bor på en ö i Bohuslän med sin familj. Hon är i brytpunkten mellan det gamla, trygga
  livet och det nya okända. Kompisgänget från högstadiet har hon inte längre mycket gemensamt med, men
  gymnasiet som hägrar inne i stan är skrämmande. Vuxna tycker att Nikki väger för mycket, men ingen frågar
  hur hon egentligen mår. När Nikki börjar på gymnasiet är hon ensammast i världen. Efter ett tag börjar
  hon umgås med ett litet queert gäng i klassen, och inser att det faktiskt är hennes nya vänner. Med
  vännerna får hon även nya perspektiv på kroppen, sexualitet, politik och kamp.    Nikki är en coming-of-age-roman
  om att hitta sitt sammanhang, sig själv och inte minst: den första kärleken.'
