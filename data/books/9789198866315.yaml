description: Detta är Seriearkivets andra årsbok, som innehåller en redogörelse över allt det som skett
  på arkivet under dess andra år som egen, fristående förening – men även artiklar om och kring svensk
  seriehistoria. Här kan du läsa om Spirou-seriens mörka förflutna på 30-, 40- och 50-talen; om äventyrsserier
  för kvinnliga serieläsare på 60- och 70-talen; om hur den ursvenska serien Kronblom publicerades i grannlandet
  Norge; om Lennart Hartlers hågkomster som redaktör för serietidningen Pilot-22; om Oscar Jacobssons
  idag okända barnserie Tullan; om diplomaten Jan Romares remarkabla karriär som serieskapare, och mycket,
  mycket mer.
