description: 'Achilles Wiggen, kapten i det svenska flygvapnet, kidnappas av fredliga utomjordingar som
  behöver hjälp av en erfaren stridspilot för att försvara sig mot sina fiender. Kari Leppänens serie
  är en av de populäraste biserierna från serietidningen Fantomen. Denna volym innehåller de första tre
  berättelserna, som tidigare publicerades som följetong i Fantomen: Transportören, Monsteräggen och Arvet
  från Atlantis. Allt i ny översättning och ny färgläggning!'
