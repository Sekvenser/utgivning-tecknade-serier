description: 'Some may think it seems cozy and secure, but it will inevitably affect the innocent, especially
  when the law is designed precisely to target people whose only crime is to seek a haven in a country
  they were not born in. That in itself is bad enough. But will it even stop at authorities and public
  employees reporting undocumented people? Or will it also become a national duty to report those who
  do not behave “correctly” enough according to some arbitrary nationalist standards? “Lack of conduct”
  is already a legal reason for deportation as well as for punishing school children. What happens to
  the public psyche when laws are introduced that will force us to keep an eye on each other, suspect
  each other and report each other? And above all: what ways are there to refuse and to resist? In this
  issue, we take a look at the consequences of living under the threat of being reported simply for being
  someone who isn’t seen as belonging in the country. Informed on by public employees, government officials
  and/or neighbors and even family members. We look at consequences of not being able to trust one’s environment
  and, from the other side, being forced by the law to be part of such a hostile environment. ParaVox
  är en ny antologitidskrift från Tusen Serier, en plattform för antirasistiska serier av serieskapare
  från olika länder.'
