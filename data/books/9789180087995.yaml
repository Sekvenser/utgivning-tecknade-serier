description: Varje fullmåne förvandlas den lilla vargen Amiel och hennes familj till varulvar. De lever
  lyckliga i sin gömda dal. Men Amiel är nyfiken på människorna på andra sidan berget och blir i hemlighet
  kompis med pojken Dante. Men kommer Dante vilja vara hennes vän nästa gång det blir fullmåne?   I denna
  del av Flippade sagor möter läsaren en av våra mest älskade H.C. Andersen-karaktärer, fast som varulv
  istället för sjöjungfru. Precis som i den klassiska sagan måste den lilla varulven välja mellan sin
  familj och vänskapen med Dante i den nya världen. Det här är en färgsprakande grafisk roman för de yngsta.     Hegas
  böcker – lätta att läsa. Svåra att motstå.
