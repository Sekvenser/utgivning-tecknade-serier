description: 'Manusförfattaren och seriehistorikern Claes Reimerthi gick bort alltför tidigt, i juli 2021.
  Claes var oerhört produktiv, en av Sveriges internationellt mest spridda serieskapare och tillika en
  mycket trevlig och uppskattad person – något som denna välfyllda hyllningsbok är bevis på.

  Boken samlar texter om, av och med Claes, inte minst hyllningar i text och bild av de många personer
  som samarbetade med Claes någon gång under hans långa och varierande karriär.'
