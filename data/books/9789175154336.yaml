description: Den helt vanliga grisen Frasse råkade bli biten i trynet av en radioaktiv fladdermus och
  förvandlades till - BATPIG. Tack vare stödet från sina bästa kompisar börjar han nu få rätsida på hela
  superhjältegrejen. Ända tills han hamnar i en tuff kamp mot klockan, när en hämndlysten skolvaktmästare
  börjar sakta ned tiden så att mattelektionen aldrig tar slut.
