description: 'Den belgiske serieskaparen Olivier Schrauwen presenteras för första gången på svenska med
  den moderna klassikern "Arsène Schrauwen" en surreal hallucination over koloniala expeditioner kunde
  te sig för naiva européer. En både förvirrande, spännande, rolig och bisarr hybrid av "Mörkrets hjärta"
  och "Tintin i Kongo". Arsène reser till en belgisk koloni där han ska hjälpa sin kusin med ett megalomant
  projekt: att bygga en helt ny, futuristisk stad långt inne i djungeln. Han förälskar sig i kusinens
  fru, vilket komplicerar hans känsloliv, och efter en period i ensamhet, under intensiv konsumtion av
  starkt trappistöl, beger han sig ut på en expedition i djungeln. Gränserna mellan verklighet och dröm
  löses upp och visuellt präglas framställningen av Schrauwens bedrägligt enkla teckningar i tvåfärg.  “One
  of the very best graphic novels of the decade.” - Dan Nadel, The Comics Journal  “I’ve found estimations
  like ‘Roy Andersson remaking Fitzcarraldo as an X-rated children’s comic’ to be personally useful in
  conveying the unique tone of this Olivier Schrauwen original … I readily urge you deeper into this fascinating
  and disquieting experience.” - Joe McCulloch, The Comics Journal "the most original cartoonist I''ve
  fallen onto since Chris Ware or Ben Katchor" - Art Spiegelman'
