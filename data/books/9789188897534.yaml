description: Tintin och Milou är på en semesterkryssning i Medelhavet. Ombord träffar Tintin på för första
  gången på sin blivande ärkefiende Roberto Rastapopoulos. Tintin blir också bekant med detektiverna Dupond
  och Dupont, samt möter den snurrige professorn Filemon Syklon. Tintin följer med Syklon för att utforska
  en faraons grav i Egypten, som är hemligt högkvarter för ett internationellt knarksyndikat.
