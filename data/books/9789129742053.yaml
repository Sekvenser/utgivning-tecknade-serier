description: 'Ronja Rövardotter, Astrid Lindgrens sista stora verk, kom ut 1981. Boken har översatts till
  41 språk och sålts i över 10 miljoner exemplar världen över, och den filmatiserades i mitten av 1980-talet
  av Tage Danielsson. 2016 gjorde Goro Miyazaki på legendariska Studio Ghibli i Japan en animerad tv-serie
  baserad på boken.Berättelsen är ett av Astrid Lindgrens största sagoäventyr, en Romeo och Julia-historia
  om Ronja och Birk som är barn till två rivaliserande rövarhövdingar. Barnens vänskap hotas av släktfejden
  och den vilda naturen med alla dess invånare blir deras tillflyktsort. Det blir en kamp för fred och
  rättvisa, mot ondska och dumhet, innan Ronja och Birk till sist lyckas locka fram det goda hos de råa
  rövarna.I samlingsvolymen ingår de fyra serieböckerna: Åskvädersbarn, Vildvittrorna, Björngrottan och
  Glupafallet.'
