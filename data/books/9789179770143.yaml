description: Första delen i serien Mars tur och retur – ett actionspäckat rymdäventyr för alla som drömmer
  om att en dag få utforska universum.På rymdakademin i Lappland är spänningen stor. Hela året har eleverna
  kämpat, tränat och förberett sig för att resa ut i rymden. Äntligen är det dags. Raketen står redo och
  eleverna ska strax få veta vilka fyra astronauter som har valts ut att följa med ombord på den första
  elevexpeditionen till Mars. Bästisarna Svea och Sydney håller tummarna för att de båda ska få åka, men
  plötsligt går strömmen och allt blir svart. Det som inte får hända har hänt och med ens är hela uppskjutningen
  i fara.
