description: En trasig historia är en serieroman om att växa upp med en gränslös förälder. Lösryckta minnesbilder
  kokar ned ett mångårigt sjukdomsförlopp till en tät berättelse i rasande tempo. Mamma kan plötsligt
  köpa en massa kläder, bli kär i en kändis, brusa upp för ingenting, dra opassande skämt på en middag
  och sen försvinna i flera timmar. Barnperspektivet är smärtsamt starkt, men Tillmans svarta och träffsäkra
  humor är hela tiden närvarande.   Marie Tillman är mest känd för sin serie ”Livscoachen” som bl a gått
  i Metro i flera år. Det här är hennes debut i längre format.
