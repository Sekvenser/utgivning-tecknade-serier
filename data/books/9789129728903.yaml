description: '- Va?! Vad GÖR du Mamma Mu? - Jag lägger mig på magen så här. Och sträcker fram nosen så
  långt det går. Och fäller in hornen så mycket jag kan. Jag sträcker på svansen så mycket det går. Vet
  du vad jag leker då? - En ko som har blivit tokig kanske? - Orm, Kråkan.  Det är höst på Mamma Mus gård,
  och snart är det vinter också. Alla korna står inne i ladugården och mumsar hö, och tar det lugnt. Men
  Mamma Mu vill hitta på något roligare än att mumsa hö och vänta på våren. Hon vill åka skridskor, cykla
  och leka hemlig agent eller kanin. Kråkan tycker förstås att det är en jättedålig idé, men han måste
  ändå vara med för att se hur det går.  Jujja Wieslanders berättelser om Mamma Mu och Kråkan är översatta
  till 30 språk och har underhållit flera generationer barn, först som radioteater och sedan som bilderböcker,
  kapitelböcker och film.'
