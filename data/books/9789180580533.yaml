description: Blacksad fortsätter nysta i korruptionshärvan kring storbyggmästaren Lewis Solomon. Hans
  journalistkompis Weekly sitter inne, misstänkt för mordet på teaterchefen Iris Allen. I takt med att
  pusselbitarna faller på plats börjar det gå upp för Blacksad att hans gamla flamma, skådespelaren Alma,
  spelar en betydligt större roll i dramat än vad han först kunde ana.
