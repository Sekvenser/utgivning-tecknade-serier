description: Kobolt Kogg bor med sin mamma på en liten ö där invånarna lever av jordbruk och hantverk
  och har gigantiska sköldpaddor som husdjur. Alla passar in i den lugna byn, med undantag för Kobolts
  farfar. Han är öns stora uppfinnare och låter aldrig en galen idé bli liggande. En dag utforskar Kobolt
  och hans goda vän Linnea en av farfars maskiner helt ensamma.
