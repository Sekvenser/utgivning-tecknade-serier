description: Vi lever i en tid besatt av fysisk skönhet. Fotografier - hur vi ser ut på bild - har blivit
  allt viktigare och kommit att uppta allt större plats i vårt medvetande. Vi kommunicerar genom bilder,
  dejtar genom bilder, följer andras liv och berättar om vårt eget genom bilder. Alla går runt med en
  kamera i handen. Vi har alla förvandlats till voyeurer, fast det vi betraktar är oss själva. Sexighet
  har förvandlats en diffus form av status och kompetens.  Samtidigt som kvinnlig fysisk skönhet är mer
  spridd och dyrkad än någonsin, genom miljarder fotografier och selfies, är skönheten hotad, eftersom
  den approprierats av kapitalismen och gjorts till ett konsumtionsobjekt.  Med hjälp av av filosofiska
  och sociologiska teorier speglar Liv Strömquist vår tids upptagenhet av att vara snygg, och berättar
  om några kvinnor genom historien vars liv styrts av deras yttre. Gamla Testamentets Rakel, som Josef
  gifte sig med eftersom hon var vackrare än sin syster. Kejsarinnorna Sisi och Eugénie som tävlade i
  vem som hade den smalaste midjan och fick hela Europas adelsdamer att följa efter. Snövits mamma som
  försöker hitta ett sätt att förhålla sig till den fysiska skönhetens förgänglighet. Marilyn Monroe som
  blev fotograferad naken sex veckor innan sin död, Kim Kardashian som fotograferar sig själv och bysten
  av drottning Nefertiti som fyller alla som tittar på henne med en känsla av ett gåtfullt, meningslöst
  begär.  Som ingen annan sätter Liv Strömquist fingret på vår samtid. Det är roligt, insiktsfullt - och
  allt annat än smickrande.
